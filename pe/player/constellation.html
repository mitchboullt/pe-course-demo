.filters{position:fixed;left:18px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;

.filters button{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.06em;

#panel .links{margin-top:13px;display:flex;flex-direction:column;gap:6px}
#panel .links a,#panel .links span{font-family:"JetBrains Mono",monospace;font-size:11.5px;
  text-decoration:none;border:1px solid var(--line);border-radius:3px;padding:8px 11px;color:var(--ink);
  text-align:center}
#panel .links a:hover{border-color:var(--accent);color:var(--accent-hi)}
#panel .links span{color:var(--warn);border-style:dashed}
#panel .close{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--mut);
  font-size:17px;cursor:pointer;padding:4px 6px}
#tip{position:fixed;z-index:12;pointer-events:none;opacity:0;transition:opacity .14s;
  background:var(--void);border:1px solid var(--line);border-radius:3px;padding:6px 10px;

    if(!sample) return;

    cx.beginPath(); cx.arc(cxp, cyp, r, 0, Math.PI*2);
    cx.strokeStyle = 'rgba(44,63,94,.5)'; cx.lineWidth = 1;
    cx.setLineDash(b === Math.max(...bands) ? [3,5] : []); cx.stroke(); cx.setLineDash([]);
  });
  // At rest only the selected node's neighbourhood is wired, or the whole map
  // becomes an unreadable mesh.
  const focus = hover >= 0 ? hover : selected;
  if(focus >= 0){
    cx.strokeStyle = 'rgba(201,162,39,.4)'; cx.lineWidth = 1;
    adj[focus].forEach(function(j){
      cx.beginPath();
      cx.moveTo(px(NODES[focus]), py(NODES[focus]));
      cx.lineTo(px(NODES[j]), py(NODES[j]));
      cx.stroke();
    });
  }
  NODES.forEach(function(n, k){
    const vis = visible(k);
    const r = radius(n);
    const isFocus = k === focus, near = focus >= 0 && adj[focus].indexOf(k) >= 0;
    cx.globalAlpha = vis ? (focus < 0 || isFocus || near ? 1 : 0.28) : 0.07;
    if(done.has(n.t)){
      const g = cx.createRadialGradient(px(n), py(n), 0, px(n), py(n), r*4.5);
      g.addColorStop(0, 'rgba(236,205,107,.5)'); g.addColorStop(1, 'rgba(236,205,107,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(px(n), py(n), r*4.5, 0, Math.PI*2); cx.fill();
    }
    cx.beginPath(); cx.arc(px(n), py(n), r, 0, Math.PI*2);
    if(n.w){ cx.fillStyle = isFocus ? '#fff' : (done.has(n.t) ? '#eccd6b' : '#dfe8fb'); cx.fill(); }
    else { cx.strokeStyle = isFocus ? '#eccd6b' : '#d8a13a'; cx.lineWidth = 1.3; cx.stroke(); }
    if(isFocus || (vis && query)){
      cx.globalAlpha = 1; cx.fillStyle = '#e8ecf4';
      cx.font = '12px Spectral, Georgia, serif'; cx.textAlign = 'center';
      cx.fillText(n.t.slice(0, 34), px(n), py(n) - r - 7);
    }
  });
  cx.globalAlpha = 1;
}

function hit(mx, my){
  let best = -1, bd = 16;
  NODES.forEach(function(n, k){
    if(!visible(k)) return;
    const d = Math.hypot(px(n) - mx, py(n) - my);
    if(d < Math.max(bd, radius(n) + 8) && d < bd){ bd = d; best = k; }
  });
  return best;
}

function showPanel(k){
  const n = NODES[k];
  selected = k;
  document.getElementById('pt').textContent = n.t;
  document.getElementById('pm').textContent =
    (n.p ? 'Phase ' + n.p + ' · ' : '') + (n.w ? '' : 'not written yet · ') + adj[k].length + ' links';
  document.getElementById('po').textContent = n.o || (n.w ? '' : 'Referenced by other lessons, but no note exists yet.');
  const qs = document.getElementById('pq'); qs.innerHTML = '';
  (n.q || []).forEach(function(q){ const li = document.createElement('li'); li.textContent = q; qs.appendChild(li); });
  const links = document.getElementById('pl'); links.innerHTML = '';
  if(n.h){ const a = document.createElement('a'); a.href = n.h.split('/').pop(); a.textContent = 'Open lesson →'; links.appendChild(a); }
  else { const sp = document.createElement('span'); sp.textContent = '✦ Not charted yet'; links.appendChild(sp); }
  document.getElementById('panel').classList.add('show');
  draw();
}

cv.addEventListener('pointermove', function(e){
  const k = hit(e.clientX, e.clientY);
  const tip = document.getElementById('tip');
  if(k !== hover){ hover = k; draw(); }
  if(k >= 0){
    tip.textContent = NODES[k].t;
    tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 13) + 'px';
    tip.style.top = (e.clientY + 15) + 'px';
    tip.classList.add('on');
    cv.style.cursor = 'pointer';
  } else { tip.classList.remove('on'); cv.style.cursor = 'default'; }
});
cv.addEventListener('pointerdown', function(e){
  const k = hit(e.clientX, e.clientY);
  if(k >= 0) showPanel(k);
  else { selected = -1; document.getElementById('panel').classList.remove('show'); draw(); }
});
document.getElementById('pclose').onclick = function(){
  selected = -1; document.getElementById('panel').classList.remove('show'); draw();
};
document.getElementById('search').addEventListener('input', function(e){
  query = e.target.value.trim().toLowerCase(); draw();
});
function setFilter(f, btn){
  filter = f;
  document.querySelectorAll('.filters button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on'); draw();
}
document.getElementById('fAll').onclick = function(){ setFilter('all', this); };
document.getElementById('fUnwritten').onclick = function(){ setFilter('unwritten', this); };
document.getElementById('fDone').onclick = function(){ setFilter('done', this); };
window.addEventListener('resize', resize);
resize();
</script>

  </div>

<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>
