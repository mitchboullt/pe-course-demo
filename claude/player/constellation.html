<style>

<script>
const NODES = [{"t":"What is generative AI","h":"player-gswc/what-is-generative-ai.html","w":1,"p":"0","d":22,"o":"Generative AI is a kind of artificial intelligence that creates new content — text, images, audio, video, or software code — instead of only sorting or labeling content that already exists.","q":["How exactly does a *prompt* steer the output? (Leads toward prompting lessons.)","What is a \"token\" and a \"context window\" in more depth?","How is Claude specifically built and adapted?"],"x":0.2218,"y":0.0505,"b":0},{"t":"Large language models & tokens","h":"player-gswc/large-language-models-tokens.html","w":1,"p":"0","d":19,"o":"A large language model (LLM) is the kind of AI that powers Claude — it generates text by repeatedly guessing the next small chunk of text — and a token is that small chunk: the basic unit an LLM reads and writes, roughly","q":["How do I *choose* between Claude models with different context-window sizes?","How does the model decide *which* next token to pick? (Leads toward prompting and sampling.)","What practical tricks help when a document is too big for the window?"],"x":0.0133,"y":0.2271,"b":0},{"t":"The Claude model family","h":"player-gswc/the-claude-model-family.html","w":1,"p":"0","d":11,"o":"The Claude model family is the set of related AI models (named in tiers — Haiku, Sonnet, Opus, and Fable) that all do the same basic job but trade off how capable they are against how fast and how cheap they are, so you ","q":["Where exactly do I choose or type a model when using Claude?","How do I estimate what a task will cost given per-token prices?","When a new model version appears, how do I decide whether to switch?"],"x":-0.2272,"y":-0.0121,"b":0},{"t":"claude.ai (web app)","h":"player-gswc/claude-ai-web-app.html","w":1,"p":"1","d":22,"o":"claude.ai is Anthropic's consumer chat app for Claude — a website (with matching mobile and desktop apps) where you get things done just by *talking* to Claude in plain language, no coding required.","q":["What exactly is a \"token,\" and why does the API charge per token?","How is a Projects's knowledge base different from just uploading files to one chat?","When would I want the Claude Desktop app instead of the browser?"],"x":0.3284,"y":0.0663,"b":1},{"t":"Claude Desktop app","h":"player-gswc/claude-desktop-app.html","w":1,"p":"1","d":8,"o":"The Claude Desktop app is a native, downloadable program that puts Claude directly on your Mac or Windows computer (with Linux still in beta), instead of only inside a web browser tab.","q":["What exactly is an MCP server, and what tools can I connect? (see MCP servers)","When should I use the desktop app versus the web app versus something else?"],"x":0.1554,"y":0.2968,"b":1},{"t":"Claude Code","h":"player-gswc/claude-code.html","w":1,"p":"1","d":16,"o":"Claude Code is Anthropic's *agentic coding tool*: you describe what you want in plain language, and it reads your project's files, edits them, runs commands, and works with your development tools to actually get the task","q":["What exactly is an MCP server, and how do I add one? → MCP servers","What's a \"skill,\" and when would I make one? → Claude Code Skills","How do I review and undo a change Claude Code made?"],"x":-0.3029,"y":-0.143,"b":1},{"t":"The Claude API & Console","h":"player-gswc/the-claude-api-console.html","w":1,"p":"1","d":18,"o":"The Claude API is a way for *computer programs* to talk to Claude directly over the internet (instead of a person typing in a chat window), and the Anthropic Console is the website where you set that up — create your key","q":["What exactly is a \"token,\" and how do I estimate how many a request will use?","Which model should I pick, and how does that change the price?","What is a \"system prompt\" and how do I include one in a request?"],"x":0.2138,"y":-0.2579,"b":1},{"t":"Prompting basics","h":"player-gswc/prompting-basics.html","w":1,"p":"2","d":15,"o":"A prompt is the plain-language text you type to Claude that tells it *what to do, how to do it, and what kind of response you expect*.","q":["How exactly do I *structure* a longer prompt, and how do I add examples? → Prompt structure & examples","Where do I set a role so it sticks for the whole chat? → System prompts","*(Coverage note: this lesson intentionally does not cover more advanced techniques like chain-of-thought prompting or prompt chaining — those are not yet part of verified knowledge for this concept. T"],"x":0.4349,"y":0.0818,"b":2},{"t":"System prompts","h":"player-gswc/system-prompts.html","w":1,"p":"2","d":16,"o":"A system prompt is a set of standing instructions you give Claude — its role, goal, tone, and rules — that sits *separate from* your actual question and shapes how Claude answers everything that follows.","q":["How long/detailed should a system prompt be for a complex task?","How do system prompts interact with tools, documents, or examples in a Project?"],"x":0.0823,"y":0.4348,"b":2},{"t":"Prompt structure & examples","h":null,"w":1,"p":"2","d":9,"o":"","q":["How does structuring differ inside a **system prompt** versus a normal message? (see System prompts)","When is chain-of-thought worth the extra tokens? [needs-verification]"],"x":0.1312,"y":-0.4226,"b":2},{"t":"Projects","h":"player-gswc/projects.html","w":1,"p":"3","d":12,"o":"A Claude Project is a self-contained workspace on claude.ai that bundles a set of chats, a shared knowledge base, and custom instructions all focused on a single goal.","q":["How exactly do I write good custom instructions? (See System prompts.)","What file types can I put in the knowledge base?","When should I use a Project versus just a normal chat?"],"x":0.5216,"y":0.1744,"b":3},{"t":"Artifacts","h":null,"w":1,"p":"3","d":9,"o":"","q":["How exactly do interactive React-component Artifacts behave for a non-coder?","What will the beta \"AI capabilities inside Artifacts\" feature let me do once it's stable?","When should I keep something as an Artifact versus building it inside a Projects?"],"x":-0.3589,"y":0.4168,"b":3},{"t":"MCP servers","h":"player-gswc/mcp-servers.html","w":1,"p":"4","d":18,"o":"An MCP server is a small program that plugs an outside tool or source of information (like your files, a calendar, or a website's data) into Claude, so Claude can actually use it.","q":["Where do I find trustworthy MCP servers to connect?","What does the approval prompt actually look like when Claude wants to act?","How is an MCP server different from a Skill?"],"x":0.5494,"y":-0.3613,"b":4},{"t":"Claude Code Skills","h":"player-gswc/claude-code-skills.html","w":1,"p":"4","d":9,"o":"A Claude Code Skill is a folder on your computer containing a `SKILL.md` instruction file (plus any optional scripts or files it needs), which Claude finds and loads on its own when your request matches what that Skill i","q":["How do I write a *great* description that triggers reliably?","How do bundled scripts inside a Skill get executed?","How does sharing/portability work across other platforms in practice?"],"x":-0.6099,"y":-0.2456,"b":4},{"t":"Agents & the Agent SDK","h":"player-gswc/agents-the-agent-sdk.html","w":1,"p":"5","d":12,"o":"An agent is an AI that uses tools over and over in a loop to work through a multi-step task on its own, and the Claude Agent SDK is a piece of software you run yourself that gives your program that same loop — the very o","q":["When should I use the Agent SDK vs. Managed Agents for my own project?","How do subagents divide up a big task?","What does writing a minimal agent in Python actually look like?"],"x":0.6297,"y":-0.4344,"b":5},{"t":"Loops & automation","h":"player-gswc/loops-automation.html","w":1,"p":"5","d":11,"o":"The agentic loop is the back-and-forth cycle in which Claude asks to use a tool, something runs that tool, the result is handed back, and this repeats until Claude has a finished answer — and automation means having soft","q":["How do I actually write a system prompt and pick tools for a Managed Agent?","What does human-in-the-loop approval look like in practice?","When should I choose the Agent SDK over Managed Agents?"],"x":-0.5841,"y":-0.494,"b":5},{"t":"Safety & limits","h":"player-gswc/safety-limits.html","w":1,"p":"6","d":8,"o":"\"Safety & limits\" means knowing the ways Claude can be wrong or fall short — and the simple habits (checking its facts, protecting your private information, keeping a human in charge) that keep you safe while using it.","q":["Does Claude actively refuse harmful or disallowed requests, and what does its Usage Policy say? *(Not verified in this lesson — forward-linked for a future revision.)*","What exactly is the current knowledge-cutoff date for each model? *(Model-specific; see the model family note.)*"],"x":0.8462,"y":0.2126,"b":6},{"t":"Large Language Models","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":0.9779,"y":0.0645,"b":7},{"t":"Foundation Models","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":0.8742,"y":0.443,"b":7},{"t":"AI Hallucinations","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":0.6412,"y":0.7411,"b":7},{"t":"What Is Claude","h":null,"w":0,"p":"","d":2,"o":"","q":[],"x":0.3808,"y":0.903,"b":7},{"t":"Getting Started with Claude","h":null,"w":0,"p":"","d":4,"o":"","q":[],"x":-0.3101,"y":0.9296,"b":7},{"t":"Ways to Use Claude","h":null,"w":0,"p":"","d":2,"o":"","q":[],"x":-0.8872,"y":0.4162,"b":7},{"t":"Tools and Agents","h":null,"w":0,"p":"","d":2,"o":"","q":[],"x":-0.5665,"y":-0.7997,"b":7},{"t":"Claude Desktop","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":-0.2073,"y":-0.9578,"b":7},{"t":"Skills","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":0.1852,"y":-0.9623,"b":7},{"t":"Connecting a Local MCP Server","h":null,"w":0,"p":"","d":1,"o":"","q":[],"x":0.5218,"y":-0.8296,"b":7},{"t":"Ways to Extend Claude","h":null,"w":0,"p":"","d":3,"o":"","q":[],"x":0.7526,"y":-0.6277,"b":7}];
const EDGES = [[0,1],[0,17],[0,18],[0,19],[0,20],[0,21],[1,2],[1,21],[0,2],[2,6],[2,21],[0,3],[1,3],[3,4],[3,5],[3,12],[3,10],[3,11],[0,4],[4,12],[4,22],[0,5],[4,5],[5,12],[5,13],[5,22],[0,6],[1,6],[3,6],[6,8],[0,7],[1,7],[7,8],[7,9],[2,7],[8,9],[8,10],[10,11],[5,11],[12,20],[12,23],[12,24],[12,25],[12,26],[12,27],[12,13],[13,14],[1,14],[6,14],[14,15],[5,14],[12,14],[14,27],[12,15],[6,15],[5,15],[15,27],[0,16],[1,16],[6,16],[7,16],[16,21]];      // [fromIdx, toIdx]
const COURSE = "Getting Started with Claude";
const cv = document.getElementById('sky'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, cxp = 0, cyp = 0, scale = 1;
let hover = -1, selected = -1, filter = 'all', query = '';

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('pe-demo-progress::' + COURSE) || '[]')); } catch(e){}

const adj = NODES.map(function(){ return []; });
EDGES.forEach(function(e){ adj[e[0]].push(e[1]); adj[e[1]].push(e[0]); });

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cxp = W / 2; cyp = H / 2 + 10;
  scale = Math.min(W, H) * 0.44;
  draw();
}
const px = n => cxp + n.x * scale;
const py = n => cyp + n.y * scale;
const radius = n => 1.9 + Math.min(5.2, Math.sqrt(n.d || 0) * 1.15);

function visible(k){
  const n = NODES[k];
  if(query && n.t.toLowerCase().indexOf(query) < 0) return false;
  if(filter === 'unwritten') return !n.w;
  if(filter === 'done') return done.has(n.t);
  return true;
}

function draw(){
  cx.clearRect(0, 0, W, H);
  // Phase bands: the course's own structure, drawn as orbits.
  const bands = [...new Set(NODES.map(n => n.b))].sort((a,b) => a-b);
  bands.forEach(function(b){
    const sample = NODES.find(n => n.b === b);
    if(!sample) return;
    const r = Math.hypot(sample.x, sample.y) * scale;
    cx.beginPath(); cx.arc(cxp, cyp, r, 0, Math.PI*2);
    cx.strokeStyle = 'rgba(44,63,94,.5)'; cx.lineWidth = 1;
    cx.setLineDash(b === Math.max(...bands) ? [3,5] : []); cx.stroke(); cx.setLineDash([]);
  });
  // At rest only the selected node's neighbourhood is wired, or the whole map
  // becomes an unreadable mesh.
  const focus = hover >= 0 ? hover : selected;
  if(focus >= 0){
    cx.strokeStyle = 'rgba(201,162,39,.4)'; cx.lineWidth = 1;
    adj[focus].forEach(function(j){
      cx.beginPath();
      cx.moveTo(px(NODES[focus]), py(NODES[focus]));
      cx.lineTo(px(NODES[j]), py(NODES[j]));
      cx.stroke();
    });
  }
  NODES.forEach(function(n, k){
    const vis = visible(k);
    const r = radius(n);
    const isFocus = k === focus, near = focus >= 0 && adj[focus].indexOf(k) >= 0;
    cx.globalAlpha = vis ? (focus < 0 || isFocus || near ? 1 : 0.28) : 0.07;
    if(done.has(n.t)){
      const g = cx.createRadialGradient(px(n), py(n), 0, px(n), py(n), r*4.5);
      g.addColorStop(0, 'rgba(236,205,107,.5)'); g.addColorStop(1, 'rgba(236,205,107,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(px(n), py(n), r*4.5, 0, Math.PI*2); cx.fill();
    }
    cx.beginPath(); cx.arc(px(n), py(n), r, 0, Math.PI*2);
    if(n.w){ cx.fillStyle = isFocus ? '#fff' : (done.has(n.t) ? '#eccd6b' : '#dfe8fb'); cx.fill(); }
    else { cx.strokeStyle = isFocus ? '#eccd6b' : '#d8a13a'; cx.lineWidth = 1.3; cx.stroke(); }
    if(isFocus || (vis && query)){
      cx.globalAlpha = 1; cx.fillStyle = '#e8ecf4';
      cx.font = '12px Spectral, Georgia, serif'; cx.textAlign = 'center';
      cx.fillText(n.t.slice(0, 34), px(n), py(n) - r - 7);
    }
  });
  cx.globalAlpha = 1;
}

function hit(mx, my){
  let best = -1, bd = 16;
  NODES.forEach(function(n, k){
    if(!visible(k)) return;
    const d = Math.hypot(px(n) - mx, py(n) - my);
    if(d < Math.max(bd, radius(n) + 8) && d < bd){ bd = d; best = k; }
  });
  return best;
}

function showPanel(k){
  const n = NODES[k];
  selected = k;
  document.getElementById('pt').textContent = n.t;
  document.getElementById('pm').textContent =
    (n.p ? 'Phase ' + n.p + ' · ' : '') + (n.w ? '' : 'not written yet · ') + adj[k].length + ' links';
  document.getElementById('po').textContent = n.o || (n.w ? '' : 'Referenced by other lessons, but no note exists yet.');
  const qs = document.getElementById('pq'); qs.innerHTML = '';
  (n.q || []).forEach(function(q){ const li = document.createElement('li'); li.textContent = q; qs.appendChild(li); });
  const links = document.getElementById('pl'); links.innerHTML = '';
  if(n.h){ const a = document.createElement('a'); a.href = n.h.split('/').pop(); a.textContent = 'Open lesson →'; links.appendChild(a); }
  else { const sp = document.createElement('span'); sp.textContent = '✦ Not charted yet'; links.appendChild(sp); }
  document.getElementById('panel').classList.add('show');
  draw();
}

cv.addEventListener('pointermove', function(e){
  const k = hit(e.clientX, e.clientY);
  const tip = document.getElementById('tip');
  if(k !== hover){ hover = k; draw(); }
  if(k >= 0){
    tip.textContent = NODES[k].t;
    tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 13) + 'px';
    tip.style.top = (e.clientY + 15) + 'px';
    tip.classList.add('on');
    cv.style.cursor = 'pointer';
  } else { tip.classList.remove('on'); cv.style.cursor = 'default'; }
});
cv.addEventListener('pointerdown', function(e){
  const k = hit(e.clientX, e.clientY);
  if(k >= 0) showPanel(k);
  else { selected = -1; document.getElementById('panel').classList.remove('show'); draw(); }
});
document.getElementById('pclose').onclick = function(){
  selected = -1; document.getElementById('panel').classList.remove('show'); draw();
};
document.getElementById('search').addEventListener('input', function(e){
  query = e.target.value.trim().toLowerCase(); draw();
});
function setFilter(f, btn){
  filter = f;
  document.querySelectorAll('.filters button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on'); draw();
}
document.getElementById('fAll').onclick = function(){ setFilter('all', this); };
document.getElementById('fUnwritten').onclick = function(){ setFilter('unwritten', this); };
document.getElementById('fDone').onclick = function(){ setFilter('done', this); };
window.addEventListener('resize', resize);
resize();
</script>

  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>
</body></html>
