<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }
</style>

<div id="pe-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0b1020;display:flex;align-items:center;justify-content:center;font-family:Spectral,Georgia,serif">
  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:34px;max-width:360px;width:88%;text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">
    <div style="font-family:Cinzel,serif;font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:8px">The Knowledge Engine</div>
    <div style="color:#a2b3cd;font-size:13.5px;margin-bottom:20px">Enter your access code to continue.</div>
    <input id="pe-gate-input" type="password" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:15px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:12px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "3", "title": "Phase 3 Test — Data Centers, Power, Networking, Data", "pass_mark": 20, "questions": [{"n": 1, "prompt": "Data-center capacity is quoted in \"critical IT load.\" What does that measure?", "options": {"A": "The facility's total draw from the grid, including cooling and power delivery", "B": "The peak output of the site's backup diesel generators", "C": "The usable electrical capacity at the data center floor available to compute, server and networking equipment — excluding cooling, power delivery and other facility systems", "D": "The floor area of the data halls, converted into an electrical equivalent"}, "answer": "C", "explanation": "Critical IT load is the usable capacity available to compute, servers and networking on the floor, explicitly excluding cooling and power delivery. It is the basis on which all capacity in this course is quoted."}, {"n": 2, "prompt": "A hyperscaler announces a 100 MW building (critical IT load) built to an AI-spec PUE of 1.25. What is the total grid draw, and how much of it is overhead?", "options": {"A": "100 MW total, because overhead is already inside the 100 MW figure", "B": "125 MW total, of which 25 MW is overhead", "C": "80 MW total, of which 20 MW is overhead", "D": "109 MW total, of which 9 MW is overhead"}, "answer": "B", "explanation": "Grid draw ≈ IT load × PUE, so 100 MW × 1.25 = 125 MW, leaving 25 MW of overhead. Option D uses Google's 1.09 fleet PUE; the 1.54 industry average would have implied 154 MW."}, {"n": 3, "prompt": "A vendor deck states: \"Tier III certification guarantees 99.982% availability.\" What is the correct response?", "options": {"A": "Accurate — that figure appears in the current Uptime Institute Tier Standard", "B": "The figure belongs to Tier IV; Tier III is certified at a lower availability", "C": "Tier ratings apply only to hyperscale facilities, so no availability figure applies to colocation", "D": "The Uptime Institute removed all references to expected downtime per year from the Tier Standard in 2009; tiers classify redundancy topology, and Tier III means concurrently maintainable — redundant distribution paths so any component can be shut down and maintained without impacting IT operations"}, "answer": "D", "explanation": "The Uptime Institute removed all references to expected downtime per year from the Tier Standard in 2009, and the current Tier Standard of Topology assigns no availability predictions. Tier III's defining property is concurrent maintainability via redundant distribution paths."}, {"n": 4, "prompt": "Per Thunder Said Energy (June 2026), what is the all-in capex for a compute-heavy AI data center, and what dominates it?", "options": {"A": "About $40,000/kW (roughly $40M per MW), of which more than half is the GPUs", "B": "About $40,000/kW, of which more than half is the building shell and electrical plant", "C": "About $12M per MW, which this course treats as the verified facility-only benchmark", "D": "About $4,000/kW, split roughly evenly between the building and the IT equipment"}, "answer": "A", "explanation": "Thunder Said Energy's June 2026 buildup puts all-in capex for compute-heavy AI data centers at about $40,000/kW (~$40M/MW), of which over half is the GPUs. No facility-only benchmark with stated scope survived this course's verification, which is why option C is a trap."}, {"n": 5, "prompt": "LBNL's *Queued Up* 2025 edition reports roughly 1,400 GW of generation actively seeking US interconnection at end-2024. Which reading is best supported?", "options": {"A": "That capacity is already under construction and will connect within the median wait", "B": "The queue is an application backlog with a low historical exercise rate: of the capacity that applied between 2000 and 2019, only 13% was in commercial operation by end-2024 while 77% had withdrawn", "C": "Generation supply now exceeds data-center demand, so power has stopped being a binding constraint", "D": "The figure measures energy rather than capacity, so it cannot be compared with campus announcements at all"}, "answer": "B", "explanation": "The queue is an application pile, not a pipeline: 13% of 2000–2019 applicant capacity was operating by end-2024 and 77% withdrew, with median waits doubling from under 2 to over 4 years. Queued GW is an option with a low historical exercise rate."}, {"n": 6, "prompt": "Which statement correctly distinguishes a gigawatt (GW) from a terawatt-hour (TWh)?", "options": {"A": "They measure the same quantity in different units; 1 GW equals 1 TWh", "B": "GW measures energy accumulated over a period; TWh measures instantaneous power", "C": "GW measures instantaneous power (a rate) while TWh measures energy over time (a quantity); one GW sustained for a full year produces about 8.76 TWh", "D": "GW is the unit used for data centers and TWh the unit used for power plants, but both measure the same physical quantity"}, "answer": "C", "explanation": "GW is a rate (instantaneous power); TWh is an accumulated quantity (energy over time), and 1 GW sustained for a year is about 8.76 TWh. Capacity claims and consumption claims are therefore different kinds of statement."}, {"n": 7, "prompt": "How do the Microsoft–Constellation deal (announced September 20, 2024) and the Amazon–X-energy deal (October 16, 2024) differ?", "options": {"A": "They do not differ materially — both are 20-year power purchase agreements on existing, operating nuclear plants", "B": "Crane is anchor equity in a pre-commercial reactor developer, while Amazon–X-energy is a PPA on an existing plant", "C": "Both had delivered commercial small-modular-reactor electrons to their buyers by 2025", "D": "Crane is a 20-year PPA on a restartable existing plant — Three Mile Island Unit 1, about 835 MW, a roughly $1.6B restart, announced online date 2028 — while Amazon–X-energy is about $500M of anchor equity in a pre-commercial SMR developer targeting more than 5 GW by 2039"}, "answer": "D", "explanation": "Crane buys near-term electrons through a long-dated offtake on an existing restartable asset; the X-energy deal buys development equity in reactors that did not commercially exist at signing, with the target capacity landing by 2039. Same constraint, two very different points on the risk curve."}, {"n": 8, "prompt": "What does \"behind the meter\" mean, and which verified case shows its risk?", "options": {"A": "Buying power at wholesale from a neighbouring utility; the risk case is transformer lead times of 80–210 weeks", "B": "Generating power on-site, on the customer's side of the utility meter, so the load never waits in the interconnection queue — and xAI's Memphis Colossus, which ran at least 35 gas turbines (about 421 MW at peak) before grid connection, drew a June 2025 Clean Air Act notice of intent to sue from the Southern Environmental Law Center on behalf of the NAACP", "C": "Deferring payment for grid power until a campus energizes; the risk case is the Crane restart schedule", "D": "Contracting future SMR output ahead of commercial operation; the risk case is the Kairos test reactors in Oak Ridge"}, "answer": "B", "explanation": "Behind-the-meter generation sits on the customer's side of the utility meter, so the load never enters the interconnection queue — trading queue risk for regulatory risk. The xAI Memphis turbines and the June 2025 SELC/NAACP Clean Air Act notice are the verified precedent."}, {"n": 9, "prompt": "A consultant's deck says \"air cooling fails above 20 kW per rack.\" What is the correct treatment?", "options": {"A": "Accept it — 20 kW is a hard physical limit of air cooling", "B": "Reject it — air cooling has been demonstrated at 120 kW per rack given sufficient fan power", "C": "Treat the air wall as an economic range of roughly 20–40 kW per rack: Uptime's 2024 survey of 820 operators produced a modal answer of 20–29 kW (29%) with 73% saying 20 kW or above, while SemiAnalysis documents purpose-designed AI facilities running air cooling at 30–40 kW+", "D": "Reject it — the binding limit is data-hall floor area, not power per rack"}, "answer": "C", "explanation": "The verified evidence describes an economic range, not a cliff: survey answers spread from under 10 kW to over 60 kW around a 20–29 kW mode, and purpose-built AI designs stretch air to 30–40 kW+. Where the wall sits depends on the building."}, {"n": 10, "prompt": "NVIDIA's GB200 NVL72 takes coolant in at 25 °C at two liters per second, exiting about 20 °C warmer. Why is \"this rack consumes two liters of water per second\" a misreading?", "options": {"A": "The published figure is per minute, not per second", "B": "Two liters per second is a circulation rate around a closed loop; consumption happens — if at all — at the building's heat-rejection stage, and only in evaporative designs", "C": "The rack circulates a dielectric fluid, so no water is involved anywhere in the system", "D": "The figure describes an entire data hall rather than a single rack"}, "answer": "B", "explanation": "Two liters per second is circulation through a closed loop, not consumption; the same fluid goes around again. Water is consumed only at the heat-rejection stage, and only where the design is evaporative."}, {"n": 11, "prompt": "Which statement best describes direct liquid cooling as of Uptime's early-2024 Cooling Systems Survey (n=964)?", "options": {"A": "22% of operators used direct liquid cooling anywhere in their facilities, with nearly half of those users running it on under 10% of their racks; water-cooled cold plates were dominant at 64% of installations, with immersion a minority (single-phase 26%, two-phase 13%)", "B": "A majority of operators had already converted their fleets to two-phase immersion", "C": "64% of operators had deployed liquid cooling across most of their racks, driven mainly by energy-efficiency targets", "D": "Adoption was effectively zero, because no shipping hardware yet required liquid cooling"}, "answer": "A", "explanation": "Adoption was still early exactly when the hardware made liquid mandatory: 22% of operators used any DLC, mostly on under 10% of racks, with cold plates dominant and immersion a minority. Density (76%) drove adoption; cost (41%) and reliability (38%) held it back."}, {"n": 12, "prompt": "A hyperscaler announces that its new data centers \"consume zero water for cooling.\" What must an analyst check before treating the water problem as solved?", "options": {"A": "Nothing — a zero-water design eliminates the facility's water footprint", "B": "Only whether the figure was measured in liters or in gallons", "C": "The claim's scope: it is a site-level, cooling-only statement, while source WUE also counts the water used to generate the facility's electricity — and waterless systems generally consume more energy than evaporative ones", "D": "Whether the site uses rear-door heat exchangers, since only that technology can be waterless"}, "answer": "C", "explanation": "\"Zero water for cooling\" is a site-level, cooling-scope claim; source WUE counts the water embedded in the electricity the facility consumes, and waterless designs generally use more electricity. The footprint may shrink, move, or both — the verified set does not settle which for any specific design."}, {"n": 13, "prompt": "Why did power displace fiber proximity as the threshold criterion for siting AI training campuses?", "options": {"A": "Fiber is no longer available outside major metropolitan areas", "B": "Training needs enormous internal GPU-to-GPU bandwidth but tolerates milliseconds of external latency, so campuses can be sited against the power map rather than the population map — and 84% of surveyed decision-makers rank power availability in their top three criteria, with a site lacking confirmed contractual utility power effectively disqualified on arrival", "C": "Training is highly latency-sensitive to end users, which forces campuses to sit next to generation", "D": "Regulation now requires training facilities to be sited away from population centers"}, "answer": "B", "explanation": "Training's latency-insensitivity between regions is the workload property that broke the old fiber-adjacency logic, letting campuses follow cheap power and land. The power screen is a threshold test, not a scoring factor: no contractual capacity, no site."}, {"n": 14, "prompt": "Which figures describe Northern Virginia at the end of 2025 (CBRE, March 18, 2026)?", "options": {"A": "About 4,039.6 MW of inventory, up 37% year over year, at 0.5% vacancy with just 21.5 MW available and 96% of 2026 scheduled supply already pre-committed", "B": "Shrinking inventory as tenants relocated to Texas, with vacancy above 10%", "C": "About 400 MW of inventory at 5% vacancy, with 2026 supply largely uncommitted", "D": "Flat inventory at 0.5% vacancy, because no new supply was scheduled for delivery"}, "answer": "A", "explanation": "Northern Virginia grew 37% in the same year it hit 0.5% vacancy, with only 21.5 MW available and 96% of 2026 supply pre-committed. The market is simultaneously booming and sold out, which is what pushed $155–$185/kW asking rates and spillover down I-95."}, {"n": 15, "prompt": "Using only verified facts as of mid-2026, which placement on the announced / under-construction / operational ladder is correct?", "options": {"A": "Stargate operational; Fairwater facility 1 announced only", "B": "Fairwater facility 1 announced; Fairwater facility 2 operational; Stargate contracted", "C": "Stargate, Prometheus and both Fairwater facilities were all operational", "D": "Stargate: announced (January 21, 2025 — a $500B-over-four-years intent, attributed to its principals, with nothing beyond the announcement in the verified set); Fairwater facility 1: declared fully operational in June 2026; Fairwater facility 2: under construction ($4B, expected 2028); Prometheus: announced July 2025 and at its 2026 target energization window"}, "answer": "D", "explanation": "Only Fairwater 1 sits on the operational rung; Stargate remains an announced, attributed intent in the verified record, Fairwater 2 is under construction, and Prometheus reached its target window without a declared-operational statement. Flattening those rungs into one \"buildout\" number is how headline trillions get built."}, {"n": 16, "prompt": "xAI's Colossus reached 100,000 NVIDIA Hopper GPUs in 122 days inside a former Electrolux factory in Memphis. What does that demonstrate?", "options": {"A": "That greenfield gigawatt campuses can now be built in under four months", "B": "That grid interconnection has ceased to be a constraint on large AI builds", "C": "That brownfield conversion plus behind-the-meter power — scaling roughly 15 MW of legacy industrial power to about 250 MW with on-site generation buffered by Tesla Megapacks — can compress build time by bypassing the interconnection queue, which demonstrates the queue's cost rather than its absence", "D": "That market tightness in Northern Virginia has no bearing on where new capacity gets built"}, "answer": "C", "explanation": "Colossus worked because it skipped both new construction and the grid queue, using an existing industrial shell plus on-site generation with Megapack buffering. It measures the cost of the interconnection queue rather than showing the constraint has gone away."}, {"n": 17, "prompt": "Why does every step of standard data-parallel training depend on the network?", "options": {"A": "After each backward pass, every GPU's locally computed gradients must be averaged across all processes by an all-reduce collective (PyTorch DDP launches these per gradient bucket; NCCL implements the primitives), so training throughput depends directly on interconnect bandwidth and latency", "B": "Because each GPU must fetch its next batch of training data from remote storage before it can compute anything", "C": "Because a checkpoint is written to shared storage after every forward pass", "D": "Because the model's parameters live on a central server and are read over the network for each token"}, "answer": "A", "explanation": "Data-parallel training synchronizes globally after every backward pass via an all-reduce, so interconnect bandwidth and latency sit directly in the throughput denominator. A slow fabric idles millions of dollars of silicon every step."}, {"n": 18, "prompt": "Meta disclosed in March 2024 that it had built two clusters of 24,576 H100s each — one on RoCE Ethernet with Arista 7800 switches, one on NVIDIA Quantum2 InfiniBand, both at 400 Gb/s endpoints — and that Llama 3 was trained on the Ethernet cluster. What does this establish?", "options": {"A": "That InfiniBand is technically incapable of frontier-scale training", "B": "That Ethernet delivers measurably higher training throughput than InfiniBand", "C": "Nothing, because the two clusters differed in GPU count", "D": "That standards-based Ethernet can substitute for InfiniBand in production AI back-end networks at that scale — but not any performance ranking between the fabrics, since no head-to-head benchmark was disclosed"}, "answer": "D", "explanation": "The Meta disclosure is as close to a controlled experiment as infrastructure gets — same operator, same GPU count, same endpoint speed, one variable changed — and it proves substitutability at production scale. No head-to-head performance comparison exists in the verified record."}, {"n": 19, "prompt": "A press release announces a \"100,000-GPU cluster.\" Which two network numbers do you need before estimating the largest efficient training job, and what did Meta's design use?", "options": {"A": "The optical transceiver count and the switch vendor; Meta used 98,304 transceivers", "B": "The PUE and the rack density; Meta ran below 1.3 at 30 kW per rack", "C": "The scale-up domain size and the inter-island oversubscription ratio; Meta built islands with full fat-tree bandwidth inside and 7:1 oversubscription between them, so inter-island traffic runs 7x slower — topology, not GPU count, sets effective cluster size", "D": "The number of data halls and the tier rating; Meta used eight halls at Tier III"}, "answer": "C", "explanation": "Domain size and oversubscription ratio jointly bound the largest efficient job; a headline GPU count tells you procurement, not capability. Meta ran eight islands with full fat-tree bandwidth inside each and 7:1 oversubscription between them."}, {"n": 20, "prompt": "Which sequence correctly describes how a frontier training corpus is built, and what shrinkage it involves?", "options": {"A": "Acquire Common Crawl dumps → extract prose from HTML with trafilatura → filter on URL, language and quality → deduplicate with MinHash → tokenize with byte-pair encoding; FineWeb refined 96 Common Crawl dumps (summer 2013 to April 2024) into about 15 trillion tokens of clean English text, since grown past 18.5 trillion", "B": "Purchase licensed archives → translate → compress → store; deduplication is unnecessary because crawls do not repeat", "C": "Tokenize the raw crawl first, then filter and deduplicate the token stream; the finished corpus is roughly the same size as the raw crawl", "D": "Scrape the web live at training time, streaming raw HTML into the model with no curation stage"}, "answer": "A", "explanation": "The pipeline is extract → filter → deduplicate → tokenize, and the shrinkage is drastic: petabytes of raw crawl become trillions of tokens of usable text. FineWeb is the documented reference implementation."}, {"n": 21, "prompt": "Meta's Llama 3 storage tier delivered 240 PB across 7,500 SSD-equipped servers at 2 TB/s sustained and 7 TB/s peak. Which workload dimensions a system like that?", "options": {"A": "Steady-state capacity — holding the full multi-trillion-token corpus is the binding requirement", "B": "Serving inference requests to end users from the same cluster", "C": "Continuous logging of GPU telemetry across the cluster", "D": "Checkpointing — periodically saving each GPU's model state (1 MB–4 GB per GPU on Llama 3) produces highly bursty, synchronized writes from thousands of GPUs at once, and it is the burst rather than the average that sizes the system"}, "answer": "D", "explanation": "The Llama 3 paper identifies highly bursty checkpoint writes as the defining challenge, which is why the tier is quoted in TB/s and not just PB. Designers stage checkpoints on node-local SSD and copy them asynchronously precisely to smooth that spike."}, {"n": 22, "prompt": "How should an analyst characterize US AI-copyright law as of mid-2026, given the two 2025 rulings?", "options": {"A": "Settled in AI's favour: Judge Alsup held that training on copyrighted work is fair use in all circumstances", "B": "Unsettled, with the two risk channels underwritten separately: Alsup (Bartz v. Anthropic, June 2025) held training on legally acquired books to be fair use while pirate-library acquisition was not — producing the $1.5B settlement (about $3,000 per work across roughly 500,000 titles, final approval July 20, 2026) that prices only the acquisition channel — while Judge Stein largely denied dismissal in NYT v. Microsoft & OpenAI (order March 26 / opinion April 4, 2025), letting the core infringement claims proceed into discovery with no trial date set", "C": "Settled against AI: the Anthropic settlement established that all training on copyrighted work is infringement", "D": "Irrelevant to infrastructure analysis, since any damages would fall on publishers rather than on model owners"}, "answer": "B", "explanation": "The two rulings differ in procedural posture, works and district, and no controlling appellate precedent unifies them. The $1.5B settlement prices piracy-channel acquisition; training-is-infringement liability remains unpriced and in discovery."}, {"n": 23, "prompt": "A chatbot's reply is emerging token by token and it feels slow. Which phase is running, what bottlenecks it, and what optimization exists?", "options": {"A": "Decode — autoregressive, one token at a time, bottlenecked by memory bandwidth, because moving weights and cached keys and values out of GPU memory dominates latency rather than arithmetic speed; KV caching stores already-computed attention keys and values so they are reused rather than recomputed for every new token", "B": "Prefill — bottlenecked by memory bandwidth, with the KV cache reducing the arithmetic required", "C": "Decode — bottlenecked by raw compute throughput, with batching the only available optimization", "D": "Prefill — bottlenecked by network bandwidth to the storage tier"}, "answer": "A", "explanation": "Prefill processes the whole prompt in parallel and saturates compute; decode generates one token at a time and is memory-bandwidth-bound. KV caching trades recomputation for memory occupancy, which is exactly why decode's bottleneck is memory rather than math."}, {"n": 24, "prompt": "Why can't a frontier training run simply be split across two data centers in different states, and what follows from that?", "options": {"A": "Because export controls prohibit multi-state training runs", "B": "Because the training corpus cannot legally be copied to more than one facility", "C": "Because inference traffic would then be routed to the wrong region", "D": "Because a large training run behaves as one synchronized job whose computational graph cannot be split across facilities — so an outage or network partition forces a costly restart, training concentrates into single campuses, and local power adequacy becomes existential, which is also why training sites for abundant cheap power while inference distributes near users"}, "answer": "D", "explanation": "The synchronized, unsplittable computational graph is the load-bearing claim: it concentrates training into single campuses and makes an outage a run-restarting event. That concentration is how \"AI demand\" became \"power demand.\""}, {"n": 25, "prompt": "How should the inference revenue story and the price-decline data be held together?", "options": {"A": "Falling prices mean inference revenue has been collapsing, and inference's share of NVIDIA's data-center revenue has fallen since FY24", "B": "As a race: LLM inference prices fell 9x to 900x per year depending on the task (Epoch AI / Stanford AI Index, measuring 2022–2025, with Epoch cautioning that the fastest declines are the most recent and may not persist), while volume grew faster — inference was already about 40% of NVIDIA's FY24 data-center revenue of $47.5B per CFO Kress (February 21, 2024, and \"probably understated\" per Huang), and data-center revenue reached $75.2B in the quarter reported May 20, 2026, up 92% year over year", "C": "The 900x figure is the market-wide annual rate of decline and should be applied to all inference pricing", "D": "Deflation is irrelevant, because reasoning models raised the price per token roughly 100x"}, "answer": "B", "explanation": "Both forces are real and verified, and the honest position is a race rather than a verdict: quoting the 900x end as a market rate is a denominator error, and the demand side rests partly on vendor narrative. Watch whether token-volume growth keeps outrunning task-level price declines."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
</html>
