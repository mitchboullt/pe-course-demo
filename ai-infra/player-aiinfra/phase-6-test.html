<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }

  /* --- Responsive: phones ---------------------------------------------------
     One column already; what breaks on a phone is the fixed bottom bar (it sits
     under the home-indicator without a safe-area inset), the sticky title (it
     pushes the score off-screen), and sub-44px option rows. */
  html { -webkit-text-size-adjust:100%; }
  .bar { padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  @media (hover:none) { * { -webkit-tap-highlight-color:rgba(201,162,39,.18); } }
  @media (max-width:640px){
    .top { padding:11px 14px; gap:10px; }
    .top .title { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .top .score { font-size:11.5px; flex:none; }
    .top a.home { flex:none; font-size:12px; }
    .wrap { padding:18px 14px 132px; }
    h1 { font-size:20px; }
    .intro { padding:14px; font-size:14px; }
    .q { padding:16px 14px; }
    .qh { font-size:15px; }
    .opt { padding:13px 12px; min-height:44px; align-items:center; }
    .expl { font-size:13.5px; padding:10px 12px; }
    .result { padding:18px 14px; font-size:15px; }
    .result .big { font-size:28px; }
    .bar { padding:10px 14px; gap:10px; flex-wrap:wrap; }
    .bar .status { flex:0 0 100%; font-size:12.5px; order:-1; }
    .bar button { flex:1 1 auto; min-height:44px; padding:11px 14px; }
  }
</style>

<div id="pe-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0b1020;display:flex;align-items:center;justify-content:center;font-family:Spectral,Georgia,serif">
  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:clamp(22px,6vw,34px);max-width:360px;width:min(88%,360px);text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">
    <div style="font-family:Cinzel,serif;font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:8px">The Knowledge Engine</div>
    <div style="color:#a2b3cd;font-size:13.5px;margin-bottom:20px">Enter your access code to continue.</div>
    <input id="pe-gate-input" type="password" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:16px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:14px 12px;min-height:44px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "6", "title": "Phase 6 Test — The Financial Angles", "pass_mark": 20, "questions": [{"n": 1, "prompt": "\"What was AI capex in 2025?\" Credible published sources answer differently. Which option correctly pairs the figures with their scopes?", "options": {"A": "~$380B is the SEC-filings measure including finance leases; $448B is the company-guidance tally; ~$520B is Dell'Oro's whole-market series", "B": "~$380B is a company-guidance-basis tally for the five big spenders; $448B is Epoch AI's SEC-filings measure (cash PP&E purchases *plus* finance-lease right-of-use assets obtained); and ~$520B is Kedrosky's implied total data-center capex, triangulated from NVIDIA revenue (~$156.4B ÷ ~0.3) — with Dell'Oro's separate whole-market series forecast to pass $1 trillion in 2026", "C": "All three describe the same scope and differ only because they were published in different months", "D": "~$380B is the five firms' cash PP&E, $448B adds off-balance-sheet JVs such as Hyperion, and ~$520B adds telco and enterprise spending"}, "answer": "B", "explanation": "Nobody is wrong; the scopes differ, and the same year's total spans ~37% end to end. Note the two disciplines the ladder enforces: never net figures across rungs (Rung 1 vs Rung 2 for 2024 differs by ~$19B — that is just the finance-lease line), and never mix vintages (a guide, a commitment tally, and a house forecast are three different epistemic objects)."}, {"n": 2, "prompt": "Is the AI buildout \"the largest private capital deployment in history\"?", "options": {"A": "Yes on both measures — it exceeds both the 2000 telecom peak in dollars and the 1880s railroad peak as a share of GDP", "B": "No on both measures — it is smaller than the telecom peak in real dollars and far below the railroad share", "C": "Unassessable, because no consensus historical baseline exists for any comparator", "D": "It is a two-leg claim that passes one leg and fails the other. **Absolute dollars: TRUE** — the five firms' ~$448B of 2025 capex is roughly 2.1x the inflation-adjusted 2000 US telecom capex peak (~$120B nominal ≈ ~$213B in 2023 dollars). **Share of the economy: FALSE** — 2025 US AI capex at ~1.2–2% of GDP is roughly one-fifth to one-third of the 1880s US railroad peak of ~6%, a benchmark whose coda is that 70–80% of the trackage added in the 1880s had entered receivership by 1900"}, "answer": "D", "explanation": "Boosters quote leg 1, skeptics leg 2; an analyst quotes both with bases. Cross-check on leg 1: cumulative investment in AI since 2013 approached ~$1.6T by mid-2026 — roughly five times the inflation-adjusted Manhattan Project (~$36B) and Apollo (~$250–300B) combined."}, {"n": 3, "prompt": "An MD forwards Jason Furman's \"92% of GDP growth\" statistic as proof the economy *is* AI now. Give the correction.", "options": {"A": "The category is the BEA's **information-processing equipment and software** — broader than AI capex — which was only **4% of US GDP** in H1 2025 yet accounted for **92% of GDP growth** over that period (annualized growth would have been roughly 0.1% without it). It is a growth-*contribution* decomposition, not a size claim", "B": "The figure is 92% of *corporate profit* growth, not GDP growth, and it covers full-year 2025", "C": "It is a forecast drawn from JPMorgan's ~$5 trillion projection through 2030, not a BEA measurement", "D": "The correction is that 92% understates it — AI capex is 4% of GDP and climbing toward the railroads' 6%"}, "answer": "A", "explanation": "AI-adjacent investment is the marginal *driver* of growth while remaining a small share of the GDP *level* — Epoch's cleaner US-only series puts computing-infrastructure investment at ~1.49% of GDP in Q1 2026, up from 0.94% a year earlier."}, {"n": 4, "prompt": "OpenAI's ~$1.4 trillion commitment stack aggregates five supplier legs. Which ranking by instrument type is correct?", "options": {"A": "Oracle ~$300B (SEC-filed contract) > Microsoft $250B (LOI) > NVIDIA (definitive agreement) > AMD (term sheet) > Broadcom (press-reported)", "B": "All five are definitive purchase agreements filed with the SEC; they differ only in dollar size", "C": "Microsoft's **$250B** is the only SEC-disclosed contracted purchase with a stated dollar amount (\"contracted to purchase an incremental $250B of Azure services,\" 8-K exhibit, Oct 28, 2025); **AMD's** is a definitive agreement whose *binding* purchase commitment covers only the initial 1 GW of the announced 6 GW; **NVIDIA's** is a letter of intent (≥10 GW, up to $100B invested as systems deploy); **Broadcom's** is a signed term sheet with no disclosed dollar value; and **Oracle's ~$300B** — the largest single leg — rested on WSJ reporting with no binding SEC-grade disclosure by either party", "D": "NVIDIA's up-to-$100B is the most binding leg, because it is the only one with capital already committed"}, "answer": "C", "explanation": "The word \"commitment\" is doing the work of three words — announced, signed, and contingent — and the ~$1.4T headline sums across all three. The load-bearing observation: the largest leg is the least documented."}, {"n": 5, "prompt": "Compute the commitments-to-revenue ratio on both denominators, and label each.", "options": {"A": "~14x against audited revenue and ~10x against the run rate, since the aggregate spreads evenly over eight years", "B": "The ratio cannot be computed, because OpenAI publishes no revenue figure of any kind", "C": "~107x against the self-reported run rate and ~70x against audited revenue", "D": "~$1,400B (Altman, Nov 6, 2025) ÷ **$13.07B of FT-verified audited 2025 revenue ≈ 107x**; ÷ the **>$20B annualized run rate** Altman projected for end-2025 ≈ **70x**. Even spread naively across eight years, ~$175B/year of commitments against $13.07B of audited revenue is a >13x annual mismatch"}, "answer": "D", "explanation": "The ratio is a framing device, not a coverage metric: it compares an eight-year aggregate of mixed instruments to one audited year. The denominator choice is itself contested territory — always state whether you are using audited (attested, trailing) or run-rate (self-reported, annualized forward)."}, {"n": 6, "prompt": "How should the commitment stack be read?", "options": {"A": "As settled binding leverage — the ~$1.4T is contractually locked in and functions as debt", "B": "As genuinely open, held both ways leg by leg. **Option-like:** the structures stage the exposure (NVIDIA invests only *as systems deploy*; AMD binds only 1 GW of 6; Broadcom has no dollar value; Oracle has no filing), and HSBC's Nicolas Cote-Colisson flagged the unknown \"flexibility that OpenAI may have to adjust its commitment vs effective demand or financial capacity\" (Nov 2025). **Binding leverage:** taken at face value the commitments imply **~$207B of new financing needed by 2030** even under favourable assumptions (HSBC, reported Nov 26, 2025), inside Bain's system-wide requirement of **~$2 trillion of new annual revenue by 2030** with the world **$800B short** (Sept 23, 2025)", "C": "As a solvency ratio: 107x coverage means OpenAI is technically insolvent today", "D": "As settled option value — none of it binds, so the headline can be disregarded"}, "answer": "B", "explanation": "Both readings appear in HSBC's own coverage — the same shop that computes the $207B gap also flags the flexibility unknown. Position A weights the *legal force* of each leg; Position B weights the *economic behaviour* the commitments have already induced (counterparties building, backlogs booking, markets pricing)."}, {"n": 7, "prompt": "Microsoft's FY2026 10-K quantifies its OpenAI relationship. Which figures are correct, and why does the disclosure exist at all?", "options": {"A": "Revenue $24.1B and commitments $13.0B, disclosed because the SEC compelled Microsoft to break out AI revenue by customer", "B": "Revenue $13.0B, receivable $11.9B, commitments $24.1B, funded $6.0B — disclosed voluntarily as a non-GAAP supplement", "C": "Revenue from commercial arrangements with OpenAI (including revenue-sharing) **$24.1B** in FY2026; accounts receivable from OpenAI **$6.0B** at June 30, 2026; total investment funding commitments **$13.0B**, of which **$11.9B** funded — disclosed because Microsoft's ~25% as-converted equity-method stake makes OpenAI a **related party under ASC 850**", "D": "No such disclosure exists: Microsoft treats OpenAI as an unconsolidated third party and reports no related-party figures"}, "answer": "C", "explanation": "The single most important filing exhibit on circularity. In one fiscal year Microsoft recognized revenue from its investee equal to ~1.85x everything it has ever committed to invest in it — with a quarter of that year's billings still uncollected, and with the stake's $6.5B of FY2026 GAAP gains (primarily the October 2025 recapitalization dilution gain) stripped out of Microsoft's own non-GAAP measures."}, {"n": 8, "prompt": "\"NVIDIA invested $100 billion in OpenAI.\" What is the correct status of that arrangement?", "options": {"A": "Wrong. The September 22, 2025 announcement was a **letter of intent — not a definitive agreement** — for at least 10 GW of NVIDIA systems, with NVIDIA intending to invest up to $100B progressively as each gigawatt deploys. As of **February 3, 2026**, CNBC reported no contract signed and no money changed hands under it, and NVIDIA's FY2026 10-K said only that it was \"finalizing\" an agreement with **\"no assurance that... a transaction will be completed.\"** NVIDIA's actually funded OpenAI exposure ran through conventional rounds, beginning with the October 2024 $6.6B round", "B": "Correct in substance, though the capital arrived through OpenAI's October 2024 round rather than the announced structure", "C": "Correct — the money funded in tranches of roughly $10B per gigawatt beginning September 2025", "D": "Wrong — NVIDIA never announced any investment in OpenAI; the $100B figure came from a WSJ report about an Ohio backstop"}, "answer": "A", "explanation": "Reported does not equal confirmed — and here the gap *was* the whole $100B. The escalations that followed (the WSJ-reported ~$250B Ohio backstop, July 2026; the August 2026 $500B financing MOUs with Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR) are lower tiers still: press-reported and unfiled."}, {"n": 9, "prompt": "A colleague says \"Lucent proves vendor financing is illegal.\" Correct them.", "options": {"A": "Correct as stated — the SEC's 2004 complaint charged Lucent with unlawful vendor financing after the WinStar bankruptcy", "B": "Wrong. The vendor financing itself drew **no charge**: at end-fiscal-2000 Lucent had agreements to provide customers up to **$8.1B** of credit or loan guarantees (~$2.1B outstanding, up to $2B for WinStar alone), and after WinStar's 2001 bankruptcy it wrote off **$700M** and took customer bad-debt provisions of **$2.2B in 2001 and $1.3B in 2002**. The SEC's 2004 complaint charged **fraudulent revenue recognition** — roughly **$1.148B** of improperly recognized revenue and **$470M** of pre-tax income in FY2000 (a 16% overstatement), including a $125M WinStar \"software pool\" sale induced by **undisclosed side agreements** (a $35M future-purchase credit and a $45M laboratory credit). The line: financing your customers is legal; recognizing revenue that undisclosed concessions manufactured is not", "C": "Wrong in the other direction — the SEC charged Lucent but the case was dismissed, so no legal line was ever drawn", "D": "Wrong — Lucent never financed customers; the vendor-financing precedent belongs to Nortel"}, "answer": "B", "explanation": "This is the boundary the whole topic sits on. Circularity is an *analytical* problem — what does the revenue mean? — before it is ever a legal one, which is why Microsoft's proactive ASC 850 disclosure and NVIDIA's anonymized customer percentages sit at opposite ends of the transparency spectrum."}, {"n": 10, "prompt": "Which description of Meta's Hyperion joint venture (announced October 21, 2025) is correct?", "options": {"A": "Meta owns 80% and Blue Owl 20% of a ~$27B campus, which Meta consolidates onto its own balance sheet", "B": "Blue Owl bought the completed campus outright for $27B and leases it to Meta on a 30-year triple-net lease with no sponsor support", "C": "Meta funded the entire ~$27B itself and sold a 20% passive interest to PIMCO after completion", "D": "Funds managed by **Blue Owl Capital own 80%** and **Meta 20%**, funding roughly **$27B** of development costs pro rata; Blue Owl contributed **~$7B of cash** while Meta contributed **land and construction-in-progress** and took a **~$3B one-time distribution**; part of Blue Owl's capital is itself funded by debt privately placed with **PIMCO** and select bond investors. Meta leases the campus back under **operating leases with only a four-year initial term**, balanced by a **capped residual value guarantee covering the first 16 years** of operations — the short lease keeps the recognized obligation small while the guarantee supplies the value floor lenders need"}, "answer": "D", "explanation": "Ownership went off balance sheet; the residual risk did not. The template was repeated with BlackRock at El Paso (July 28, 2026): 80/20 on ~$14B, $12.5B of debt, four-year initial leases again, and an RVG threshold of ~$13B — about 93% of development cost — declining over time."}, {"n": 11, "prompt": "Which statement about the BIS's January 2026 assessment (Bulletin No 120) is correct?", "options": {"A": "It is deliberately two-sided. Spreads on AI-related private credit were nearly identical to non-AI loans — **6.2 vs 6.1 percentage points** — prompting the verbatim either/or that \"either lenders may be underestimating the risks of AI investments... or equity markets may be overestimating the future cash flows AI could generate,\" alongside the warning that off-balance-sheet structures \"might mask leverage... yet **leverage does not disappear by being out of sight**.\" The *same* bulletin assessed macroeconomic and financial stability risks from the AI boom as **\"moderate,\"** with AI investment at ~1% of US GDP — similar to the mid-2010s shale boom and half the dot-com IT surge", "B": "It found that AI lending carries a 300bp risk premium over comparable non-AI credit, proving lenders are pricing the risk properly", "C": "It declared the AI boom a systemic threat and recommended capital surcharges on private credit funds", "D": "It found AI investment had already reached the 1880s railroad share of GDP and warned of imminent contagion"}, "answer": "A", "explanation": "Quoting either half of the BIS without the other misrepresents the source. The either/or is a genuine fork: if lenders are right, AI equity is overvalued; if equity is right, $200B+ of private credit is underpriced. There is no reading where both markets are correct."}, {"n": 12, "prompt": "Microsoft's FY2026 10-K disclosed $329.1 billion of leases not commenced as of June 30, 2026. What is that figure?", "options": {"A": "Debt raised to fund data-center construction, held in a separate financing subsidiary", "B": "Capitalized right-of-use assets already recognized on the balance sheet and included in reported capex", "C": "**Lease commitments — primarily data centers — that have not yet commenced**, so they sit on no balance sheet and in no capex line until each lease starts; they commence in fiscal 2027 through 2033 on terms of 1–20 years, and the total is up from **$92.7B** a year earlier, with **more than $130B added in the June 2026 quarter alone**", "D": "The cumulative rent Microsoft has paid to data-center landlords since 2020"}, "answer": "C", "explanation": "The quietest wedge: a real future obligation with zero current accounting footprint, larger than any hyperscaler's annual capex, and absent from every capex tally in the aggregate debate."}, {"n": 13, "prompt": "What happened to server useful lives in January 2025?", "options": {"A": "Every hyperscaler extended to six years simultaneously, completing an unbroken five-year pattern of extensions", "B": "The SEC required all operators to standardize on a 5-year life for AI accelerators", "C": "Amazon extended to 6.5 years while Meta shortened to 4 years, both citing AI", "D": "Two sophisticated operators moved in **opposite directions in the same month**. Amazon **cut** a subset of servers and networking equipment from 6 to 5 years (~−$0.7B of 2025 operating income) and recorded **~$920M of accelerated depreciation in Q4 2024** for early retirements, citing \"an increased pace of technology development, particularly in the area of artificial intelligence and machine learning\" — while Meta **extended** most servers and network assets to **5.5 years**, expecting ~$2.9B less 2025 depreciation"}, "answer": "D", "explanation": "The dispute's most honest datapoint — against interest, specifically scoped, and reasoned. It vindicates neither side cleanly: the subset impact (~$0.7B) is a fraction of Burry's ~$176B claim and Amazon kept six years for the rest of the fleet, but the industry's most experienced server operator concluded some AI-era gear earns for *less* time, not more."}, {"n": 14, "prompt": "The useful-life dispute turns on separating three quantities. Which mapping is correct?", "options": {"A": "Schedule life and economic life are the same thing; technical life is the outlier", "B": "**Schedule life** is the audited accounting estimate (5–6 years at the hyperscalers and CoreWeave; 4 at Nebius). **Technical life** is how long the chip physically runs and stays rentable — evidenced by A100s (2020 silicon) still at high utilization and a CoreWeave A100 contract running into 2029. **Economic life** is how long it earns enough to justify its carrying value — evidenced by the H100 rental curve, down roughly 70–75% outside the hyperscaler tier in about two years. CoreWeave's 6-year policy is a *schedule* choice, defended with technical-life evidence and attacked with economic-life evidence", "C": "All three are settled: the audited 6-year schedule is by definition the correct economic life", "D": "A100s contracted into 2029 evidence *schedule* life; the H100 spot-rate collapse evidences *technical* life; CoreWeave's 6-year policy evidences *economic* life"}, "answer": "B", "explanation": "Most bad arguments in this dispute dissolve once the three are separated. Note also the dated self-contradiction inside NVIDIA's own messaging: Huang in March 2025 (\"you couldn't give Hoppers away\" once Blackwell ships) versus Huang in August 2026 (the A100 fleet \"mission-capable from 2020 through 2029\"). Quote both, dated; treat neither as dispositive."}, {"n": 15, "prompt": "How should Burry's November 2025 depreciation claim be presented?", "options": {"A": "As settled fact — CNBC's coverage confirmed the calculation", "B": "As audited disclosures, since the $176B appears in the hyperscalers' 10-K reconciliations", "C": "With explicit epistemic labels. The mechanism claim — that extending useful lives understates depreciation and \"artificially boosts earnings,\" against an NVIDIA product cycle he puts at 2–3 years — is his argument; the **~$176B of understated depreciation across 2026–2028**, and the ~27% Oracle and ~21% Meta profit overstatements by 2028, are **his own estimates**, methodology unpublished — not disclosed company figures. The disclosed figures are the per-change impacts in the filings, and NVIDIA's November 2025 analyst memo answered that customers depreciate over **4–6 years based on real-world longevity and utilization**, with 2020's A100s still running at high utilization", "D": "As irrelevant, because a disclosed change in accounting estimate cannot affect reported earnings"}, "answer": "C", "explanation": "The professionally defensible charge is *systematic optimism with income-favourable timing* — an earnings-quality issue — not fraud in the criminal sense, since every change was a prospective, disclosed, quantified change in accounting estimate passed by Big 4 auditors. Never let Burry's aggregate and the companies' filed per-change figures share a sentence without labelling which is which."}, {"n": 16, "prompt": "Kerrisdale's September 2025 GB200 sensitivity is the clearest demonstration of what the useful-life assumption is worth. Which statement is correct?", "options": {"A": "Reproducing SemiAnalysis's TCO model, a GB200 NVL72 at CoreWeave's **6-year** life shows roughly a **20.5% server EBIT margin**, falling to about **0%** at Nebius's **4-year** schedule: capital recovery is fixed (~$4.31M for the modeled unit), so compressing 72 months to 48 raises capital cost per unit-hour by exactly 50% (**$1.14 → $1.71**) against a flat $0.53/hour operating cost. Two caveats travel with it — Kerrisdale held a **disclosed short** in CoreWeave, and even its 6-year figure is a step *down* from its ~33% H100 calculation. The same assumption is also a borrowing base: CoreWeave's DDTL capacity is sized as a percentage of the depreciable cost of GPU servers", "B": "The schedule affects only reported depreciation, so modeled EBIT margins are identical at 4 and 6 years", "C": "At 6 years the modeled server EBIT margin is ~33%, falling to ~20.5% at 4 years, and the analysis was published by CoreWeave's auditors", "D": "The sensitivity shows margins *improving* as the schedule shortens, because a shorter life accelerates the tax shield"}, "answer": "A", "explanation": "The entire modeled profit of the rental business lives inside the useful-life assumption — and because the DDTL borrowing base is depreciable GPU-server cost, the same estimate that flatters earnings also sets collateral coverage. Dispute #2 is the input; dispute #4 is where the loss would land."}, {"n": 17, "prompt": "Mercatus's worked H100 TCO build-up (verified July 2026) is the canonical cost stack. Which reconstruction is correct?", "options": {"A": "$285,000 server ÷ 5 years ÷ 8,760 hours at 100% utilization ≈ $6.50/GPU-hour, with power the dominant component", "B": "$285,000 server less an assumed **$115,000 resale** = $170,000 net, over 3 years × 8,760 hours × **70% utilization** = **$9.24/server-hour** of capital amortization; plus **$0.78** power (8 × 700W TDP × 1.4 PUE × $0.10/kWh), **$1.64** colocation ($150/kW/month × 8 kW ÷ 730 hours) and **~$0.80** operations — about **$12.50/server-hour**, or **~$1.56/GPU-hour all-in**. Capital recovery is ~74% of the stack, and utilization plus the resale assumption are the two variables that swing the model", "C": "Colocation and power together are roughly three-quarters of the stack, with capital amortization a minor residual", "D": "The build-up totals ~$12.50 per *GPU*-hour, which is why hyperscalers must charge above $12 to break even"}, "answer": "B", "explanation": "Capital recovery dominates; power and colocation are small by comparison. Quoted TCO figures are floors, not facts — CloudRift's $0.93–$2.68 range is computed at 100% utilization, which Cheah calls unreasonable outright, so cross-source comparisons require restating to a common utilization base first."}, {"n": 18, "prompt": "Eugene Cheah's October 2024 payback analysis — and the lesson it installs — are best stated how?", "options": {"A": "At any price above $1.65/GPU-hour an H100 pays back within five years, so the 2023 vintage was safe", "B": "Payback and IRR are the same measure, so the $2.85 threshold is a return-of-capital date", "C": "The thresholds assume 50% utilization, so real-world economics are better than modeled", "D": "On a ~$50k-per-GPU basis over a five-year life — assuming **100% allocation, which Cheah himself flags as unreasonable** — **$4.70+/GPU-hour** pays back in **under 1.5 years**, **$2.85** is merely **breakeven against stock-market IRR**, and **below $1.65** the investment expects an outright loss. The vintage lesson: a 2023 buyer underwrote at $4.70+ (spot over $8) and watched the market fall to ~$2.85 by the start of 2024 and $1–2 on auction marketplaces by August 2024 — a decline Cheah measured at **≥40% per year** — so the price collapse outran the payback clock. At realistic utilization every threshold moves up"}, "answer": "D", "explanation": "Payback math on a decaying price curve must use the curve, not the entry price. This is why the neoclouds pre-sell multi-year take-or-pay books — a committed price fixes the vintage and transfers price-decay risk to the customer, at the cost of taking counterparty risk instead."}, {"n": 19, "prompt": "CoreWeave's FY2025 shows a 60% Adjusted EBITDA margin. What else does the same year show, and why is EBITDA a peculiarly flattering metric for this business?", "options": {"A": "EBITDA is conservative here, because it excludes take-or-pay revenue that has not yet been collected", "B": "The GAAP operating margin is also 60%; the two coincide because CoreWeave leases rather than owns its GPUs", "C": "The same year shows a **GAAP operating loss of $(46)M — a (1)% margin** — and a **net loss of $(1,167)M** on revenue of **$5,131M**. EBITDA excludes depreciation and amortization by construction, and the TCO build-up shows capital amortization is the *dominant* cost of producing a GPU-hour (~74% of the stack) — so the adjusted metric omits precisely the largest cost of goods in this business. Both figures are disclosed; quoting one without the other is the error", "D": "The gap is explained by the $66.8B revenue backlog, which GAAP requires to be expensed in the year signed"}, "answer": "C", "explanation": "The fastest single diligence check in this sector: always ask which line the capital recovery is sitting on. And note that the GAAP figure itself depends on the useful-life schedule from the depreciation dispute — the two notes are the same arithmetic argued from opposite ends."}, {"n": 20, "prompt": "Per Odlyzko, what caused the telecom crash — and what was internet traffic actually doing at the time?", "options": {"A": "Traffic never stopped growing fast — measured growth was **about 100% per year** from 1997 on. The crash \"was not caused by a decline in traffic growth rates, but by the 'irrational exuberance' that led to gross overinvestment\": the industry built against the claim that traffic was **\"doubling every 100 days\"** (originating with WorldCom's UUNET and repeated in a 1998 US Commerce Department report), which implies **1,155% annual growth**. US telecom capex hit roughly **$120B in 2000**, and by 2002 only about **2.7% of installed fiber was lit**", "B": "Traffic grew, but only at ~10% a year, which is why the buildout was so obviously excessive", "C": "Traffic growth collapsed to near zero in 1999–2001, and the crash followed that demand failure", "D": "The crash was caused by WorldCom's accounting fraud, which Odlyzko identifies as the primary mechanism"}, "answer": "A", "explanation": "The base rate is not \"bubbles pop when demand fails.\" Capacity racing ahead of fast-growing demand is sufficient; the crash arrives through financing and pricing while the technology keeps compounding. Watching demand alone watches the wrong gauge."}, {"n": 21, "prompt": "State the dual reading of the British Railway Mania.", "options": {"A": "The bear reading is that the lines went bankrupt; the bull reading is that shareholders were repaid in full", "B": "**Bear:** railway investment peaked at **7.3% of UK GDP in 1847** (£44M against £600M), Campbell and Turner's daily share index fell **66.7% peak-to-trough** (bottoming April 16, 1850) on capital calls and dividend cuts, and Odlyzko estimates investors lost about **£80M of roughly £250M invested** — about a third of all capital committed. **Bull:** hardly any of the lines went bankrupt, almost all continued in service, and Odlyzko judges Britain likely *gained* economically because benefits to users outweighed shareholders' losses. Both readings are correct about the same episode", "C": "The episode supports only the bull case, since the technology was transformative and no capital was permanently lost", "D": "The episode supports only the bear case, since the lines were abandoned once the shares collapsed"}, "answer": "B", "explanation": "Asset survival and investor return are different variables — hardly any lines went bankrupt *and* a third of invested capital was destroyed. Any framing that cannot hold both is too small for this dispute."}, {"n": 22, "prompt": "Which statement about the two structural disanalogies between the AI cycle and the telecom precedent is correct?", "options": {"A": "Both favour the bulls, and both are strengthening", "B": "Both favour the bears, and both are strengthening", "C": "They cut in opposite directions and each has taken damage. **Financing** favours the bulls — telecom owed roughly **$1 trillion** industry-wide by mid-2002 while the AI buildout began funded from hyperscaler operating cash flows — but it is eroding: BIS Bulletin 120 (Jan 7, 2026) documents the shift \"from operating cash flows to debt,\" with **over $200B** of outstanding private credit to AI-related sectors and off-balance-sheet structures that \"might mask leverage.\" **Asset life** favours the bears — rails and 2000-era fiber survived their financiers as decades-lived assets, which is why the dark-fiber salvage story exists, while AI accelerators are depreciated over roughly **2–6 years** against a near-annual product cadence — but it is contested by A100s still under paying rental contracts **into 2029**, nine years after the chip's 2020 debut. For calibration the AI buildout runs ~1% of US GDP against the railway mania's 7.3% peak — though telecom was also far below the railway benchmark and still destroyed ~$2 trillion of market capitalization", "D": "There are no disanalogies — the episodes are structurally identical, which is why the dispute is settled"}, "answer": "C", "explanation": "The honest question is never \"does AI rhyme with telecom?\" but \"*where exactly* does the rhyme break?\" — and both breaks are moving. Note also why the DeepSeek episode (January 27, 2025: NVIDIA −17%, $589B erased, the largest single-day loss in market history, followed by a $4T market cap on July 9, 2025) resolved nothing: no default, impairment, cancellation, or rental-rate regime change. Sentiment moved; no marker printed."}, {"n": 23, "prompt": "Which set of end-2025 concentration figures is correct?", "options": {"A": "The ten largest S&P 500 companies were roughly **41%** of index weight — against about **27%** at the 2000 dot-com peak and about **19–20%** ten years earlier; the **Magnificent Seven were 34.3%** in December 2025, up from 12.3% in 2015; and **NVIDIA alone reached approximately 8%** at its 2025 peak, the largest single-stock weight since IBM in 1974, after accounting for nearly **22.4% of the S&P 500's total return in 2024**", "B": "The top ten were ~27% at end-2025, below the ~41% reached at the 2000 peak", "C": "The Magnificent Seven were 12.3% at end-2025, and NVIDIA's ~8% weight was the largest single-stock weight ever recorded", "D": "The top ten were ~41% of index *earnings* and ~32% of index *weight* — the reverse of the 2000 pattern"}, "answer": "A", "explanation": "The most top-heavy the US market has been in decades — and *more* concentrated than the benchmark bubble. But recall that concentration level alone did not decide 2000's outcome; financing and demand timing did."}, {"n": 24, "prompt": "The Investment Company Institute reports index vehicles at 51%. Fifty-one percent of what — and what is the standard misreading?", "options": {"A": "51% of US equity market capitalization; the misreading is that it covers only ETFs", "B": "51% of all 401(k) balances; the misreading is that it includes foreign investors", "C": "51% of target-date fund assets; the misreading is treating it as a measure of household participation", "D": "51% of assets in **US long-term funds** — index mutual funds plus index ETFs held **$16.2 trillion at year-end 2024**. The misreading is \"index funds own half the stock market\": total US equity market capitalization is a different, larger denominator, and passive's share of it is not established by this figure"}, "answer": "D", "explanation": "A denominator trap of exactly the kind this phase trains you to catch. Related discipline from the same note: there is no verified figure for passive's share of total US equity market cap, and no verified split of the $19,860B of foreign-held US equities (TIC, June 30, 2025) between passive and active vehicles."}, {"n": 25, "prompt": "How does the course reconcile \"concentration is dangerous\" with \"concentration is earned\"?", "options": {"A": "It sides with the danger reading, since 41% exceeds the 2000 peak of 27%", "B": "It takes no side and makes the disagreement trackable through one spread. Torsten Slok (July 2025) argues the top ten are \"more overvalued than they were in the 1990s\" on 12-month-forward P/E, and that buying the index \"is basically making a bet on the Magnificent 7 stocks propelling even higher.\" The earned reading answers with the record — top-ten EBIT share rising from about **20% in 2015 to about 30% in 2025** (about 34% on one-year-forward consensus net income by August 2025), and Magnificent-7 earnings growth of **14.9% versus 6.7%** for the other 493 in Q3 2025. RBC's end-2025 synthesis reconciles them: roughly **41% of weight against roughly 32% of expected earnings** — a residual of about 9 points, or roughly a **48% premium** per unit of expected earnings relative to the rest of the index. If the earnings share climbs toward the weight, the earned reading is winning; if weight climbs while the earnings share stalls, the danger reading is", "C": "It sides with the earned reading, since Magnificent-7 earnings growth exceeded the other 493 in Q3 2025", "D": "It treats the two as measuring the same thing, so the dispute is merely semantic"}, "answer": "B", "explanation": "Same arithmetic, two readings — the bull says the earnings share rose to meet most of the weight (about 20% to about 32%), the bear says the premium went from roughly parity in 2015 to about 48% by end-2025. The spread is the scoreboard, and it is the thing to track rather than the rhetoric."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
