<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }

  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:34px;max-width:360px;width:88%;text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">

      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:15px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:12px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "7", "title": "Phase 7 Test — Policy, Politics and Power Markets", "pass_mark": 20, "questions": [{"n": 1, "prompt": "What made the October 7, 2022 BIS rules a strategic break from prior US policy, per Gregory Allen's contemporaneous CSIS analysis?", "options": {"A": "They preserved the long-standing goal of keeping the US about two technology nodes ahead of China, adding only new paperwork for AI chip exports", "B": "They abandoned the \"stay about two nodes ahead\" posture and tried instead to actively degrade China's technological maturity below its current level, attacking four chokepoints at once — AI chip sales, chip-design (EDA) software, semiconductor manufacturing equipment, and equipment components", "C": "They replaced the licensing system with an outright prohibition on all semiconductor sales to China", "D": "They acted solely through Entity List additions aimed at Huawei and SMIC, leaving country-wide rules untouched"}, "answer": "B", "explanation": "Allen's point (CSIS, October 11, 2022) was that the rules changed the *objective*: from staying about two nodes ahead to actively degrading China's current technological maturity, hitting AI chip sales, EDA software, manufacturing equipment and equipment components simultaneously. It was never a ban — the regime is licensing with a presumption of denial."}, {"n": 2, "prompt": "NVIDIA sold A800 and H800 chips into China legally after October 2022. Which parameter created that opening, and how exactly did the October 17, 2023 rule close it?", "options": {"A": "The 2022 rule keyed on die area; the 2023 rule replaced it with the 16nm/14nm non-planar node threshold used for equipment", "B": "The 2022 rule keyed on HBM memory-bandwidth density; the 2023 rule tightened that density figure and created ECCN 3A090.c", "C": "The 2022 rule keyed on interconnect bandwidth of 600 GB/s or higher alongside a performance threshold, so NVIDIA designed products just under the line; the 2023 rule removed the interconnect parameter entirely and re-keyed control on Total Processing Performance — TPP ≥ 4800, or TPP ≥ 1600 combined with performance density ≥ 5.92, the density test added to preempt the next workaround", "D": "There was no legal opening — the A800 and H800 were smuggled, and the 2023 rule simply added enforcement funding"}, "answer": "C", "explanation": "The 2022 control was threshold-keyed on interconnect bandwidth ≥ 600 GB/s plus a performance threshold, so NVIDIA structured the A800/H800 just under the line — legally. On October 17, 2023 BIS removed the parameter the products were designed around and re-keyed on TPP ≥ 4800, or TPP ≥ 1600 with performance density ≥ 5.92 (the density test exists to preempt the *next* workaround), and extended presumption-of-denial licensing to all 22 arms-embargoed countries and worldwide subsidiaries of China-headquartered firms."}, {"n": 3, "prompt": "Which sequence matches the H20 saga as the verified record has it?", "options": {"A": "A license requirement on April 9, 2025 (made indefinite April 14) covering the H20 and any chip matching its memory bandwidth, interconnect bandwidth or combination; expected charges of up to ~$5.5B and a $4.5B actual charge in Q1 fiscal 2026 for excess inventory and purchase obligations; then licenses granted in August 2025 for H20 and AMD's MI308 China sales in exchange for 15% of that revenue paid to the US government, with Trump confirming on August 11 that he had originally asked for 20%", "B": "A license requirement in January 2025, a $13B charge, and restoration of licenses in exchange for a 32.5% government equity stake in NVIDIA", "C": "An outright ban in April 2025 with no licensing path, and no charge taken because the inventory was rerouted to Singapore", "D": "A license requirement in April 2025 and a $4.5B charge, with licenses granted in August 2025 on standard terms and no financial condition attached"}, "answer": "A", "explanation": "Per NVIDIA's own 8-K: license required April 9, 2025 and made indefinite April 14; expected charges up to ~$5.5B with $4.5B actually recorded in Q1 FY2026; then August 2025 licenses for the H20 and AMD's MI308 in exchange for 15% of China chip-sale revenue paid to the US government — an arrangement without precedent in export-control practice, which Christopher Padilla called \"astonishing\" and Peter Harrell a \"terrible precedent.\""}, {"n": 4, "prompt": "An analyst asks whether the China export controls are working. What does the course's verified record support?", "options": {"A": "They are working, and the December 2024 HBM rule settled it by cutting off accelerator-grade memory", "B": "They have failed, and Jensen Huang's 95%→50% China market-share figure is the decisive measurement", "C": "The question was settled by DeepSeek's R1 release on January 20, 2025, which proved compute controls cannot bind a determined lab", "D": "The question is genuinely open: Huang (Computex, May 21, 2025) calls them \"a failure,\" citing NVIDIA's China share falling from ~95% four years earlier to ~50% while motivating Chinese firms to build their own chips; Amodei (January 2025) argues DeepSeek \"does not mean the export controls failed\" and that the real test is whether China can field millions of chips — two interested parties measuring different success criteria over different horizons"}, "answer": "D", "explanation": "Effectiveness is the note's deliberately unresolved Source Conflict. Huang measures realized commercial outcomes (share, substitution incentives); Amodei measures the counterfactual aggregate-compute gap (\"millions of chips,\" unipolar vs bipolar). Both are interested parties. The verified record establishes that the controls neither stopped China (SMIC 7nm without EUV, September 2023; DeepSeek V3/R1; the Ascend 910C) nor left it unconstrained (dual-die workaround, low yields, smuggling premiums)."}, {"n": 5, "prompt": "How does the CHIPS and Science Act's $52.7B decompose, and what is the separate Section 48D instrument?", "options": {"A": "$39B in manufacturing incentives (including $2B earmarked for legacy chips and up to $6B supporting up to $75B in loans and loan guarantees), $13.2B for R&D and workforce ($11B of it for the NSTC, NAPMP, Manufacturing USA institutes and NIST metrology), and $500M for international ICT security — with Section 48D a *separate* advanced manufacturing investment tax credit at 25% of capital expenses, raised to 35% by the OBBBA (signed July 4, 2025) for property placed in service after December 31, 2025", "B": "The whole $52.7B is fab construction grants; Section 48D is the $75B loan-guarantee facility inside it", "C": "$39B for R&D and $13.2B for fabs, with Section 48D setting the milestone schedule that gates disbursement", "D": "$52.7B split evenly between appropriated grants and tax credits, with Section 48D the tariff exemption for companies building in the US"}, "answer": "A", "explanation": "$39B manufacturing + $13.2B R&D/workforce + $500M ICT security, appropriated FY2022–FY2027 by the Act signed August 9, 2022. Section 48D is a *separate* tax-code entitlement — 25% of capex, raised to 35% by the OBBBA (July 4, 2025) for property in service after December 31, 2025 — and for a large project it can be worth more than the grant."}, {"n": 6, "prompt": "By January 31, 2025 the CHIPS Program Office had awarded up to $30.7B to 19 companies across 40 commercial fab projects. Why does that figure overstate delivered support?", "options": {"A": "It doesn't — binding awards are paid on signature, so the $30.7B had moved by that date", "B": "Because $5.5B of the total was loans rather than grants, and loans are repaid", "C": "Because cash is disbursed only as recipients complete construction, production and commercial milestones, with awardees' expected project completion dates spanning November 2024 to October 2033 — Intel, the largest awardee, had drawn just $2.2B of its $7.86B binding award by August 2025", "D": "Because the awards are stated in constant 2022 dollars, which construction inflation eroded"}, "answer": "C", "explanation": "The ladder is non-binding PMT → binding award after diligence → milestone-gated disbursement, and completions run to October 2033. Intel's $2.2B drawn against $7.86B awarded is the measured gap on the program's largest award — announced ≠ binding ≠ disbursed, the same discipline used on capacity claims and export-control states."}, {"n": 7, "prompt": "How should the 2025 policy pivot be characterised?", "options": {"A": "As repeal: the March 4, 2025 joint-address demand to \"get rid of the CHIPS Act\" was enacted, and the awards were rescinded", "B": "As deregulation: appropriated grants ended and no substitute instrument was introduced", "C": "As a pause: awards were frozen pending a review that had not concluded by August 2025", "D": "As instrument substitution rather than exit — the March 4 speech was followed by the OBBBA raising the 48D credit from 25% to 35% (July 4), a ~100% tariff on imported chips announced August 6 with an exemption for companies building or committed to build in the US (qualification specifics undefined), and the August 22 conversion of Intel's undisbursed awards ($5.7B CHIPS + $3.2B Secure Enclave) into 433.3 million primary shares at $20.47 — $8.9B for a 9.9% passive stake, $11.1B of total federal investment, plus a five-year warrant for 5% more at $20 exercisable only if Intel's foundry ownership falls below 51%"}, "answer": "D", "explanation": "Hold the four dated moves together: \"get rid of the CHIPS Act\" (March 4), ITC raised to 35% (July 4), the ~100% tariff with an undefined build-in-US exemption (August 6), and the grants-to-equity conversion (August 22). Washington's revealed preference in 2025 was *more* intervention through different instruments — tax expenditure, trade coercion and direct ownership — not exit."}, {"n": 8, "prompt": "SIA/BCG and Morris Chang are both quoted on whether industrial policy can close the gap. How should the dispute be held?", "options": {"A": "Chang is refuted: capacity tripling would be impossible if his cost claim were true", "B": "Both can be arithmetically honest because they price different things — SIA/BCG (May 8, 2024) project US fab capacity growing 203% from 2022 to 2032, advanced-logic share going 0% → 28% and world capacity share 10% → 14% versus 8% without CHIPS, a *capacity* claim; Chang (Brookings, April 2022) calls reshoring \"a wasteful, expensive exercise in futility,\" citing manufacturing at TSMC's Oregon fab running 50% more expensive than in Taiwan, an *operating-cost* claim distinct from the 4–5x fab *construction* premium that the grants and ITC address", "C": "SIA/BCG is refuted: the pivot to tariffs and equity means the projected fabs will not be built", "D": "The dispute was resolved in July 2025 when the ITC rose to 35%, which closed the operating-cost gap"}, "answer": "B", "explanation": "SIA/BCG measure capacity that exists on US soil; Chang measures sustained cost competitiveness. A tripling of capacity at a 50% operating premium vindicates both at once. The basis trap is the trap to avoid: Chang's 50% is an *operating* premium, the 4–5x figure is *construction* cost, and the grants-plus-ITC stack addresses capex, not operations."}, {"n": 9, "prompt": "What did Virginia's JLARC find on both sides of the data-center bargain in its December 9, 2024 report?", "options": {"A": "That the sales-and-use tax exemption provided $928.6M in tax savings in FY2023 — by far Virginia's largest economic development incentive, used by roughly 90% of the industry measured in megawatts — against an estimated contribution of ~74,000 jobs, $5.5B in labor income and $9.1B of GDP annually, with the crucial caveat that most of the benefit comes from the construction phase rather than ongoing operations", "B": "That the exemption cost $2.7B in FY2023 alone and generated 740,000 permanent operational jobs", "C": "That the exemption was revenue-neutral, because local property revenue exactly offsets the forgone state sales-and-use tax", "D": "That the exemption cost $928.6M in FY2023 and produced no measurable employment or GDP contribution"}, "answer": "A", "explanation": "JLARC is the Virginia legislature's own nonpartisan auditor — the closest thing this fight has to a neutral referee — and its ledger runs both ways. The load-bearing qualifiers: the cost is open-ended and escalating (the November 2025 findings put the cumulative FY15–FY24 figure at $2.7B, ~$1B in FY2024 alone, 53% of state incentive spending), and the benefit is construction-weighted."}, {"n": 10, "prompt": "In the AEP Ohio data-center tariff docket, who signed the stipulation, who opposed it, and what does the line-up establish?", "options": {"A": "Republican legislators signed and Democratic legislators opposed — the fight was partisan", "B": "The hyperscalers signed, seeking contract certainty, while consumer advocates opposed the long lock-ins", "C": "AEP Ohio, PUCO staff, the Ohio Consumers' Counsel, the Ohio Energy Group, the OMA Energy Group, Industrial Energy Users-Ohio, Walmart and Ohio Partners for Affordable Energy signed; Microsoft, Amazon Data Services, Google, Meta (filing as Sidecat) and the Data Center Coalition opposed, arguing no one customer type should be \"singled out for disparate rate treatment\" — showing the cleavage is cost allocation between customer classes, not partisanship or pro/anti-tech ideology", "D": "Only AEP Ohio signed and every intervenor opposed; PUCO approved it over universal objection"}, "answer": "C", "explanation": "When residential advocates, industrial users and the largest retail power buyer in America co-sign against the four biggest data-center operators, the fight is over cost *allocation* between customer classes — consistent with the 55% Republican / 45% Democrat split among publicly opposed politicians and with Governor Kemp's veto of Georgia's exemption pause (May 7, 2024)."}, {"n": 11, "prompt": "Under Dominion's GS-5 class (Virginia SCC order, November 25, 2025), a customer contracts 100 MW of distribution and transmission demand plus 100 MW of generation demand, then uses only 50 MW of each. What is its minimum obligation, and why do the two floors differ?", "options": {"A": "50 MW and 50 MW — the minimums bind only on metered usage", "B": "85 MW of distribution and transmission demand (the 85% floor) and 60 MW of generation demand (the 60% floor); the floors differ because the assets differ in redeployability — site-specific wires are sunk and unsalvageable, while generation can be redispatched to other buyers if the customer vanishes", "C": "100 MW and 100 MW — the tariff bills the full contracted quantity in both categories", "D": "60 MW of distribution and transmission and 85 MW of generation, because wires are the more easily redeployed asset"}, "answer": "B", "explanation": "0.85 × 100 = 85 MW of distribution and transmission demand; 0.60 × 100 = 60 MW of generation demand. The asymmetry is a design tell: wires to a site are sunk and unsalvageable, generation can be redispatched — recovery tiered like collateral of differing liquidity."}, {"n": 12, "prompt": "What is the state of the xAI Memphis Colossus fight on the verified record?", "options": {"A": "The Shelby County Health Department revoked the permit in July 2025 and the turbines were removed", "B": "The EPA found in May 2026 that the turbines caused no measurable harm, closing the matter", "C": "The NAACP's appeal succeeded, and xAI now takes all its power from the grid", "D": "SELC, acting for the NAACP, alleged in June 2025 that xAI was operating as many as 35 turbines without permits — up to 421 MW; on July 2, 2025 the Shelby County Health Department permitted 15 Solar SMT-130 turbines up to 247 MW, with permitted annual emissions of 87 tons of NOx and nearly 14 tons of hazardous air pollutants; on July 16, 2025 the NAACP and Young, Gifted & Green appealed to the Memphis and Shelby County Air Pollution Control Board — and that appeal is pending, with no outcome in the verified record"}, "answer": "D", "explanation": "Decided: the permit exists. Open: the appeal. The EPA's Newton County investigation (committed May 2026) is likewise unresolved. The structural lesson is that on-site generation trades the interconnection queue for an air-permit fight with neighbours who have standing — in zip 38109, where cancer risk runs about 4x the national average."}, {"n": 13, "prompt": "How is a regulated utility's allowed revenue computed, and what must an investment pass to earn a return on it?", "options": {"A": "Revenue requirement = kWh sold × an approved margin; any investment the commission has been notified of earns a return", "B": "Revenue requirement = rate base × allowed rate of return + operating expenses (including depreciation and taxes), where rate base is net prudent investment — plant in service at original cost, less accumulated depreciation, plus working capital, less accumulated deferred taxes, ± approved adjustments — admitted only if \"used and useful\" and prudently incurred, with the allowed return bounded by *Bluefield* (1923) and *Hope* (1944) and set recently around 9–11% ROE, all computed for a test year", "C": "Revenue requirement = the utility's actual cash costs plus a fixed 15% markup set by FERC for all jurisdictions", "D": "Revenue requirement is negotiated each year between the utility and its largest industrial customer, subject to commission veto"}, "answer": "B", "explanation": "The formula is why utilities welcome data-center-driven capex: the return is earned on *net prudent investment*, not on kWh sold, so every used-and-useful dollar of grid buildout grows the base the allowed return is earned on. Read with fund eyes: rate base is invested capital, the allowed ROE a court-standard-bounded hurdle rate, and prudence review retrospective diligence on capex."}, {"n": 14, "prompt": "Residential customers are roughly 90% of customers, 50% of peak demand and 40% of energy sold. What does that profile establish about the cost-of-service study?", "options": {"A": "That the allocation step is a computation with a single correct answer, derived directly from the 90/50/40 ratios", "B": "That residences must be allocated 90% of joint costs, because customer count is the legally mandated allocator", "C": "That there is no objective standard for allocating joint costs — the choice of allocator (customer count, peak demand or energy) moves large sums between classes, so allocation is litigated judgment under the cost-causation standard inside \"just and reasonable,\" not arithmetic; roughly 30 states use embedded-cost studies and about 20 marginal-cost studies, and both typically assign residential and small-business customers higher total cost per kWh than industrials", "D": "That marginal-cost studies remove the judgment, which is why about 30 states have adopted them"}, "answer": "C", "explanation": "This is the field's own concession, and it is load-bearing: a customer-count allocator loads costs onto residences, an energy allocator lightens them, a demand allocator sits between. On a $600M demand-classified transmission bucket, coincident-peak (50%) versus energy (40%) is a $60M/yr swing — a policy memo defended before stakeholders, not a computation."}, {"n": 15, "prompt": "JLARC found both that data centers pay full cost of service and that the buildout raises other customers' bills. How do both hold, and what is the documented counter-position on whether protective structures fix the problem?", "options": {"A": "They cannot both hold; the December 2024 report contradicted itself and its cost-shift finding was withdrawn", "B": "They hold because JLARC applied marginal-cost allocation to the present and embedded-cost allocation to the forecast", "C": "They hold, and the question is closed: the GS-5 order eliminated the cost shift", "D": "They hold on different layers — class-level cost causation can be satisfied today while system-level buildout raises every bill tomorrow ($10–18B of added generation and transmission cost by 2040; a typical Dominion residential customer at +$23/month by 2030 and +$37/month by 2040 under unconstrained demand, constant 2024 dollars) — and whether the protective structures actually stop cost shifts is left **open**: PUCO and the utilities (July 2025) frame minimum-take tariffs as stranded-cost protection, while Harvard ELI (March 2025) documents confidential special contracts approved in short conclusory orders and a coincident-peak gaming vector"}, "answer": "D", "explanation": "Class allocation governs shares of the pie; the buildout grows the pie itself. Note the epistemic labels: the +$23/+$37 figures are *forecasts* under an unconstrained-demand scenario in constant 2024 dollars, and the note explicitly leaves the do-protections-work question open (its three-position treatment was rejected at verification on a citation defect). Harvard ELI is high-credibility but advocacy-inflected — pair it with PUCO's stranded-cost framing."}, {"n": 16, "prompt": "Which description of wholesale power market structure matches the note?", "options": {"A": "Seven RTOs/ISOs — CAISO, ERCOT, SPP, MISO, PJM, NYISO and ISO-NE — grew out of FERC Orders 888/889 (1996) and Order 2000; they operate the high-voltage transmission system and run bid-based auctions while owning neither generation nor wires, and serve about two-thirds of US electricity load; ERCOT (~90% of Texas load) sits outside FERC's wholesale-rate jurisdiction under the PUCT and runs an energy-only market with no capacity market", "B": "The seven RTOs own the transmission lines and the generation in their footprints and set retail rates directly", "C": "All US electricity trades through the seven RTOs, each of which runs a FERC-jurisdictional capacity market", "D": "RTOs are state agencies created by the Federal Power Act in 1935 to set retail tariffs, with FERC as an appellate body"}, "answer": "A", "explanation": "RTOs/ISOs are nonprofit market administrators — closer to an exchange plus system operator than to a utility. About two-thirds of US load sits in RTO regions; the rest runs traditional structures. ERCOT is both one of the seven and the design counterexample: energy-only, PUCT-overseen, outside FERC's wholesale-rate jurisdiction."}, {"n": 17, "prompt": "How do the day-ahead and real-time markets divide the work, and what does the locational marginal price measure?", "options": {"A": "Day-ahead is a non-binding forecast; real-time is where all load settles, at one region-wide price", "B": "The day-ahead market produces financially binding hourly schedules for the next day — typically about 95% of load — while the real-time market balances deviations in five-minute intervals; the LMP is the marginal cost of serving the next MWh at each specific location under security-constrained economic dispatch, with three components (energy, congestion, losses), so congestion makes prices diverge across the footprint and siting becomes a price decision", "C": "Day-ahead sets capacity prices in $/MW-day and real-time sets energy prices in $/MWh; LMP applies only to the capacity product", "D": "Both markets clear at the system-average cost of generation, with congestion billed separately by state commissions"}, "answer": "B", "explanation": "Day-ahead is a physical forward that locks price and volume — which is exactly why ~95% of load hedges there — and real-time is the five-minute balancing settlement on the residual. LMP is basis made explicit: one commodity, node-by-node prices, congestion as the basis driver."}, {"n": 18, "prompt": "What happened in PJM's Base Residual Auction for the 2025/26 delivery year, and what did the market monitor conclude?", "options": {"A": "It cleared at $28.92/MW-day, down from $269.92, as new gas capacity arrived ahead of the delivery year", "B": "It cleared at the FERC-approved $325/MW-day cap, and the increase was attributed entirely to plant retirements", "C": "PJM cancelled the auction and procured capacity bilaterally once data-center demand proved unforecastable", "D": "Held July 2024, it cleared at $269.92/MW-day versus $28.92 the prior year — total capacity cost to consumers $2.2B → $14.7B — on roughly 6,600 MW less supply offered, higher forecast load and new accreditation rules, with the BGE ($466.35) and Dominion ($444.26) zones at their zonal caps; Monitoring Analytics, PJM's independent market monitor, attributed 63% of the increase (~$9.3B of added consumer cost) to data centers and the 2026/27 auction's revenue up $7.3B (82%) to $16.1B, concluding the conditions were \"not the result of organic load growth\""}, "answer": "D", "explanation": "One auction, one clearing price, one forecast: the cleanest scarcity print in the AI-power story. Note who the monitor is — Monitoring Analytics is an independent firm policing the market PJM runs, so its attribution is effectively an audit of PJM's own demand forecast, and PJM disputes the reading. Costs reached bills eleven months later (Pepco DC +$21/month from June 2025, ~$10 of it capacity per the DC People's Counsel; western Maryland ~$18; Ohio ~$16) — socialized across all load, not billed to the data centers blamed for the increase."}, {"n": 19, "prompt": "A memo quotes PJM capacity prices of $325, $329.17 and ~$333/MW-day and treats every post-2025 auction print as a market observation. What are the two corrections?", "options": {"A": "There are three successive caps set by three FERC orders, and the auctions are genuine market clears between them", "B": "Only $329.17 is real — the other two are quoting errors — and the auctions are unconstrained", "C": "The three figures describe **one** cap: $325/MW-day FERC-approved in April 2025 out of the Shapiro settlement (with a $175/MW-day floor), $329.17 the UCAP-basis clearing price *at* that cap in the 2026/27 auction, and ~$333 a pre-approval figure — and because every base auction since April 2025 has cleared at the cap (extended April 2026; the July 2026 auction again at the cap), the prints are administratively bound rather than market-formed, so the true scarcity price is unobserved and the \">$21B,\" \"$45B\" and \">$554/MW-day counterfactual\" savings figures are the Pennsylvania governor's office's own model-dependent claims", "D": "The cap was vacated on appeal in 2026, so post-2025 prints are market observations after all"}, "answer": "C", "explanation": "Two errors to avoid: multiplying one cap into three by mixing quoting bases and vintages, and feeding cap-bound prints into a price model as if they were equilibrium observations — censored data. \"At the cap\" tells you the uncapped price would have been higher and nothing about how much higher. The settlement also set a $175/MW-day *floor*: it is a collar, and generators extracted a term too."}, {"n": 20, "prompt": "How does data-center load enter PJM's long-term load forecast?", "options": {"A": "Not through the models at all: PJM's econometric base — zonal residential, commercial and industrial sector models on roughly a decade of history, hourly models, 403 simulated weather scenarios from 1994–2024 weather and a Moody's Analytics economic forecast — cannot capture loads this energy-intensive (\"not captured by the PJM econometric based load forecast model\"), so it arrives as **large load adjustments** that member electric distribution companies request for specific large customers they expect to interconnect, and data centers have been the majority of recent PJM large load adjustments", "B": "Through the commercial sector model, driven by employment, income and output like any other commercial customer", "C": "By taking the FERC interconnection queue total for each zone directly as forecast demand", "D": "By back-solving from the previous capacity auction's clearing price and reserve margin"}, "answer": "A", "explanation": "The fastest-growing, price-setting component of the forecast is the least modelled part of it — self-reported by utilities on the basis of developer requests. That side door is what admits the two inflation vectors: speculative requests (asking is free) and double-counting when one project is shopped across several utilities that each book it."}, {"n": 21, "prompt": "An analyst writes: \"ERCOT expects more than 474 GW of demand.\" What is the error, and what benchmarks does the note offer instead?", "options": {"A": "No error — the figure is ERCOT's published peak-demand forecast for the early 2030s", "B": "The error is the unit: 474 GW should be 474 TWh, and the correct benchmark is LBNL's 176 TWh for 2023", "C": "The error is the date: the 474 GW figure is from March 2026, and the August 2026 reading was ~410 GW", "D": "The 474 GW (August 2026, roughly 90% data centers; ~410 GW in March 2026, ~87%) is an *interconnection-request* total — an option book more than five times ERCOT's all-time peak demand record — not a forecast; queues feed forecasts through utility pipelines with attrition assumptions, and the note's haircut benchmarks are ERCOT's >5:1 queue-to-peak ratio, Wood Mackenzie's ~4:1 announced-to-realistic ratio (93 GW announced through 2030 vs 23 GW \"more realistic\") and PSE&G's 50% derate on feasibility-stage requests"}, "answer": "D", "explanation": "A queue is an option book, not an order book — nobody forecasts five Texases. The inflation mechanism is subtler than the raw total: requests → utility pipelines → large load adjustments → forecast, with attrition assumptions applied at each stage by parties with different incentives. Use the ratios as base rates to interrogate a pipeline, not to reprice one — Wood Mackenzie's is a national 2024 estimate, not a per-utility law."}, {"n": 22, "prompt": "What did the market monitor's January 5, 2026 counterfactual quantify, and how must the percentage be read?", "options": {"A": "That data centers were overbilled $6.5B and are owed refunds, which is 65.5% of their capacity charges", "B": "That PJM's 2025 forecast used to clear the 2027/28 Base Residual Auction contained 13,018 MW of forecast new or incremental data-center load (17,071 MW including existing), and that including it raised auction revenues by $6.5 billion — from $9.9B to $16.4B — with the 65.5% figure computed on the *without*-data-center base, not on the $16.4B total (which would give 39.6%); across the last four base auctions the IMM attributes $29.4B, or 46% of $63.6B in total capacity charges, to data centers", "C": "That the 2027/28 auction would have cleared 65.5% higher without the data-center load, because the load provided price-responsive demand", "D": "That 13,018 MW of data-center load failed to materialise, proving the forecast wrong and the charges refundable"}, "answer": "B", "explanation": "$16.4B − $9.9B = $6.5B, and $6.5/$9.9 = 65.5% — stating the base is the difference between \"data centers are 40% of the cost\" and \"data centers raised the cost 65.5%,\" both true and different sentences. And these are *scenario re-runs* pricing sensitivity, not proof the load will fail to materialise: attribute them to the IMM and carry PJM's contrary reading."}, {"n": 23, "prompt": "Why does the note call Microsoft's November 20, 2023 announcement \"the cheapest option ever written\"?", "options": {"A": "Because Microsoft acquired OpenAI's workforce outright for the cost of one quarter's Azure revenue", "B": "Because it converted Microsoft's ~$13B investment into voting control of the nonprofit board at no premium", "C": "Because the cost was approximately nothing — employment for two people plus an open offer to the other ~770 — while the payoff was positive in every state: Altman reinstated cured the key-man risk on Microsoft's ~$13B position; mass defection would have internalised the team without buying the company or triggering merger review as an acquisition; and a continuing standoff would have left Microsoft the only safe harbour. RBC's Rishi Jaluria called it a \"masterstroke — Either way, Microsoft wins,\" before the outcome was known", "D": "Because Microsoft paid a nominal $1 for a call option on OpenAI's equity that it exercised in October 2025"}, "answer": "C", "explanation": "Value the announcement as the instrument it was: near-zero cost, state-independent payoff. The deeper lesson is that the crisis strengthened the party with no votes — the nonprofit board held 100% of control rights and ~0% of economics, and lost in five days to employee mobility (an estimated 97% of ~770 staff) plus compute dependency. Note also that Microsoft never actually hired Altman: the option's value was that it never needed exercising."}, {"n": 24, "prompt": "Which set of terms from the October 28, 2025 Microsoft–OpenAI agreement are the *governance* terms this note teaches?", "options": {"A": "Microsoft holds roughly 27% of the recapitalized OpenAI Group PBC (~$135B), down from a prior 32.5% stake basis that excluded recent funding-round dilution; any OpenAI AGI declaration must now be verified by an independent expert panel; Microsoft's IP rights extend through 2032, including post-AGI models; and Microsoft's compute right of first refusal ended, against OpenAI contracting an incremental $250B of Azure purchases", "B": "Microsoft regained compute exclusivity through 2030 and reinstated its board observer seat", "C": "OpenAI's nonprofit was dissolved, Microsoft took 49% of the successor, and the AGI clause was deleted from the agreement", "D": "Microsoft agreed to a 15% revenue share with the US government on any AGI-derived product, mirroring the H20 arrangement"}, "answer": "A", "explanation": "The defusal of the AGI clause is the single most fought-over term — it converted a unilateral counterparty option (OpenAI's board could declare AGI and curtail Microsoft's rights, on a term that was never defined) into an adjudicated trigger, and extended IP rights past it. Governance terms live in this note; the business terms (stake arithmetic, revenue share, cross-cloud diversification) live in [[The Frontier Labs]]."}, {"n": 25, "prompt": "A commentator writes: \"In May 2026 the courts vindicated OpenAI's conversion — Musk's claims were rejected by a unanimous jury.\" Give the correction.", "options": {"A": "No correction is needed; the jury reached the merits and found for OpenAI on every count", "B": "The correction is that the jury was hung, so the case will simply be retried on the same claims", "C": "The nine-member jury unanimously found that Musk filed beyond the statute of limitations, and Judge Yvonne Gonzalez Rogers dismissed all claims — including the Microsoft aiding-and-abetting count — *without reaching the merits*, so the mission-betrayal question was never decided; Musk, who sought up to $150B in disgorgement plus the removal of Altman and Brockman, announced an appeal, and a reversal on timeliness would revive the merits intact", "D": "The correction is that the case never went to trial: OpenAI settled after rejecting the $97.4B bid on February 14, 2025"}, "answer": "C", "explanation": "\"Dismissed as untimely\" and \"vindicated\" are different dispositions. The claims died on timeliness; no court has ruled on whether the conversion betrayed the founding mission, and the docket is live. The related discipline: the $97.4B bid (February 10, 2025) was a pricing instrument aimed at the nonprofit's control assets mid-recapitalization — rejected unanimously on February 14 (\"OpenAI is not for sale\") and countersued as a \"sham bid\" on April 9, 2025."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
</html>
