<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }

  /* --- Responsive: phones ---------------------------------------------------
     One column already; what breaks on a phone is the fixed bottom bar (it sits
     under the home-indicator without a safe-area inset), the sticky title (it
     pushes the score off-screen), and sub-44px option rows. */
  html { -webkit-text-size-adjust:100%; }
  .bar { padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  @media (hover:none) { * { -webkit-tap-highlight-color:rgba(201,162,39,.18); } }
  @media (max-width:640px){
    .top { padding:11px 14px; gap:10px; }
    .top .title { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .top .score { font-size:11.5px; flex:none; }
    .top a.home { flex:none; font-size:12px; }
    .wrap { padding:18px 14px 132px; }
    h1 { font-size:20px; }
    .intro { padding:14px; font-size:14px; }
    .q { padding:16px 14px; }
    .qh { font-size:15px; }
    .opt { padding:13px 12px; min-height:44px; align-items:center; }
    .expl { font-size:13.5px; padding:10px 12px; }
    .result { padding:18px 14px; font-size:15px; }
    .result .big { font-size:28px; }
    .bar { padding:10px 14px; gap:10px; flex-wrap:wrap; }
    .bar .status { flex:0 0 100%; font-size:12.5px; order:-1; }
    .bar button { flex:1 1 auto; min-height:44px; padding:11px 14px; }
  }
</style>

<div id="pe-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0b1020;display:flex;align-items:center;justify-content:center;font-family:Spectral,Georgia,serif">
  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:clamp(22px,6vw,34px);max-width:360px;width:min(88%,360px);text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">
    <div style="font-family:Cinzel,serif;font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:8px">The Knowledge Engine</div>
    <div style="color:#a2b3cd;font-size:13.5px;margin-bottom:20px">Enter your access code to continue.</div>
    <input id="pe-gate-input" type="password" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:16px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:14px 12px;min-height:44px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "4", "title": "Phase 4 Test — History of the Industry", "pass_mark": 20, "questions": [{"n": 1, "prompt": "Which document named the field of artificial intelligence, and on what terms?", "options": {"A": "Alan Turing's 1950 paper, which requested £50,000 from the UK government for a thinking-machine programme", "B": "The Dartmouth Summer Research Project proposal dated August 31, 1955 by McCarthy, Minsky, Rochester and Shannon, which asked the Rockefeller Foundation for $13,500 and conjectured that every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it", "C": "A 1956 US government solicitation for machine translation worth about $20 million", "D": "The 1973 Lighthill Report, which coined the term while surveying UK research"}, "answer": "B", "explanation": "The Dartmouth proposal is the document in which the term \"artificial intelligence\" first appears, and its ratio is the lesson: a conjecture about all of intelligence against a budget of thirteen and a half thousand dollars. The workshop ran in summer 1956 and is treated as the field's birthdate."}, {"n": 2, "prompt": "Which set of early capability predictions is correctly attributed?", "options": {"A": "Turing (1958): a computer would be world chess champion within ten years; Shannon (1970): human-level intelligence within three years", "B": "Minsky (1958): machines could do any human work within twenty years; Simon (1970): a chess champion within a decade", "C": "Lighthill (1960): human-level machines by 1980; McCarthy (1970): a new mathematical theorem within eight years", "D": "Simon & Newell (1958): within ten years a computer would be world chess champion and would prove an important new mathematical theorem; Simon (in print in 1960 and reprinted unchanged in 1965, which is why the quote is commonly misdated): machines would be capable within twenty years of doing any work a man can do; Minsky (Life, 1970): \"in from three to eight years we will have a machine with the general intelligence of an average human being\""}, "answer": "D", "explanation": "These were the field's most credentialed leaders making dated, falsifiable promises, which is precisely what funders later audited. Note the provenance detail: Simon's twenty-year claim appeared in print in 1960, not 1965, so the clock started five years earlier than usually stated."}, {"n": 3, "prompt": "What were the three institutional blows of the first AI winter?", "options": {"A": "ALPAC (1966, US) — an NRC committee found machine translation more expensive, less accurate and slower than human translation, ending NRC support after about $20M spent; the Mansfield Amendment (1969) plus DARPA's 1974 cancellation of the roughly $3M-a-year Carnegie Mellon speech-understanding contract; and the Lighthill Report (1973, UK) — \"in no part of the field have the discoveries made so far produced the major impact that was then promised\" — which diagnosed the combinatorial explosion and preceded the dismantling of most UK AI funding for roughly a decade", "B": "The 1987 LISP-machine crash, DARPA's cuts under Jack Schwarz, and the end of Japan's Fifth Generation project", "C": "The Perceptrons book of 1969, the 1984 AAAI conference, and the 1986 Nature backpropagation paper", "D": "The collapse of Symbolics, the failure of XCON, and Japan's announcement of the Fifth Generation project"}, "answer": "A", "explanation": "Three different countries, scopes and years — collapsing them into \"the government pulled out\" loses the mechanism. The Perceptrons story in option C did not survive this course's verification and is deliberately not taught."}, {"n": 4, "prompt": "In 1987, a LISP-machine industry worth about half a billion dollars was replaced within a single year. What is the analytically load-bearing reading?", "options": {"A": "AI demand collapsed in 1987, taking the hardware market down with it", "B": "The machines failed technically and could no longer run the software they were built for", "C": "General-purpose workstations and desktops from Apple and IBM became both more powerful and cheaper, so demand for the workload survived while the specialized asset class serving it died — the closest historical precedent for the modern GPU residual-value question", "D": "Regulators banned specialized AI hardware in the wake of the Lighthill Report"}, "answer": "C", "explanation": "The failure mode was substrate substitution, not demand collapse: the workload migrated to cheaper general-purpose machines while Symbolics, LISP Machines Inc., TI and Xerox were crippled or left the field. That is exactly the shape of the modern accelerator residual-value question."}, {"n": 5, "prompt": "XCON produced real, audited savings for DEC — estimates range from about $40M over six years to $25M annually by 1986. Why did expert systems nevertheless fail commercially by the early 1990s?", "options": {"A": "The Mansfield Amendment made their commercial sale unlawful", "B": "The savings had been fabricated and did not survive audit", "C": "They were displaced by neural networks, which had become cheaper to train by 1990", "D": "The maintenance economics inverted: the systems were expensive to maintain, difficult to update, unable to learn, and brittle — producing grotesque mistakes on unusual inputs — so value was front-loaded in a hand-built knowledge base while cost was perpetual and scaled with the world's rate of change"}, "answer": "D", "explanation": "Booms can rest on genuine anchor successes and still unwind. XCON's savings were real, but the knowledge base was hand-built, so maintenance cost scaled with the world's rate of change while the system could not learn."}, {"n": 6, "prompt": "\"AI has had two winters, so today's capex boom will end the same way.\" Which pairing of rebuttal and steelman is best supported by the verified 1980s numbers?", "options": {"A": "Rebuttal: the winters never actually happened. Steelman: government funding is still the main source of AI capital", "B": "Rebuttal: the winters were concentrated, switch-off-able funding lines — peak corporate AI spend of just over $1B a year in 1985, DARPA's Strategic Computing Initiative at $100M cumulative by 1985, Japan's Fifth Generation at a reported $320–500M in total — whereas today's buildout is revenue-seeking corporate capex at roughly 100x that annual scale, so no single auditor can flip the switch. Steelman: the 1987 mechanism was funder-agnostic — a roughly $500M specialized-hardware fleet lost its value in one year when a cheaper substrate crossed the price-performance line, which needs no skeptical program director", "C": "Rebuttal: today's models work, so no audit is possible. Steelman: the Lighthill Report could be reissued", "D": "Rebuttal: modern AI uses no specialized hardware. Steelman: corporate balance sheets are smaller than 1980s government budgets"}, "answer": "B", "explanation": "The winters transfer their mechanisms but not their magnitudes or funder structure. Mechanism one (concentrated funder audit) has no modern equivalent; mechanism two (price-performance crossover against a specialized fleet) is funder-agnostic and still live."}, {"n": 7, "prompt": "How did the neural-network tradition survive its unfashionable decades?", "options": {"A": "The Canadian Institute for Advanced Research ran the Neural Computation and Adaptive Perception program, which funded and connected the groups of Geoffrey Hinton (Toronto), Yoshua Bengio (Montreal) and Yann LeCun (NYU) while the field's attention had moved to alternatives such as kernel machines; Hinton directed the program from 2004 until 2013, and the same three shared the 2018 ACM A.M. Turing Award announced in March 2019", "B": "DARPA maintained continuous connectionist funding from 1987 onward", "C": "Google funded the three groups directly from 1998 through its research division", "D": "The tradition genuinely died out and was reinvented from scratch in 2012"}, "answer": "A", "explanation": "Neural networks were unfashionable, not extinct — three funded groups worked continuously through the kernel-machine years. The Turing Award announced in March 2019 cited \"conceptual and engineering breakthroughs that have made deep neural networks a critical component of computing.\""}, {"n": 8, "prompt": "What is the difference between ImageNet and ILSVRC?", "options": {"A": "They are two names for the same 2012 competition", "B": "ImageNet is the annual competition; ILSVRC is the underlying dataset, released in 2012", "C": "ImageNet is the dataset — introduced at CVPR 2009 by the Princeton group, structured on WordNet, with 3.2 million labeled images across 5,247 categories at launch via Mechanical Turk and later past 14 million, conceived by Fei-Fei Li from 2006 — while ILSVRC is the annual competition run on it from 2010, classification-only with 11 participating teams in its first year", "D": "ImageNet is a speech-recognition benchmark; ILSVRC measures object detection"}, "answer": "C", "explanation": "This is an instrument-versus-reading distinction: the dataset was a deliberate multi-year data project that predates the famous result by three years, and the competition is what turned it into the field's public scoreboard. The 2012 event was a result *on* the instrument."}, {"n": 9, "prompt": "\"When did deep learning start?\" has three defensible answers. What are they, and what started at each?", "options": {"A": "All three point to 2012, the year AlexNet started deep learning", "B": "2009 (ImageNet), 2013 (the DNNresearch acquisition) and 2019 (the Turing Award)", "C": "1986 (backpropagation), 2006 (the term coined) and 2015 (ResNet)", "D": "2006 — the algorithmic revival, a training-efficiency breakthrough addressing the vanishing-gradient problem, during which the term \"deep learning\" was coined; about 2010 — the compute-regime break Epoch AI dates to somewhere between 2010 and 2012, when training compute began doubling roughly every 6 months rather than every 20; and 2012 — the commercial inflection, comprising ILSVRC's turning point, the four-group speech paper, and the capital response within months"}, "answer": "D", "explanation": "Three events, three observables — algorithm, compute regime, and commerce — with different dates and different causal roles. Any sentence of the form \"deep learning started in [year]\" is implicitly choosing one of them."}, {"n": 10, "prompt": "What did Epoch AI's February 2022 analysis find about machine-learning training compute?", "options": {"A": "Compute doubled every 6 months before 2010 and every 20 months afterward", "B": "Compute doubled roughly every 20 months before 2010 — in line with Moore's Law — and roughly every 6 months in the deep-learning era, with a separate \"Large-Scale Era\" from late 2015 of models trained at 10 to 100 times the trend, and total growth of a factor of 10 billion since 2010", "C": "Training compute grew by a factor of about 1,000 between 2010 and 2022", "D": "Compute growth tracked Moore's Law throughout, with no structural break"}, "answer": "B", "explanation": "The break is when compute stopped being an ambient input and became a purchased, scaling one — the demand-side birth certificate of the AI-infrastructure industry. Epoch itself publishes the uncertainty, dating the break \"somewhere between 2010 and 2012.\""}, {"n": 11, "prompt": "\"AlexNet's 2012 win convinced a skeptical industry to try neural networks.\" What is the verified correction?", "options": {"A": "Industry was already deploying: the first successful large-vocabulary deep-neural-network acoustic model used Microsoft Bing mobile voice-search data trained on just 24 hours of audio, industrial speech deployment began around 2010, and by November 2012 researchers from Toronto, Microsoft Research, Google and IBM jointly reported that deep networks beat Gaussian mixture models on a variety of speech benchmarks, sometimes by a large margin — so the vision result accelerated and publicized a conversion already underway", "B": "There was no industrial adoption of deep learning anywhere before 2015", "C": "The 2012 win was in speech rather than vision, so the claim confuses two fields", "D": "Industry ignored the 2012 result entirely until the Turing Award in 2019"}, "answer": "A", "explanation": "The revival was two-track: a public benchmark win landing on top of an industrial adoption already in progress, with Microsoft, Google and IBM co-authoring with Toronto by November 2012. That structure is why capital moved within months rather than years."}, {"n": 12, "prompt": "How should the DNNresearch and DeepMind acquisition prices be cited?", "options": {"A": "Google disclosed $44 million for DNNresearch and $500 million for DeepMind at signing", "B": "Both prices were officially disclosed and are directly comparable", "C": "DNNresearch's terms were not disclosed at the time (March 2013) and the $44M figure comes from later accounts; DeepMind's price (January 2014) was never officially disclosed, with contemporaneous reports ranging from £400 million (The Guardian, January 27) to more than $500 million (The Information via TechCrunch, January 26), and Facebook had also been in talks in late 2013 with the deal reportedly led by Larry Page", "D": "Neither acquisition completed; both companies remained independent"}, "answer": "C", "explanation": "The disclosure *status* is part of the fact: one price was undisclosed at the time and surfaced later, the other was never officially released and was reported in two currencies a day apart. Quoting either as a clean point figure flunks this course's sourcing standard."}, {"n": 13, "prompt": "What did \"Attention Is All You Need\" (June 2017) dispense with, and what made it economically decisive?", "options": {"A": "It dispensed with attention and convolutions, relying solely on recurrence", "B": "It dispensed with recurrence and convolutions, relying solely on attention — and the decisive advantage was parallelizable training rather than accuracy alone: the paper reported a new state-of-the-art 41.8 BLEU on WMT 2014 English-to-French after 3.5 days on eight GPUs, at \"a small fraction of the training costs of the best models from the literature,\" which made scaling up the rational next move", "C": "It dispensed with training data, learning instead directly from user feedback", "D": "Its advantage was purely accuracy; its training costs were higher than those of prior models"}, "answer": "B", "explanation": "Removing recurrence removed the sequential dependency in training, which is what made the workload arbitrarily parallelizable — the shape GPUs supply. Cheaper-per-unit-of-quality is what made scaling rational; accuracy alone would have made it a better mousetrap, not an industry."}, {"n": 14, "prompt": "Put these in the correct order with dates: Microsoft's $1B investment; GPT-2's full 1.5B release; OpenAI LP's creation; GPT-3's paper; the GPT-3 API launch.", "options": {"A": "OpenAI LP (March 2019) → Microsoft's $1B (July 22, 2019) → GPT-2's 1.5B release (November 5, 2019) → GPT-3's paper (May 28, 2020) → the API launch (June 2020)", "B": "Microsoft's $1B → OpenAI LP → GPT-3's paper → GPT-2's 1.5B release → the API launch", "C": "GPT-2's 1.5B release → OpenAI LP → Microsoft's $1B → the API launch → GPT-3's paper", "D": "GPT-3's paper → the API launch → OpenAI LP → Microsoft's $1B → GPT-2's 1.5B release"}, "answer": "A", "explanation": "The order is the argument: restructure for capital, secure the patron, then make the scale bet and monetize it. Scramble the dates and the causal chain dissolves."}, {"n": 15, "prompt": "What is the OpenAI LP \"capped-profit\" structure announced in March 2019?", "options": {"A": "A nonprofit in which investors receive no returns of any kind", "B": "A conventional venture-backed startup with an uncapped equity upside", "C": "A structure in which investors control the board while the nonprofit holds a passive minority stake", "D": "A for-profit LP controlled by the original nonprofit's board, with first-round investor returns capped at 100x and everything above the cap belonging to the OpenAI Nonprofit — created because OpenAI judged it needed to invest billions of dollars in large-scale cloud compute, talent and AI supercomputers, which it could not raise as a nonprofit"}, "answer": "D", "explanation": "The structure deliberately severs control from economics: an unconflicted nonprofit board with no carry controls the entity, while investors hold something like a capped participating instrument. The stated justification was the compute bill."}, {"n": 16, "prompt": "What did the July 22, 2019 Microsoft–OpenAI announcement contain beyond the money, and how was one of those terms later exercised?", "options": {"A": "A passive $1B minority investment with no commercial terms attached", "B": "$1B plus a commitment by OpenAI to open-source all future models", "C": "$1B, with Microsoft becoming OpenAI's exclusive cloud provider and preferred partner for commercializing new AI technologies, and the two jointly building Azure AI supercomputers — and on September 22, 2020 Microsoft took an exclusive license to GPT-3's underlying model, with everyone else limited to API outputs", "D": "$10B, with Microsoft acquiring a controlling stake in OpenAI LP"}, "answer": "C", "explanation": "Capital, compute supply and distribution arrived as one bundle — vendor financing with an equity wrapper — and the preferred-commercialization clause was exercised within fourteen months. This is the origin of the compute-for-capital lock-in pattern the course tracks later."}, {"n": 17, "prompt": "\"Google invented the transformer but failed to deploy it.\" Correct this using verified facts.", "options": {"A": "The claim is accurate — Google used transformers in no product before 2022", "B": "False: Google integrated transformers into translation in 2018, introduced and open-sourced BERT in 2018, and applied BERT to Search ranking by October 2019, affecting about one in ten US English queries in what Google called its biggest Search leap in five years; what Google did not do first was sell the model itself as a product, and the verified record supports only that narrow difference in deployment strategy", "C": "False: Google shipped a consumer chatbot in 2018, ahead of OpenAI", "D": "The claim is accurate, because Google never published the architecture and so could not deploy it"}, "answer": "B", "explanation": "Google invented, published and deployed the architecture; the verified difference is deployment strategy — under-the-hood versus model-as-product — not awareness or capability. Innovator's-dilemma explanations are plausible commentary, not verified fact."}, {"n": 18, "prompt": "Which statement about Anthropic's founding and the transformer authors is correct?", "options": {"A": "Anthropic was founded by former OpenAI research VP Dario Amodei (CEO) and Daniela Amodei (President) as a public benefit corporation — a standard for-profit form with a legally embedded mission rather than a copy of OpenAI's bespoke capped-profit hybrid — and announced a $124M Series A on May 28, 2021 led by Skype co-founder Jaan Tallinn; separately, all eight authors of the 2017 transformer paper eventually left Google, most of them to found startups", "B": "Anthropic was founded by Google researchers and adopted a capped-profit LP with a 100x cap", "C": "Anthropic was spun out of DeepMind in 2019 with Microsoft as its anchor investor", "D": "Anthropic was founded in 2021 by the eight authors of the transformer paper"}, "answer": "A", "explanation": "Anthropic solved the same design problem — mission-constrained frontier capital — with a standard legal wrapper rather than a bespoke one. This note's verified record stops at the May 2021 Series A; later rounds are out of scope."}, {"n": 19, "prompt": "What exactly launched on November 30, 2022?", "options": {"A": "A newly trained frontier model that had not previously existed, released with paid access from day one", "B": "An open-weights release of GPT-3", "C": "A free research preview: a conversational fine-tune, via reinforcement learning from human feedback, of a GPT-3.5-series model that had finished training in early 2022 — described as a sibling to InstructGPT, running on Microsoft Azure, whose launch post flagged on day one that it \"sometimes writes plausible-sounding but incorrect or nonsensical answers.\" Whether it caused or merely revealed the demand that followed remains an open dispute in this course", "D": "A search engine built on BERT"}, "answer": "C", "explanation": "The launch was a packaging and access event, not a capability event: the underlying model had finished training months earlier and GPT-3-class capability had been purchasable via API since mid-2020. That capability-recognition gap is why the cause-versus-reveal question stays open."}, {"n": 20, "prompt": "Where does the figure \"ChatGPT reached 100 million monthly active users in January 2023\" actually come from?", "options": {"A": "OpenAI's own announcement of registered accounts, published February 1, 2023", "B": "An audited disclosure in a Microsoft quarterly filing", "C": "A count of ChatGPT account registrations published by Similarweb", "D": "An analyst estimate: Reuters reported on February 1, 2023 a UBS study that estimated the figure from Similarweb web-analytics data — a chain of Reuters ← UBS ← a third-party traffic panel, never an OpenAI disclosure, and it should be cited with that chain stated"}, "answer": "D", "explanation": "The most famous statistic of the era is an estimate of an estimate that became canon; OpenAI never disclosed it. Note the asymmetry: the better-sourced figure (Altman's own 1M-in-5-days post, December 5, 2022) is the less famous one."}, {"n": 21, "prompt": "What did Microsoft actually disclose on January 23, 2023, versus what was reported?", "options": {"A": "Microsoft announced the \"third phase\" of the partnership as a \"multiyear, multibillion dollar investment\" with no amount disclosed, and confirmed Azure as the exclusive cloud provider for all OpenAI workloads; the widely quoted figure of about $10 billion comes from Bloomberg citing a person familiar with the discussions — reported, not disclosed", "B": "Microsoft disclosed a $10 billion investment in its January 23, 2023 press release", "C": "Microsoft disclosed $13 billion and named a second cloud provider alongside Azure", "D": "Microsoft made no announcement in January 2023; the partnership surfaced later in its 10-K"}, "answer": "A", "explanation": "Reported is not disclosed, and a memo that fails to mark the difference will eventually mark you. The operative disclosed fact was Azure exclusivity across all OpenAI workloads — a compute lock that preceded the consumer product scramble."}, {"n": 22, "prompt": "What did NVIDIA report on May 24, 2023, and why does the course treat it as the inflection's first *hard* evidence?", "options": {"A": "Q1 FY2024 revenue of $11.0B with Q2 guided to $7.19B, roughly in line with consensus", "B": "Q1 FY2024 revenue of $7.19 billion, with Data Center a record $4.28 billion, and Q2 guidance of $11.0 billion ± 2% against a Wall Street consensus of about $7.2 billion — roughly 50% above — which is hard because forward guidance in a results release is a liability-attached, first-party commitment rather than a self-report, an analyst estimate, or a market print", "C": "A private forecast shared with analysts and never published", "D": "A capital-expenditure announcement of $28.10 billion for the year"}, "answer": "B", "explanation": "Everything before this was a self-report, an analyst estimate, a press-attributed amount, or an intraday market move; guidance in a results release is a forward commitment with securities-law liability attached. Huang's trillion-dollar-transition framing is verified as his statement, not as a fact about the world."}, {"n": 23, "prompt": "Which statement about the two most-quoted market figures of early 2023 is correct?", "options": {"A": "NVIDIA closed above $1 trillion on May 30, 2023, and Alphabet's loss is a confirmed closing figure", "B": "Both are audited disclosures drawn from company filings", "C": "Both are intraday numbers and must be quoted as such: NVIDIA touched $1 trillion intraday on May 30, 2023 — the first chipmaker ever to do so — and slipped back below before the close, while Alphabet's roughly $100 billion loss on February 8, 2023 is an intraday figure whose contemporaneous reports differ (NPR: as much as 9% during the session, \"balancing out by the day's close\"; TIME: more than 7% at the open, about $102 billion)", "D": "Neither event occurred; both are later reconstructions with no contemporaneous reporting"}, "answer": "C", "explanation": "Both canonical dollar figures of early 2023 are intraday numbers, and the Alphabet reports disagree on magnitude and framing. An intraday touch means enthusiasm reached a level for minutes; a durable close means holders sustained it."}, {"n": 24, "prompt": "How did organized opposition and policy respond during 2023, and with what key numbers?", "options": {"A": "Executive Order 14110 banned the training of models above a set size", "B": "Executive Order 14110 required reporting for any model trained on more than 100 million user records", "C": "The pause letter was issued by the US government in October 2023", "D": "The Future of Life Institute's open letter (March 22, 2023) called for an immediate pause of at least six months on training systems more powerful than GPT-4, and Executive Order 14110 (signed October 30, 2023) required reporting to the government for any model trained with more than 10^26 integer or floating-point operations — regulation defining its object in units of training compute"}, "answer": "D", "explanation": "The pause letter marks organized opposition arriving while the demand thesis was still mostly narrative, and the executive order marks the state formalizing its interest in the course's own units. A FLOP count became a legal threshold, which is the precedent later export-control tiers refine."}, {"n": 25, "prompt": "How did the demand shock finally show up in hyperscaler capex, and where does that evidence sit?", "options": {"A": "Meta reported 2023 capex of $28.10 billion and guided 2024 to $30–37 billion on February 1, 2024 — raising the top end by $2 billion and naming servers (AI and non-AI) and data centers as the drivers — which sits on the same hard rung of the evidence ladder as NVIDIA's guidance, because it is first-party capex guidance in an earnings release rather than narrative, estimate, or market print", "B": "Meta's capex guidance was the first soft signal of the demand shock and preceded the 100-million-user estimate", "C": "Meta guided 2024 capex down from 2023 as it redirected spending away from AI", "D": "Meta's capex figures were reported by Bloomberg citing people familiar and were never formally disclosed"}, "answer": "A", "explanation": "Meta's guide is the buy-side equivalent of NVIDIA's: first-party, forward, and liability-attached. It arrived eight months after NVIDIA's guide, which is a different risk posture from Microsoft's investment four months before it — grade them accordingly."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
