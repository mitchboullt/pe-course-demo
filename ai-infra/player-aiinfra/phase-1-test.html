<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }
</style>

  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:34px;max-width:360px;width:88%;text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">

    <div style="color:#a2b3cd;font-size:13.5px;margin-bottom:20px">Enter your access code to continue.</div>
    <input id="pe-gate-input" type="password" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:15px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:12px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "1", "title": "Phase 1 Test — Foundations", "pass_mark": 20, "questions": [{"n": 1, "prompt": "What is a semiconductor, precisely?", "options": {"A": "A material that conducts electricity with no resistance at all", "B": "Another word for a finished microchip or integrated circuit", "C": "A material whose conductivity sits between a conductor's and an insulator's and can be deliberately altered by introducing impurities — a process called doping", "D": "A material that emits light whenever a current passes through it"}, "answer": "C", "explanation": "A semiconductor is a *material property* — conductivity between a conductor's and an insulator's, tunable by doping (e.g. with phosphorus or boron). A chip is a device built on such material; the two are not synonyms."}, {"n": 2, "prompt": "What does a single transistor on a chip physically do?", "options": {"A": "It stores one bit permanently, retaining it after power is removed", "B": "It acts as a miniature electrical switch — a three-terminal device in which a signal applied to one terminal controls the current flowing between the other two", "C": "It converts direct current into the alternating current that drives the chip's clock", "D": "It measures the chip's temperature and throttles the clock accordingly"}, "answer": "B", "explanation": "A transistor is a miniature electrical switch: a three-terminal device where a signal at the third terminal gates current between the other two. That on/off behaviour, replicated billions of times, is all a chip is made of."}, {"n": 3, "prompt": "Sort a GPU, DRAM, NAND flash, and an image sensor into the industry's chip taxonomy.", "options": {"A": "GPU = logic; DRAM = memory (volatile); NAND flash = memory (non-volatile); image sensor = DAO (discrete, analog, other)", "B": "GPU = DAO; DRAM = logic; NAND flash = memory; image sensor = memory", "C": "All four are logic chips, distinguished only by clock speed", "D": "GPU = logic; DRAM = memory (non-volatile); NAND flash = memory (volatile); image sensor = logic"}, "answer": "A", "explanation": "Logic chips process information (CPUs, GPUs); memory chips store it, split into volatile DRAM (lost at power-off) and non-volatile NAND flash (retained); DAO — discrete, analog and other — covers sensors and optoelectronics."}, {"n": 4, "prompt": "What did Gordon Moore claim in 1965, and how did he revise it in 1975?", "options": {"A": "That chip clock speed would double every 18 months; later revised to every three years", "B": "That transistors would shrink by half every year; later revised to every five years", "C": "That the cost of a whole chip would halve annually; later revised to halving every 18 months", "D": "That the number of components on an integrated circuit, at minimum cost per component, was doubling roughly every year; in 1975 he revised the doubling period to every two years"}, "answer": "D", "explanation": "Moore's 1965 *Electronics* article observed complexity at minimum cost per component doubling roughly every year; in 1975 he revised the doubling period to two years, and in that form it held for more than 50 years."}, {"n": 5, "prompt": "Which form of Moore's Law broke, and when?", "options": {"A": "The transistor-count form broke around 2011, while cost per transistor kept falling", "B": "Both forms broke together once fabs passed $20 billion each", "C": "The economic form broke — cost per transistor stopped falling around 2011, at the 28nm node — while transistor counts kept roughly doubling", "D": "Neither has broken; both were still tracking cleanly as of 2024"}, "answer": "C", "explanation": "The technical form (transistor counts doubling) still roughly tracks — Blackwell's 208B transistors in 2024 sit on the trend line. The economic form broke: cost per transistor stopped declining around 2011 at the 28nm node."}, {"n": 6, "prompt": "Which statement about NVIDIA's Blackwell GPU (announced 2024) matches the course notes?", "options": {"A": "It is a memory chip made by SK hynix and sold as HBM", "B": "It contains 65,000 components, the figure Moore predicted for 1975", "C": "It is a single monolithic die carrying 405 billion transistors", "D": "It packs 208 billion transistors across two reticle-limited dies, manufactured on TSMC's custom 4NP process"}, "answer": "D", "explanation": "Blackwell packs 208 billion transistors across two reticle-limited dies operating as one GPU, on TSMC's custom 4NP process. It is a *logic* chip, and its two-die construction is the seed of the advanced-packaging story."}, {"n": 7, "prompt": "What is the difference between training and inference?", "options": {"A": "Training runs on CPUs and inference runs on GPUs", "B": "Training is the bounded build phase that iteratively adjusts a model's parameters as a dataset passes through it; inference is the finished, frozen model running once for every request", "C": "Training is what happens as users converse with a model; inference is the one-off setup step before launch", "D": "Training produces tokens and inference produces parameters"}, "answer": "B", "explanation": "Training iteratively adjusts parameters as data streams through the model; inference applies the *frozen* weights to a new input, once per request. The deployed model does not learn from use."}, {"n": 8, "prompt": "Llama 3.1 405B was pretrained on roughly 15 trillion tokens. What do the two numbers describe?", "options": {"A": "Both describe model size — 405B compressed, 15T uncompressed", "B": "405B is the dataset size and 15T is the number of internal weights", "C": "405B is the number of GPUs used and 15T is the total FLOP consumed", "D": "405B is the parameter count — the model's internal weights — while 15T counts the training data in tokens"}, "answer": "D", "explanation": "Parameters are the model's internal weights (model size); tokens measure the data (dataset size). \"A 405B model trained on 15T tokens\" answers two different questions with two different units."}, {"n": 9, "prompt": "Which set of figures matches Meta's disclosed Llama 3.1 405B training run (July 2024)?", "options": {"A": "Over 16,000 Nvidia H100 GPUs, 30.84 million GPU-hours, and roughly 3.8×10²⁵ FLOP", "B": "Over 1,600 H100 GPUs, 3.08 million GPU-hours, and roughly 3.8×10²² FLOP", "C": "About 500 Google TPUs, 30.84 million GPU-hours, and roughly 2×10²⁹ FLOP", "D": "Over 100,000 H100 GPUs, 300 million GPU-hours, and roughly 10²⁹ FLOP"}, "answer": "A", "explanation": "Meta's disclosed figures: over 16,000 Nvidia H100s, 30.84 million H100-80GB GPU-hours, ~15T training tokens, with NVIDIA characterising total compute as roughly 3.8×10²⁵ FLOP."}, {"n": 10, "prompt": "Dividing 30.84 million GPU-hours across a fleet of about 16,000 GPUs implies roughly how much whole-cluster time — and what does that tell an analyst?", "options": {"A": "About 8 days, showing training is a short burst easily absorbed by spare capacity", "B": "About 80 days — roughly a quarter — showing training is a bounded, project-like capital event, after which the fleet is redeployed or idle", "C": "About 800 days, showing training clusters are occupied for years at a time", "D": "It cannot be calculated, because Meta disclosed neither GPU-hours nor fleet size"}, "answer": "B", "explanation": "30.84×10⁶ ÷ 16,000 ≈ 1,927 hours ≈ 80 days of whole-cluster time. Training is the investment period: concentrated, capital-intensive, finite — then the asset is done and the fleet moves on."}, {"n": 11, "prompt": "How fast did training compute for notable AI models grow from 2010 to May 2024, per the verified sources?", "options": {"A": "Roughly 2x per year — a doubling every twelve months", "B": "Roughly 30% per year, tracking fab cost escalation", "C": "Roughly 4–5x per year — a doubling every five to six months", "D": "Flat until 2020, then a single 100x jump"}, "answer": "C", "explanation": "Epoch AI measures ~4–5x per year from 2010 to May 2024, a doubling roughly every five to six months; Stanford's 2025 AI Index concurs at about a five-month doubling. Nothing else in an infrastructure model compounds at that rate for 14 years."}, {"n": 12, "prompt": "One source puts the cost of training GPT-4 at about $78M; another implies a considerably larger number. What is the correct analyst reading?", "options": {"A": "One of the two figures must simply be wrong and should be discarded", "B": "They use different accounting boundaries — Stanford's ~$78M prices the *compute* of the run, while Epoch's full-cost decomposition puts accelerator chips and R&D staff each in the tens of millions — so always quote the method and the date", "C": "The gap is a currency-conversion artifact", "D": "The $78M figure covers inference serving rather than training"}, "answer": "B", "explanation": "Stanford's 2024 AI Index estimated GPT-4's *compute cost* at ~$78M (Gemini Ultra ~$191M); Epoch's decomposition prices full development, with chips and staff each in the tens of millions. Different boundaries, both defensible — which makes \"how much is being spent\" contested even at the single-model level."}, {"n": 13, "prompt": "Frontier training costs are projected past $1B per run by 2027, while inference for GPT-3.5-level capability got over 280x cheaper between November 2022 and October 2024. Are these facts in tension?", "options": {"A": "No — they describe different workloads whose cost curves point in opposite directions, which is why a demand forecast must state which workload it is about", "B": "Yes — they are in direct conflict, so one of the two claims must be an error", "C": "No — the 280-fold decline applies to training and the $1B projection applies to inference", "D": "Yes, but it resolves easily: falling inference unit costs mechanically reduce total inference spend"}, "answer": "A", "explanation": "Training cost rises because labs buy ever more compute chasing scaling gains; inference unit cost falls for a *fixed* capability level. Opposite curves, different workloads — which is why every demand forecast must name the workload it describes."}, {"n": 14, "prompt": "What is the core architectural trade-off between a CPU and a GPU?", "options": {"A": "A GPU is simply a CPU built on a newer process node", "B": "A CPU executes a few tens of threads with maximum single-thread speed; a GPU executes thousands of threads in parallel, maximising aggregate throughput over per-thread speed", "C": "A CPU performs floating-point arithmetic; a GPU performs only integer arithmetic", "D": "A CPU has far more memory bandwidth; a GPU has far more cache"}, "answer": "B", "explanation": "A CPU maximises single-thread speed across a few tens of threads; a GPU maximises aggregate throughput across thousands of slower threads. AI won on GPUs because the workload is parallel, not because GPUs are universally faster."}, {"n": 15, "prompt": "Why do AI hardware spec sheets lead with matrix-math throughput?", "options": {"A": "Because neural-network layers — fully-connected, recurrent, and convolutional — are built on or reduced to GEMMs (general matrix multiplications), so hardware value reduces to matrix-math throughput", "B": "Because matrix multiplication is the only operation a GPU is physically able to perform", "C": "Because matrix multiplication is the slowest operation, so vendors advertise it to manage expectations", "D": "Because chip buyers are contractually required to report matrix throughput"}, "answer": "A", "explanation": "Most neural-network computation reduces to GEMMs, so hardware value is matrix-math throughput delivered — which is why GPUs, Tensor Cores, and TPU systolic arrays all centre on the matrix multiply."}, {"n": 16, "prompt": "GPUs were not designed for AI. What paid for their development, and why did that matter?", "options": {"A": "Government supercomputing contracts, which specified matrix-math units from the outset", "B": "Cryptocurrency mining demand in the 2010s, which funded parallel architectures", "C": "The gaming and graphics market, whose embarrassingly parallel rendering workload funded two decades of parallel-processor R&D that AI then inherited at consumer scale", "D": "Telecom signal processing, which needed the same high memory bandwidth"}, "answer": "C", "explanation": "GPUs were built to accelerate graphics rendering, an embarrassingly parallel problem; pre-CUDA, graphics performance in triangles per second improved at more than 2.4x per year. AI inherited an installed technology curve an unrelated consumer market had already paid for."}, {"n": 17, "prompt": "An analyst converts a training cluster's peak spec-sheet FLOPS into delivered compute. What correction should be applied?", "options": {"A": "None — peak FLOPS is the delivered figure for a well-run cluster", "B": "Multiply by two, since a fused multiply-add is counted as two FLOP", "C": "Reduce by 90%, because memory bandwidth binds on essentially every workload", "D": "Apply a utilization haircut: large distributed training runs typically deliver only ~30–50% of peak FLOP/s (as of 2025), roughly a 2–3x reduction"}, "answer": "D", "explanation": "Large distributed training runs typically achieve only ~30–50% of peak FLOP/s (as of 2025), so a capex-to-compute model built on spec-sheet peaks overstates delivered output by roughly 2–3x. (A second, separate check: confirm all sources use the FMA-counts-as-two-FLOP convention, and whether the job is memory-bandwidth-limited.)"}, {"n": 18, "prompt": "What were AlexNet's headline 2012 ImageNet numbers, and why did the hardware detail matter most?", "options": {"A": "5.3% error versus 26.2%, trained on 16,000 datacenter GPUs — proving only hyperscalers could compete", "B": "15.3% versus 26.2% error, trained on Google TPUs — proving custom ASICs beat merchant silicon", "C": "15.3% top-5 error versus 26.2% for the runner-up, trained in five to six days on two NVIDIA GTX 580 gaming GPUs — proving a step-change result was purchasable with commodity consumer silicon", "D": "15.3% versus 26.2% error, trained on CPUs — proving parallel hardware was unnecessary"}, "answer": "C", "explanation": "15.3% top-5 error versus 26.2% for second place, trained in five to six days on two NVIDIA GTX 580 3GB gaming GPUs. The hardware detail mattered more: it proved the binding constraint on capability was parallel compute, purchasable off the shelf."}, {"n": 19, "prompt": "How should an analyst treat the GPU-versus-ASIC distinction?", "options": {"A": "As permanent and absolute: ASICs cannot run neural networks, and GPUs cannot be specialised", "B": "As converging — Google's TPU is a matrix-math ASIC (deployed in its datacenters since 2015) while recent NVIDIA GPUs carry Tensor Cores, dedicated matrix units — so chips should be judged on delivered matrix throughput per dollar and per watt rather than on category labels", "C": "As already settled: ASICs displaced merchant GPUs in frontier training, per Google's 2017 paper", "D": "As settled by the TPU's 15–30x figure, an independent benchmark against 2024-era GPUs on training workloads"}, "answer": "B", "explanation": "The categories are converging: TPUs are matrix ASICs (Google, since 2015), and modern NVIDIA GPUs embed Tensor Cores. Google's 15–30x figure is self-reported, against 2015-era hardware, on datacenter *inference* — never a neutral benchmark."}, {"n": 20, "prompt": "What did Kaplan et al. (2020) actually find?", "options": {"A": "That language-model loss falls as a smooth power law in model size, dataset size, and training compute, with some trends spanning more than seven orders of magnitude", "B": "That model capability jumps discontinuously at fixed parameter thresholds", "C": "That loss falls linearly with the number of GPUs in the cluster", "D": "That doubling training compute reliably doubles benchmark accuracy"}, "answer": "A", "explanation": "Cross-entropy loss falls as a smooth power law in model size, dataset size, and training compute, with some trends spanning 7+ orders of magnitude. The functional form and the range — not any specific exponent — are what make the curve usable for forward underwriting."}, {"n": 21, "prompt": "What did Chinchilla (Hoffmann et al., 2022) demonstrate?", "options": {"A": "That Kaplan's prescription was right: at fixed compute, pour the budget into parameters and keep data modest", "B": "That training data becomes irrelevant beyond roughly 100B parameters", "C": "That GPT-3-era models were significantly undertrained — scaling parameters and tokens equally (~20 tokens per parameter), a 70B model trained on ~1.4T tokens using Gopher's compute budget with 4x the data uniformly outperformed Gopher (280B), GPT-3 (175B), Jurassic-1 (178B), and Megatron-Turing NLG (530B)", "D": "That the compute-optimal ratio is about 200 tokens per parameter"}, "answer": "C", "explanation": "Chinchilla re-spent Gopher's compute budget under an equal-scaling rule (~20 tokens per parameter) and beat models up to 530B with a 70B model. Same budget, better asset: allocation along the curve matters as much as the spend."}, {"n": 22, "prompt": "How should the emergence-versus-mirage question be held?", "options": {"A": "As established fact: capability provably jumps unpredictably at scale", "B": "As settled the other way: the mirage critique disproved emergence", "C": "As irrelevant to infrastructure, since scaling laws predict revenue directly", "D": "As contested — Wei et al. (2022) defined emergent abilities as absent in smaller models and unpredictable by extrapolation, while Schaeffer, Miranda and Koyejo (2023) argued the claimed jumps largely reflect the researcher's choice of nonlinear or discontinuous metrics and evaporate under other metrics — and it sits exactly at the loss-to-capability translation the revenue case depends on"}, "answer": "D", "explanation": "Wei et al. (2022) and Schaeffer et al. (2023) are both live positions, unresolved in this course's sources. It matters because scaling laws predict *loss* while revenue depends on *capabilities* — smooth improvement is forecastable but offers no jackpot; real emergence is unpriceable optionality."}, {"n": 23, "prompt": "What did OpenAI's o1 announcement (September 2024) establish?", "options": {"A": "That pre-training scaling has been retired and replaced", "B": "That performance improves both with more reinforcement learning (train-time compute) and with more time spent thinking per query — establishing test-time compute as a second scaling axis", "C": "That inference cost rises in direct proportion to parameter count", "D": "That the Chinchilla ratio should be raised to 40 tokens per parameter"}, "answer": "B", "explanation": "o1's performance improves with more train-time reinforcement learning *and* with more test-time thinking, adding a second scaling axis without retiring the first — and shifting demand toward per-query inference capacity rather than one-off training clusters."}, {"n": 24, "prompt": "What did Epoch AI's August 2024 analysis conclude about whether scaling *can* continue?", "options": {"A": "That training runs of 2×10²⁹ FLOP will likely be feasible by 2030 if training compute keeps growing ~4x per year, with power the constraint that binds first and chip manufacturing capacity second — a claim about whether the inputs can scale, not about whether the returns hold", "B": "That scaling will stop by 2030 because data runs out first, thereby settling the plateau dispute", "C": "That 4x-per-year compute growth becomes impossible after 2026 on every constraint", "D": "That feasibility and efficacy are the same question, so the analysis resolves the capex debate"}, "answer": "A", "explanation": "Epoch's constraint ordering is power first, then chip manufacturing capacity, alongside data (~500T words of unique indexed text, +50% by 2030) and latency. Feasibility of the inputs is a separate question from efficacy of the returns; feasible-but-ineffective scaling is the pure bubble scenario."}, {"n": 25, "prompt": "How should the November 2024 – November 2025 \"plateau\" dispute be handled?", "options": {"A": "As settled in favour of a plateau: Sutskever's November 2024 statement is decisive", "B": "As settled against a plateau: Altman's \"there is no wall\" post closed the question", "C": "As moot, since test-time compute has entirely replaced pre-training", "D": "As genuinely unresolved: credentialed principals argue from unpublished internal results at different labs and different dates (Sutskever and The Information, November 2024; Altman, November 14, 2024; Vinyals on Gemini 3, November 2025), so date every claim and run analyses under both branches"}, "answer": "D", "explanation": "Both sides argue from unpublished internal results, and Sutskever's claim is specifically about *pre-training*, which is compatible with continued capability scaling on the test-time axis. Treating either side as settled is taking an unmarked position on live dispute #3."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
</html>
