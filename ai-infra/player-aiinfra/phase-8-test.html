<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }

  /* --- Responsive: phones ---------------------------------------------------
     One column already; what breaks on a phone is the fixed bottom bar (it sits
     under the home-indicator without a safe-area inset), the sticky title (it
     pushes the score off-screen), and sub-44px option rows. */
  html { -webkit-text-size-adjust:100%; }
  .bar { padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  @media (hover:none) { * { -webkit-tap-highlight-color:rgba(201,162,39,.18); } }
  @media (max-width:640px){
    .top { padding:11px 14px; gap:10px; }
    .top .title { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .top .score { font-size:11.5px; flex:none; }
    .top a.home { flex:none; font-size:12px; }
    .wrap { padding:18px 14px 132px; }
    h1 { font-size:20px; }
    .intro { padding:14px; font-size:14px; }
    .q { padding:16px 14px; }
    .qh { font-size:15px; }
    .opt { padding:13px 12px; min-height:44px; align-items:center; }
    .expl { font-size:13.5px; padding:10px 12px; }
    .result { padding:18px 14px; font-size:15px; }
    .result .big { font-size:28px; }
    .bar { padding:10px 14px; gap:10px; flex-wrap:wrap; }
    .bar .status { flex:0 0 100%; font-size:12.5px; order:-1; }
    .bar button { flex:1 1 auto; min-height:44px; padding:11px 14px; }
  }
</style>

  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:clamp(22px,6vw,34px);max-width:360px;width:min(88%,360px);text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">

      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:16px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:14px 12px;min-height:44px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "8", "title": "Phase 8 Test — Synthesis", "pass_mark": 20, "questions": [{"n": 1, "prompt": "Which widely quoted 2026 figures does the capstone snapshot deliberately leave blank, and why?", "options": {"A": "None — all twelve candidate claims passed verification, which is why the snapshot is presented as a verdict", "B": "The Alphabet backlog, token and Cloud-margin figures, because they come from an interested party's own earnings materials", "C": "The frontier labs' 2026 revenue run rates (OpenAI \">$40B\"; Anthropic \"$47B/$65B\"), the Q1 2026 combined hyperscaler capex ($129.8B/+80%) and the ~$700B 2026 guidance sum, Alphabet's full Q2 quarter, and the 2026 reasoning-model product shift — five rejected claims, one of which rested on an evidence excerpt attributing a $65B Anthropic run rate to an article that actually says $47B, with the rest relying on anonymous, syndicated or mixed-vintage sourcing", "D": "The ERCOT and LBNL interconnection-queue figures, because queue data is advocacy-adjacent"}, "answer": "C", "explanation": "The capstone's own lesson: *a verified hole beats an unverified fill*. The survival pattern is the sourcing lesson — the verified tape leans on primary announcements, earnings materials and institutional queue data, while the rejected tape leaned on anonymous sourcing and syndication chains. \"Unverified\" does not license guessing: the memo line reads *unverified as of Aug 2026, audited figure pending S-1*."}, {"n": 2, "prompt": "What does the mid-2026 capex-versus-depreciation tape commit, and why is the useful-life divergence a marker rather than a footnote?", "options": {"A": "Combined Microsoft/Alphabet/Amazon/Meta capex of $433.9B over Q2 2025–Q1 2026 against roughly $149B of reported depreciation — a single-year cohort committing $65–75B of new annual depreciation on 6-year server lives or $95–110B if economic lives are nearer 4 years, an ~$36B/year pre-tax earnings swing riding on one judgment call, which is why the four have visibly diverged (Microsoft and Alphabet holding 6 years, Amazon shortening a subset to 5 in January 2025, Meta *extending* to 5.5)", "B": "$433.9B of capex, all of which hits the income statement in the year spent, so the depreciation figure is redundant", "C": "$149B of capex against $433.9B of depreciation, meaning the fleet is already more than fully written down", "D": "$433.9B of capex on a uniform 5-year industry-standard schedule, which removes the assumption risk entirely"}, "answer": "A", "explanation": "Straight-line depreciation is capex ÷ useful life: $433.9B over six years ≈ $72.3B/yr, over four ≈ $108.5B/yr. The ~$36B/yr gap is pure pre-tax earnings swing on an accounting judgment, which is exactly why the divergence is the marker — and note the honest caveat carried from verification: one medium-credibility outlet's tally (Silicon Analysts, July 2026), pending 10-Q corroboration."}, {"n": 3, "prompt": "How does the capstone score the [[Bubble vs Supercycle]] marker set as of August 2026?", "options": {"A": "Bear: the depreciation wall and the debt shift printed while no bull marker did", "B": "Bull: the Google Cloud prints resolved the demand question and retired the bear case", "C": "Resolved in favour of the hybrid case, since the S-1 filings supplied audited numbers", "D": "Still unresolved, with both sides printing simultaneously — bull evidence (Google Cloud backlog $514B, token processing 22B/minute up from 16B the prior quarter, Cloud operating margin 35.6% versus 20.7% a year earlier, Q2 2026) strengthening at the same time as bear evidence (the $433.9B-versus-$149B wall, the named debt shift with Amazon's trailing-twelve-month capex at 102% of operating cash flow at Q1 2026, and OpenAI's disclosed projection of an $85B 2028 burn even with sales doubling) — which is itself the precedent pattern"}, "answer": "D", "explanation": "A tape where the bull's demand evidence and the bear's capital evidence strengthen at the same time is the precedent pattern replaying: real demand growing fast while capital is committed faster. Also note what the S-1 filings are — *events* that schedule an epistemic upgrade, not marker prints; and OpenAI's $122B/$85B 2028 figures are projections surfaced at filing, not results."}, {"n": 4, "prompt": "What is the core connection the chokepoints synthesis draws?", "options": {"A": "That moats and weapons are two separate phenomena that happen to occupy the same industry, and analysts should model them in separate sections", "B": "That a chokepoint is one physical structure with two owners: the scarcity rent and the coercive leverage are the same asset priced by different holders — the firm monetises it as gross margin (ASML guiding 51–53% for 2025; TSMC at 69.9% of global foundry revenue in FY2025; US EDA at 96% share on roughly 1.5% of supply-chain value-add in 2019) while the state that hosts or governs it monetises it as policy reach (the 2019 Dutch EUV licence never renewed, the BIS ladder, Taipei's N-2 rule) — and a weapon is only executable where a moat already exists, since controls on a fragmented competitive market would be unenforceable arbitrage fodder", "C": "That export controls created the chokepoints, which did not exist before October 2022", "D": "That the SIA/BCG count of 50+ single-region chokepoints has been superseded, leaving ASML as the only real one"}, "answer": "B", "explanation": "A moat that took €6B and 17 years of R&D to dig is exactly the kind of moat a government can point like a weapon, because nobody can route around it quickly. Read separately, each face misprices the other: you cannot underwrite ASML's terminal value from technology alone when part of the moat is held in escrow by ministries, and you cannot evaluate the controls without monopoly economics."}, {"n": 5, "prompt": "Why does the synthesis describe chokepoint leverage as \"a depleting stock, not a permanent flow\"?", "options": {"A": "Because BIS rules carry statutory sunset clauses that expire on fixed dates", "B": "Because ASML's patents lapse on a schedule that ends the monopoly automatically", "C": "Because smuggling is illegal and therefore cannot be modelled as a supply response", "D": "Because export controls try to hold access to compute above the market-clearing level, so every price-ceiling instinct applies: excess rents attract entry (Huang's China share falling from ~95% to ~50% while controls \"motivated Chinese firms to build their own chips\"), ceilings breed grey markets (over $1B of banned chips smuggled in a single quarter, FT July 2025), and regulated firms design to the rule (the A800/H800 forcing the October 2023 TPP rewrite) — so each use raises the target's incentive to indigenise (SMIC at 7nm without EUV; a reported Chinese EUV prototype, December 2025)"}, "answer": "D", "explanation": "Every finance instinct about holding a price above the clearing level applies, and the erosion loop is the consequence: the same October 2023 and December 2024 rewrites that closed one workaround are what \"maintaining the option\" costs. Huang and Amodei argue from the *same* chokepoint structure — they disagree about depletion rates, not mechanics."}, {"n": 6, "prompt": "What makes the H20 arc of April–August 2025 the synthesis's cleanest worked example?", "options": {"A": "One asset shows both faces in five months: the chip's spec sheet was drawn by a regulator (the moat already operating inside the weapon's envelope), the April licence requirement turned it into a $4.5B charge (the weapon marking the moat to market), and the August licences-for-15%-of-China-revenue is the state pricing its chokepoint the way a monopolist prices a product — and the chip is three moats deep, fabbed by TSMC in Taiwan on tools only ASML sells and designed on US-controlled EDA, with a different government holding a valve at each layer", "B": "It shows that export controls are ultimately commercial rather than strategic, since a price was found", "C": "It shows the moat was illusory, because a government could destroy $4.5B of value by letter", "D": "It shows chokepoints are irrelevant to P&L, because the licences were restored within four months"}, "answer": "A", "explanation": "One asset, both faces, five months — and the 15% revenue share is where the two faces visibly merge: a licence fee indexed to sales is the state pricing its chokepoint the way a monopolist prices a product, which is precisely why export-control traditionalists find it alarming (a security instrument converted into a revenue instrument)."}, {"n": 7, "prompt": "What mechanism does the moving-bottleneck synthesis identify, and what does it predict about the order of the constraints?", "options": {"A": "That bottlenecks appear at random as demand shocks hit different suppliers, so sequence carries no information", "B": "That an accelerator and its data center are a chain of strict complements, so when demand shocks the chain the link with the *slowest supply response* binds first, captures the scarcity rent until capacity catches up, then hands off to the next-slowest — which is why the migration ran down the supply-elasticity gradient from packaging (one firm's backend capex sprint: ~15–16k → 35–40k → 75–80k planned wafers per month, 2023–2025, roughly Liu's own ~1.5-year estimate) to HBM (a three-supplier oligopoly, sold out for 2024 and most of 2025 by March 2024 and its entire 2026 output by October 2025) to networking to power, the terminus because its supply is least elastic and electrons have no substitute", "C": "That the bottleneck always sits at the most expensive component, so it will stay with HBM while HBM is 35–47% of accelerator cost", "D": "That constraints migrate upward from power toward the fab as grid capacity is added"}, "answer": "B", "explanation": "Not four stories but one mechanism observed at four addresses. The expiry date of a bottleneck is a supply-elasticity calculation, not a mystery: how fast can the scarce layer add capacity, and who has to cooperate? One firm's backend fabs ≈ 1.5 years; a three-supplier memory oligopoly, longer; a regulated grid, no clearing date in the verified base."}, {"n": 8, "prompt": "What decides how long a bottleneck's scarcity rent lasts?", "options": {"A": "The absolute depth of the shortage — the layer with the largest supply gap holds its rent longest", "B": "The capital intensity of the layer, since expensive capacity takes longest to add", "C": "Substitutability, not scarcity — the layers whose rents were contested fastest are the ones where buyers had an exit: networking had Ethernet (the Ultra Ethernet Consortium founded July 2023, spec 1.0 June 2025; Meta training Llama 3 on RoCE at 24,576 GPUs, March 2024); HBM has no substitute but three competing suppliers whose shares swing violently (Samsung 41%→17% of bit shipments year-over-year to Q2 2025, Micron 4%→21%); power has neither substitute nor fast entry (only 13% of two decades of queue applicants ever reached operation), which is why behind-the-meter gas routes around the queue but not around the electrons", "D": "Regulatory attention, since every rent in this stack has drawn an antitrust response"}, "answer": "C", "explanation": "Ranking the four layers by rent *durability* is a better analyst exercise than ranking them by headline scarcity. Note the asymmetry in the routing-around move: Ethernet is a true substitute for InfiniBand, while behind-the-meter gas only bypasses the queue — which is why networking rents were contested within two years while power rents are still hardening."}, {"n": 9, "prompt": "Which statement about the four-stop bottleneck sequence does the synthesis actually support?", "options": {"A": "The constrained party's three moves — queue, integrate, route around — recur at every stop (Apple, AMD, Broadcom and Marvell queuing behind NVIDIA's ~60% CoWoS allocation is structurally the same as ~10,300 projects idling in the interconnection queue; TSMC pulling packaging in-house and NVIDIA buying Mellanox before networking's turn are integration; the UEC and xAI's turbines are routing around) — while the four-stop migration *as one sequence* is the synthesis's own construction, not a claim any single source makes, and constraints can co-bind (packaging and HBM in 2023–24; HBM still sold out through 2026 as of October 2025), so the note stops short of calling power the sole binding constraint of 2026", "B": "The sequence is asserted as a single finding by the underlying sources, and power is established as the sole 2026 constraint", "C": "Each constraint fully cleared before the next began to bind, which is what makes the sequence a clean hand-off", "D": "The sequence is complete: after power there are no further links, so no future migration is possible"}, "answer": "A", "explanation": "The honest edge matters as much as the mechanism. Each lesson alone overstates its own permanence, and the synthesis explicitly declines to claim power is 2026's sole constraint — constraints co-bound before (packaging and HBM in 2023–24) and can again. The uncovered items are also declared: CoWoS and HBM contract pricing, networking's share of cluster capex, and any quantified scarcity premium for grid-connected sites."}, {"n": 10, "prompt": "How do the three mechanisms in \"How Real Is the Demand Signal\" fit together?", "options": {"A": "All three attack the same rung of the evidence ladder, so their effects are redundant", "B": "The ladder was retired in 2025 and replaced by contracted-backlog analysis", "C": "The ladder proves demand is manufactured, since every rung can be faked", "D": "The ChatGPT Moment installed an evidence ladder — narrative → estimate → guidance → capex → revenue — whose implicit promise is that the top rungs are hard to fake; Commitments vs Revenue attacks *volume* below the guidance rung (~$1.4T of mixed instruments — an SEC-disclosed $250B Microsoft purchase, an AMD definitive agreement binding for one gigawatt of six, an NVIDIA letter of intent, an undollared Broadcom term sheet and a press-reported never-filed ~$300B Oracle deal — against $13.07B of audited 2025 revenue, roughly 107x); and Circular Financing attacks *quality* at the top rung, because when the seller's capital enables the buyer's order the seller still books ordinary revenue but the order stops proving independent willingness to pay"}, "answer": "D", "explanation": "One question asked at four points in time. The two mechanisms are orthogonal to each other: the commitment stack manufactures volume *below* the guidance rung, vendor financing corrupts quality *at* it — and instrument seniority is not signal purity, since the most binding leg of OpenAI's stack (Microsoft's contracted $250B) is also a maximally circular one."}, {"n": 11, "prompt": "What is the load-bearing sentence of that synthesis, and what dated evidence shows the drift it warns about?", "options": {"A": "\"Audited revenue is the only evidence that matters\" — supported by NVIDIA's Data Center line rising from $15.0B in FY2023 to $193.7B in FY2026", "B": "\"Announcements are worthless\" — supported by the Oracle deal never being filed", "C": "\"The reliability of a demand signal is not a property of the number — it is a property of the process that produced the number, and that process is now partly owned by the entities being measured.\" The drift is datable: NVIDIA's non-marketable equity portfolio went from $3.4B entering fiscal 2026 to $22.3B leaving it (plus $11.4B of outstanding commitments), so the FY2024–FY2025 ramp (+217%, +142%) *predates* the vendor-investment ramp while the FY2026–FY2027 extension coincides with it — the same revenue line changed evidential grade between 2023 and 2026", "D": "\"Concentration is the real risk\" — supported by two unnamed direct customers at 22% and 14% of FY2026 revenue"}, "answer": "C", "explanation": "Audited ≠ independent. NVIDIA's Data Center line is audited fact; what it *evidences* depends on a decomposition the disclosure regime does not permit (unnamed intermediary customers at 22% and 14% of FY2026 revenue; only \"estimated\" indirect concentration). The system-level point is that signal production became endogenous once demand evidence was shown to move trillions."}, {"n": 12, "prompt": "Run the September 2025 NVIDIA–OpenAI arrangement through the synthesis's four lenses. Which reading is correct?", "options": {"A": "A definitive $100B investment agreement that converted into contracted revenue in Q4 2025, making it the clearest organic-demand print of the cycle", "B": "A letter of intent — not a definitive agreement — announced September 22, 2025 to deploy at least 10 GW, with NVIDIA intending to invest up to $100B progressively (~$10B per gigawatt, each tranche priced at OpenAI's then-current valuation): it belongs on the narrative rung and at Tier 3 of the commitment stack yet is routinely summed into the ~$1.4T beside Microsoft's Tier-1 contract; Huang's own arithmetic puts ~$35B of every $50–60B gigawatt back into NVIDIA products; and as of February 3, 2026 no contract was signed and no money had moved, the WSJ called negotiations \"on ice,\" and NVIDIA's FY2026 10-K said only that it was \"finalizing\" an agreement with \"no assurance\" of completion", "C": "An unlawful round-trip of the kind the SEC charged Lucent with in 2004, since vendor capital enabled the order", "D": "A conventional equity investment identical to NVIDIA's participation in the October 2024 $6.6B round, carrying no signal implications"}, "answer": "B", "explanation": "The market priced the top of the ladder; the filing record still showed the bottom. Note the disposition discipline the note also teaches: Lucent's $8.1B of credit commitments was *lawful* vendor financing — the SEC's 2004 complaint was about revenue *recognition* — so \"circular\" is not a synonym for \"fraudulent,\" and NVIDIA's August 2026 $500B third-party financing consortium is best read as an attempt to move the loop off the summation line."}, {"n": 13, "prompt": "What is the core connection of the depreciation-clock synthesis?", "options": {"A": "One management-set estimate — server useful life — is simultaneously an earnings driver (the 2020–2025 extensions: Microsoft 3→4 then 4→6, Alphabet 3→4 then 4→6, Amazon 3→4→5→6, Oracle 4→6, Meta to 5.5, CoreWeave 5→6, each step worth billions of prospective operating income), a payback denominator (the amortisation window that dominates GPU-hour cost), a margin switch (Kerrisdale reproducing SemiAnalysis work: a GB200 NVL72 server on CoreWeave's 6-year schedule versus Nebius's 4-year cuts modelled server EBIT from ~20.5% to roughly 0%), and a borrowing base (CoreWeave's DDTL capacity is sized as a percentage of the depreciable cost of GPU servers) — so a three-year reality against a six-year book hits earnings, paybacks, margins and collateral simultaneously, from one number", "B": "That depreciation schedules are set by auditors using observed resale prices, making the estimate externally validated", "C": "That the four member concepts share a theme — asset economics — without sharing a parameter", "D": "That useful life matters only to equity analysts, since lenders underwrite contracts rather than assets"}, "answer": "A", "explanation": "The four concepts do not merely share a theme; they share a *parameter*. There is exactly one number, set by management judgment and applied prospectively with no restatement, and every downstream structure prices off it — which is why Chanos's December 2025 line (\"if the economic life on these things is three years... the whole economics of a lot of these deals kind of falls apart\") is a statement about all four dials at once."}, {"n": 14, "prompt": "What does the synthesis say about who sets the useful-life estimate and what audits it?", "options": {"A": "The incentives are genuinely two-sided, since neoclouds prefer short lives to accelerate tax deductions", "B": "An independent standards body sets accelerator useful lives, which is why the schedules converge", "C": "The rental market is set by the vendor, so no arm's-length evidence exists in either direction", "D": "Every party holding the pen benefits from a longer life — hyperscalers book operating income per extension, neoclouds convert roughly 0% modelled EBIT to ~20% and enlarge a depreciable-cost borrowing base, the vendor gets demand that is \"rentable, durable and financeable,\" lenders get collateral cushion on paper — which is why the exceptions are the evidence: Amazon cut a subset from six years to five in Q4 2024 (about −$0.7B of 2025 operating income and ~$920M of accelerated depreciation) citing the pace of AI development. The clock has no disinterested referee; the only arm's-length instrument is the rental curve, and it currently funds both readings (a ≥40%/year H100 decline to an April 2026 composite of $2.82 for the bears; A100s contracted into 2029 and H100s re-booked at 95% of original price for the bulls)"}, "answer": "D", "explanation": "When every incentive points one way, the exceptions are the evidence. And the wrong-way risk compounds at the end of the chain: the vendor defending the six-year thesis (NVIDIA's November 2025 memo; \"rentable, durable and financeable\") is also the residual buyer of last resort — a $6.3B capacity purchase obligation through April 2032 — so if lives disappoint, the most GPU-exposed balance sheet holds the residual-value risk."}, {"n": 15, "prompt": "What does reading the neoclouds through the depreciation clock reveal that the neoclouds note alone does not?", "options": {"A": "That the sector's leverage is modest, since take-or-pay contracts cover more than 98% of revenue", "B": "That the six-year schedule is conservative relative to the physical life of the hardware", "C": "That the debt is secured not by contracts alone but by *depreciable cost*, which makes the sector short its own product's price curve — the same rental-decline series that reads as a customer's delight elsewhere is a mark-to-market of the collateral here — and that the take-or-pay book, the mitigant a fund-finance analyst would demand ($60.7B of RPO), has 38% converting in months 25–48 and the remainder out to month 84, which is precisely where the life dispute lives", "D": "That GAAP operating losses are irrelevant because Adjusted EBITDA margins of 60% capture the true economics"}, "answer": "C", "explanation": "Rents falling ≥40%/year is a customer's delight and a lender's collateral erosion: the same Silicon Data curve is demand evidence in one note and a mark-to-market of collateral in this one. Diversification across instruments — DDTLs, chip SPVs, ABS, residual-value guarantees, vendor backstops — is not diversification across the assumption they all embed."}, {"n": 16, "prompt": "What is the \"conservation law\" the who-holds-the-risk synthesis identifies?", "options": {"A": "That risk is genuinely reduced, because each transfer instrument moves a slice to an informed professional holder", "B": "That the buildout's risk has been tranched, not reduced: project-level transfer is real, but nearly every transfer instrument — intermediary lease, residual value guarantee, capacity backstop, uncommenced lease — is credit-enhanced by the same handful of names whose equity sits at record index weight (Magnificent Seven at 34.3% of the S&P 500 in December 2025, top ten at ~41% weight against ~32% of expected earnings; passive vehicles at 51% of US long-term fund assets; 60% of Vanguard 401(k) participants in a single default target-date fund; $19.9T of US equities in foreign portfolios) — dispersion at the deal level, concentration at the system level, or in the BIS's phrase, \"leverage does not disappear by being out of sight\"", "C": "That risk always ends with the lenders, since debt is senior to equity in every structure", "D": "That the AI labs hold the most risk, since they have the thinnest balance sheets and sign the largest compute commitments"}, "answer": "B", "explanation": "Read the stack as an LBO waterfall: first loss (AI-lab renewal risk), mezzanine (SPV lenders and JV equity), senior wrap (hyperscaler and intermediary credit), residual equity (public shareholders — which at ~41% top-ten index weight now means everyone with a default-allocated 401(k)). A pension fund holding Blue Owl's Hyperion paper and an S&P 500 tracker holds Meta's credit twice and would never see it."}, {"n": 17, "prompt": "Meta's Hyperion joint venture pairs a four-year initial operating lease with a capped residual value guarantee for the first 16 years. What does that combination accomplish?", "options": {"A": "It transfers both the asset and the risk to Blue Owl and PIMCO, which is why the structure reduces Meta's exposure", "B": "It shortens Meta's obligation to four years, after which the JV's lenders hold an unsecured claim", "C": "It converts the campus into a finance lease, bringing the debt onto Meta's balance sheet at inception", "D": "The four-year term gives the sponsor a walk-away option while the 16-year guarantee gives the JV's lenders sponsor-credit protection — so the *asset* left Meta's balance sheet (~$27B of development costs, Blue Owl 80% / Meta 20%, ~$7B of Blue Owl cash partly debt-funded through PIMCO, with Meta contributing land and construction-in-progress and taking a ~$3B distribution) while the *risk* barely did; the template was repeated at El Paso with BlackRock on July 28, 2026 (~$14B, 80/20, $12.5B of debt, an RVG threshold of ~$13B declining over time)"}, "answer": "D", "explanation": "The off-balance-sheet engineering runs through lease classification; the risk never left Meta, only the asset did. Read the two terms together the way a fund-finance analyst would — walk-away option for the sponsor, sponsor-credit protection for the lenders — and note that a guarantee is equity-funded when called, so the RVG resolves to Meta's shareholders."}, {"n": 18, "prompt": "What is the credit-wrapper chain, and which single figure suggests the market has not netted it?", "options": {"A": "The strongest credit in each chain rents its rating to the weakest — OpenAI's compute obligations run through Oracle, which signs the 15–17-year leases that make ~$38B loan packages and $15B joint ventures bankable while itself running negative $23.7B of free cash flow against a $638B RPO of which only 12% converts within twelve months, and xAI's ~$20B Colossus 2 debt sits in a Valor-organised SPV whose lenders look to the GPUs, off xAI's balance sheet. The tell is the BIS's January 2026 finding: $200B+ of private credit to AI-related sectors priced at 6.2 percentage points against 6.1 for non-AI — \"either lenders may be underestimating the risks... or equity markets may be overestimating the future cash flows\"", "B": "The chain runs the other way — thin-balance-sheet labs guarantee the hyperscalers' obligations — and the tell is Oracle's RPO growth", "C": "There is no chain: each SPV is bankruptcy-remote, which is the point of the structure, and the BIS found AI credit spreads several hundred basis points wide of non-AI", "D": "The chain is entirely public-market, and the tell is the Magnificent Seven's 34.3% index weight"}, "answer": "A", "explanation": "The end users with the thinnest balance sheets carry the least contractual risk; the strongest credit in each chain rents its rating to the weakest, for a fee that shows up as growth. If risk transfer genuinely dispersed risk to informed holders, the transferred paper should carry a premium — the 10bp gap says one end of the chain is mispriced, and the synthesis maps who is standing at each end when the answer arrives. (The same BIS bulletin's calming counter is also on the record: AI investment at ~1% of US GDP, systemic risk judged \"moderate.\")"}, {"n": 19, "prompt": "Read backward, what is the causal chain in \"Who Pays for the Power,\" and what asymmetry does its three-year lag create?", "options": {"A": "Bills rise because utilities earn a return on rate base, so the chain begins and ends inside state ratemaking with no wholesale component", "B": "Bills rise because generation retired, so the chain runs from plant closures to prices with data-center demand playing no measurable role", "C": "The bills that fuel the politics exist because the capacity auction cleared high; the auction cleared high in meaningful part because the forecast said demand was coming; and the forecast said so because an unvetted, double-countable pipeline was booked into it. The lag makes corrections trail the money: the 2027/28 auction cleared against the pre-vetting 2025 forecast containing 13,018 MW of forecast new data-center load, while PJM's firm/non-firm vetting arrived January 14, 2026 — *after* that auction cleared — cutting the 2028 peak by 4,414 MW. Forecasts are revisable; auction results are not, and ratepayers pay when the auction clears, not when the load materialises", "D": "The chain runs forward only: community opposition raises project costs, which utilities recover through higher rates"}, "answer": "C", "explanation": "This is the structural asymmetry of the whole system. It is also why the reforms target the *input*: fees at the request layer, derates at the forecast layer, caps at the auction layer, take-or-pay at the retail layer — every one of them the same term sheet applied at a different altitude."}, {"n": 20, "prompt": "What single sentence does that synthesis install, and how does the chain pay out under both branches of the bubble question?", "options": {"A": "\"Cost causation guarantees that whoever causes a cost pays it\" — and under both branches the allocation doctrine ensures data centers bear their own costs", "B": "\"In a regulated system, a demand forecast is not a prediction — it is a cost-allocation instrument, and whoever controls its inputs without bearing its errors is holding a free option written by captive ratepayers.\" Every corrective instrument reassigns that option toward the party generating the uncertainty, and none refunds the vintages already collected: if the demand is real, hyperscalers hold take-or-pay obligations duration-matched to the buildout (12–15 years) and the cost side of every gigawatt commitment hardens; if it is phantom, ratepayers have already paid much of the premium — the IMM attributes $29.4B, 46% of four auctions' $63.6B in capacity charges, to data-center load, actual and forecast, collected whether or not the load shows", "C": "\"The capacity market is obsolete\" — and under both branches ERCOT's energy-only design is shown to be the correct one", "D": "\"Regulators always act too late\" — and under both branches the reforms arrive after the cycle has ended, so they can be ignored in modelling"}, "answer": "B", "explanation": "The bubble question has a distributional answer either way, and this chain is where it gets paid. Note the layer where cost causation leaks: the retail tariff wave fixes dedicated infrastructure, but capacity cost formed at the wholesale layer is paid by load-serving entities for *all* load and socialised through the same retail machinery — the doctrine is intact, the incidence is not, and whether the protections close the gap at scale is explicitly open."}, {"n": 21, "prompt": "Into which three questions does \"Is this time different?\" decompose, and which member note answers each?", "options": {"A": "Into technology, capital and regulation — answered by the scaling, financing and policy notes respectively", "B": "Into whether AI works, whether it sells, and whether it is legal — answered by the winters, the inference note and the export-control note", "C": "Into supply, demand and price — with the verdict note answering all three at once", "D": "Into the base rate ([[AI Winters and Prehistory]] plus [[Bubble vs Supercycle]]: four documented busts in which demand never collapsed — the 1966–80 funding audit, the 1987–93 substrate crossover when a ~$500M LISP-machine industry repriced in a single year while workload demand survived, the Railway Mania at −66.7% with hardly any lines going bankrupt, and the telecom bust burning ~$2T of market capitalisation and ~$1T of debt while traffic grew ~100%/year), the claimed base-rate breaker ([[Scaling Laws]]: a measured power-law return function that would make pre-emptive capex option-buying rather than demand-blind extrapolation), and the rewritten demand variable ([[Training vs Inference Infrastructure]]: recurring, invoiced, per-token revenue that no prior AI boom had)"}, "answer": "D", "explanation": "The composite is what makes the slogan gradable: different in *funder structure* (no single switch to flip — revenue-seeking capex at roughly 100x peak-1980s scale versus concentrated grant funders), different in *demand structure* (recurring invoiced revenue, with a deflation clause), unresolved on the *return function*, and — if it cracks — identical in plumbing."}, {"n": 22, "prompt": "What does the synthesis mean by saying the base rate's trigger mechanism \"has no modern seat\"?", "options": {"A": "Both winters ended when a concentrated auditor performed the capability check — ALPAC in 1966, Lighthill in 1973, a single DARPA program director in 1987 — and a funding decision followed; today's equivalent audit (has the return function plateaued?) cannot be performed, because frontier pre-training results are unpublished, so the dispute runs on quotes about private evidence from interested parties. The diffuse substitute is the capital market, which audits violently, on sentiment, and reversibly — January 27, 2025: nearly −17%, $589B erased, reversed into a $4T market capitalisation by July 9, 2025. It cuts both ways: no single switch to flip, and no institution able to end the argument", "B": "That regulators have not yet been assigned jurisdiction over AI capability claims, which the EU AI Act will fix", "C": "That the auditors of the hyperscalers refuse to opine on useful lives, leaving the schedules unaudited", "D": "That the market monitor role played by Monitoring Analytics in PJM has no equivalent in semiconductors"}, "answer": "A", "explanation": "Both winters teach what happens after the audit comes back negative; nothing in the record teaches what happens when the audit cannot be run. Epoch's feasibility envelope keeps the eeriest scenario open — feasible scaling of possibly-ineffective compute, the pure bubble mechanics, with no institution positioned to call it."}, {"n": 23, "prompt": "What is the \"wrong-building risk\" the synthesis constructs from three of its members, and what does it imply can print simultaneously?", "options": {"A": "That data centers built for training cannot be permitted for inference, so a plateau would strand them on regulatory grounds", "B": "Because training and inference data centers are now different building types — power-sited remote campuses running one unsplittable synchronised job versus latency-sited metro fleets serving independent per-query work, diverging in siting, cooling, electrical design and underwriting — a pre-training plateau combined with a continuing inference boom would strand a specific asset configuration while total demand keeps growing: the 1987 LISP-machine mechanism at building scale, in which \"AI demand stays strong\" and \"a class of AI infrastructure gets written down\" both print. The related caution is that the power law predicts *loss*, not revenue, leaving it two contested translations (loss→capability, capability→revenue) short of what the capex must earn", "C": "That inference fleets will be stranded first, because token prices fell 9x–900x per year between 2022 and 2025", "D": "That the risk is fully hedged, since operators can convert training campuses to inference use at negligible cost"}, "answer": "B", "explanation": "Remote gigawatt training campuses as the Symbolics of this cycle, metro inference fleets as the Apple/IBM side. It is also the both-true structure the railway resolution predicts: the technology transformed Britain while roughly a third of the invested capital was destroyed. And note the provenance discipline the same note installs — the ~100x reasoning-token multiplier comes from the capacity seller, the UUNET seat of this cycle."}, {"n": 24, "prompt": "What is the two-sided dependency at the heart of the NVIDIA-tax synthesis?", "options": {"A": "That NVIDIA depends on TSMC while TSMC depends on ASML, so the margin is really three companies' margin stacked", "B": "That NVIDIA depends on the hyperscalers for revenue while the hyperscalers depend on NVIDIA for supply, which is a mutual-hostage situation with no pricing consequence", "C": "That the same number sits on both sides of the ledger: NVIDIA's ~75% gross margin is the incumbent's earnings engine and simultaneously the dominant input cost of the industry's basic unit — capital recovery is $9.24 of the $12.50 all-in server-hour, roughly 74%, on a $285,000 server bought from a vendor keeping about three-quarters of every revenue dollar — so every point of margin or share NVIDIA loses is a point of compute-per-capex-dollar every buyer gains. Tax erosion is NVIDIA-bearish and buildout-bullish at once, which means a portfolio long NVIDIA *and* long the AI capex thesis is long and short the same number", "D": "That NVIDIA collects the margin while Broadcom collects the backlog, so the two cancel out at industry level"}, "answer": "C", "explanation": "No member note states this, because each sees only its side of the ledger. The timing asymmetry is what makes the tax safe for the collector and dangerous for the payer: NVIDIA collects up front, in full, at ~75% margin the moment the system ships, while the buyer recovers the same capital over years against a rental price that fell ≥40%/year — which is how NVIDIA's revenue record and the 2023 vintage's underwater math coexist without contradiction."}, {"n": 25, "prompt": "How should the market-share scoreboard on the custom-silicon rebellion be read, and what would count as evidence the tax is actually eroding?", "options": {"A": "Chain the figures: 98% of the market in 2023 falling to ~75% by 2026 is a collapse in progress, and FY26's 71.1% GAAP gross margin confirms it", "B": "Ignore share entirely and watch absolute revenue, which has only ever risen", "C": "Treat TechInsights' 98% as the only sound basis, since revenue estimates are modelled rather than measured", "D": "Never chain the two figures: TechInsights' 98% of 2023 data-center GPUs excludes captive accelerators by construction (a million-TPU commitment and ~500,000 Trainium2 chips generate zero \"sales\" in a GPU-market statistic), while the one basis that includes them — Silicon Analysts' AI-accelerator revenue estimate — runs ~87% at the 2024 peak toward a projected ~75% by 2026 with a likely 65–70% floor, and absolute NVIDIA revenue keeps growing because the market expands faster than anyone captures it. FY26's compression to 71.1% GAAP traces to identified non-competitive causes (a $4.5B H20 export charge and Blackwell system mix), with the quarterly figure back at 75.0% by Q4 FY26 — so erosion evidence would be margin compression *without* such a cause, alongside the pre-registered 2H2026 tests (MI450X rack-scale versus VR200 NVL144; actual deployment of the OpenAI–Broadcom racks; a basis-consistent 2026 share print)"}, "answer": "D", "explanation": "Share erosion and incumbent growth are simultaneously true; the margin tape, not the share tape, is the cleaner tell. And remember the rebellion's own toll — Broadcom monetises every \"should we build our own chip?\" decision (~$73B blended backlog) — so the analyst's question is never \"tax or no tax\" but \"whose tax, at what rate, with what lock-in.\" The single most decision-relevant gap remains that no verified all-in cost per TPU- or Trainium-hour exists, so \"custom silicon saves the margin\" is structure, not arithmetic."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
