 multiplications — a massively parallel workload that GPUs (built for the parallel math of graphics rendering) execute thou","q":["How much of NVIDIA's position is the silicon vs the CUDA software ecosystem — and how durable is each? (Now answered in NVIDIA and the CUDA Moat — the moat is the software; durability is genuinely ope","If TPU-style ASICs are 15–30x better on a fixed workload, why hasn't custom silicon displaced merchant GPUs? (Workload churn, ecosystem, supply — later notes.)","What does the 30–50% utilization figure imply for the effective cost of a delivered FLOP — and for GPU useful-life economics (dispute #2)?"],"x":-0.1561,"y":0.1486,"b":0},{"t":"Scaling Laws","h":"player-aiinfra/scaling-laws.html","w":1,"p":"1","d":30,"o":"Scaling laws are the empirical finding (Kaplan et al., 2020) that a language model's prediction error falls as a smooth power law in three inputs — model size, dataset size, and training compute — a regularity so consist","q":["If pre-training stalls but test-time compute keeps scaling, how does the demand *mix* shift between training clusters and inference capacity — and who wins/loses at each layer? (Training vs Inference ","Does synthetic data relax the ~500T-word data horizon, or does quality-bounded data remain the first fundamental wall? (Not answerable from these sources.)","What would independently verifiable evidence on frontier pre-training deltas even look like, given labs publish quotes rather than results? (Open; dispute #3 tracking.)"],"x":0.1287,"y":-0.1729,"b":0},{"t":"The Fabless-Foundry Model","h":"player-aiinfra/the-fabless-foundry-model.html","w":1,"p":"2","d":25,"o":"The fabless-foundry model is the semiconductor industry's split of chip *design* from chip *manufacture* into separate companies — fabless firms that design but don't manufacture (NVIDIA; AMD since 2009), pure-play found","q":["TSMC's fabs are overwhelmingly in Taiwan — what does geographic concentration of the 69.9% foundry do to the AI supply chain's risk profile? (TSMC and Taiwan Concentration)","How does a fabless customer actually secure capacity — allocation, prepayments, long-term agreements? (Not covered by this note's sources; later note.)","Has Intel Foundry Services won meaningful external customers since March 2021, and can an IDM foundry overcome the conflict problem? (Outcome not in verified base; track as open.)"],"x":0.3107,"y":0.0159,"b":1},{"t":"EUV Lithography and ASML","h":"player-aiinfra/euv-lithography-and-asml.html","w":1,"p":"2","d":24,"o":"EUV (extreme ultraviolet) lithography is the chip-fabrication technology that prints circuit patterns with 13.5 nm light — generated by vaporizing molten tin droplets with a laser and steered by mirrors in a vacuum — and","q":["Who actually operates these machines and turns wafers into products — what is a foundry, and how did design and manufacturing split? (The Fabless-Foundry Model)","Why does so much of the installed EUV base sit on one island, and what does that concentration do to risk pricing? (TSMC and Taiwan Concentration)","Printing the die is one step — how do printed dies become AI packages with stacked memory? (Advanced Packaging; Memory Hierarchy and HBM.)"],"x":0.2324,"y":0.2068,"b":1},{"t":"Memory Hierarchy and HBM","h":"player-aiinfra/memory-hierarchy-and-hbm.html","w":1,"p":"2","d":25,"o":"High Bandwidth Memory (HBM) is DRAM re-engineered for the AI era — memory dies stacked vertically, wired through the silicon itself, and placed millimeters from the GPU — created because processor compute has grown rough","q":["What price and contract terms sit behind the sold-out backlog — take-or-pay, or cancellable? (Not in the verified record.)","If accelerator demand disappoints, how fast does the HBM market revert to memory's historical cyclicality? (Bubble-vs-supercycle dispute.)","How do the suppliers' capex expansion plans compare to the demand forecasts — is the oligopoly overbuilding?"],"x":-0.066,"y":0.304,"b":1},{"t":"Advanced Packaging","h":"player-aiinfra/advanced-packaging.html","w":1,"p":"2","d":21,"o":"Advanced packaging is the manufacturing step that joins multiple finished dies — typically a GPU logic die and stacks of high-bandwidth memory — so tightly (on TSMC's CoWoS, side by side on a silicon interposer) that the","q":["What exactly is HBM, why is *its* supply constrained, and how did the bottleneck hand off from packaging to memory? (Memory Hierarchy and HBM)","What does a CoWoS slot cost, and how is scarce capacity actually priced/contracted between TSMC and NVIDIA? (Not covered by the verified base — allocation mechanics are known, pricing is not.)","How much of TSMC's capex went to backend vs front-end fabs during the doubling sprint, and what were the returns? (Later modules' capex analysis.)"],"x":-0.221,"y":0.219,"b":1},{"t":"TSMC and Taiwan Concentration","h":"player-aiinfra/tsmc-and-taiwan-concentration.html","w":1,"p":"2","d":18,"o":"Taiwan concentration is the fact that roughly 90% of the world's most advanced chip manufacturing — on the widest-quoted basis — sits on one island, in one company's fabs, making TSMC's Taiwan operations a single point o","q":["What is the actual probability distribution over blockade/invasion scenarios? (Not in the verified base — and mostly not knowable; the note prices severity only.)","How would TSMC and its customers ration allocation in a partial interruption (earthquake, export cut, blockade-short-of-war)? (Pending; allocation economics not covered.)","How far has China's domestic capability (SMIC) advanced despite export controls — does a substitute frontier exist at any horizon? (US Export Controls on China — 7nm without EUV, verified; the frontie"],"x":0.0638,"y":-0.3045,"b":1},{"t":"The Semiconductor Supply Chain Map","h":"player-aiinfra/the-semiconductor-supply-chain-map.html","w":1,"p":"2","d":24,"o":"The semiconductor supply chain is a three-stage production pipeline — chip design, wafer fabrication, and assembly/test/packaging (ATP) — fed by four upstream input industries (EDA software, core IP, manufacturing equipm","q":["The map shows 92% of sub-10nm capacity in Taiwan (April 2021) — what does that concentration mean for the AI buildout specifically, and what would re-shoring cost? (TSMC and Taiwan Concentration)","If US EDA and US/Japan/Dutch equipment are chokepoints, how exactly have they been weaponized — and with what effect on China's chain? (US Export Controls on China)","The 50+ chokepoints vary in risk — which ones have long replication lags vs low re-entry barriers, and how would an analyst risk-weight the full list? (Not in the verified base; open.)"],"x":0.2555,"y":-0.1775,"b":1},{"t":"Anatomy of an AI Data Center","h":"player-aiinfra/anatomy-of-an-ai-data-center.html","w":1,"p":"3","d":26,"o":"An AI data center is a purpose-built industrial facility — organized as a physical hierarchy of site → building → data hall → row → rack → server — whose capacity is quoted in critical IT power (the kW/MW available to th","q":["If grid draw = IT load × PUE, who supplies the ~130+ MW per building, and how long does interconnection take? → Power as the Binding Constraint","What does direct-to-chip liquid cooling physically involve, and what is its water footprint? → Cooling from Air to Liquid","Who funds a $4B building that is majority depreciating silicon, and on what security? → Financing the Buildout, GPU Depreciation Economics"],"x":0.3709,"y":0.1668,"b":2},{"t":"Power as the Binding Constraint","h":"player-aiinfra/power-as-the-binding-constraint.html","w":1,"p":"3","d":29,"o":"Power is the binding constraint of the AI buildout because AI campuses have jumped to gigawatt scale while the US grid's interconnection process — its queue of ~1,400 GW of waiting generation, its >4-year median connecti","q":["Where do you site a gigawatt campus given the queue geography — and what did Abilene, Memphis, and Louisiana have that other sites didn't? → Siting and the Gigawatt Buildout","How much of the gap between IT load and grid draw can cooling design close? → Cooling from Air to Liquid","Who finances a campus whose power is contracted for 20 years but whose GPUs depreciate in a fraction of that — and what's the duration mismatch worth? → Financing the Buildout"],"x":0.2476,"y":0.3226,"b":2},{"t":"Cooling from Air to Liquid","h":"player-aiinfra/cooling-from-air-to-liquid.html","w":1,"p":"3","d":16,"o":"The air-to-liquid cooling transition is the industry-wide re-plumbing forced by AI rack densities (~120–130 kW for a GB200 NVL72 versus the ~12 kW legacy colocation ceiling) blowing through the 20–40 kW range where air c","q":["What does the water externality do to local approval politics, and which named fights illustrate it? → Data Centers vs Communities","How do water availability and climate rank against power access in siting decisions? → Siting and the Gigawatt Buildout","What is the actual PUE penalty (if any) of zero-water closed-loop designs? **Open — not in the verified set.**"],"x":-0.0374,"y":0.4049,"b":2},{"t":"Siting and the Gigawatt Buildout","h":"player-aiinfra/siting-and-the-gigawatt-buildout.html","w":1,"p":"3","d":22,"o":"Siting is the discipline of choosing where AI data centers get built, and in the gigawatt era it has inverted: confirmed contractual access to power — not fiber, not proximity to users — is the threshold criterion, letti","q":[],"x":-0.2248,"y":0.3389,"b":2},{"t":"Interconnects and Networking","h":"player-aiinfra/interconnects-and-networking.html","w":1,"p":"3","d":18,"o":"Interconnects and networking are the links that let GPUs exchange data — a small, blindingly fast scale-up domain (NVLink) inside the rack and a much larger, ~18x slower scale-out fabric (InfiniBand or Ethernet) across t","q":["What is the actual market-share split between InfiniBand and Ethernet in AI back-ends over time? (No verified series.)","How does NVIDIA's $10B+ networking revenue split between InfiniBand and Spectrum-X Ethernet? (Not disclosed in the verified set.)","Did Meta's two fabrics differ in delivered training performance? (Substitutability proven; no benchmark in the record.)"],"x":-0.3828,"y":0.1374,"b":2},{"t":"Data Storage and Training Data Pipelines","h":"player-aiinfra/data-storage-and-training-data-pipelines.html","w":1,"p":"3","d":10,"o":"The training data pipeline is the industrial process that turns the raw web (plus licensed and purchased content) into the curated, tokenized corpus a training run consumes — and the storage layer is the petabyte-scale, ","q":["What fraction of a frontier lab's opex do licensing deals now represent, and are terms escalating deal-over-deal? (Disclosed tape is too thin to say.)","Does object storage actually displace parallel file systems at the frontier, and who wins that vendor fight? (Secondary-source claim as of Feb 2025.)","Has synthetic data broken out of the math/coding niche since Epoch's June 2024 caution? (Not covered by this note's verified set.)"],"x":-0.3905,"y":-0.1136,"b":2},{"t":"Training vs Inference Infrastructure","h":"player-aiinfra/training-vs-inference-infrastructure.html","w":1,"p":"3","d":17,"o":"Training and inference are not just two workloads on the same hardware — they are diverging into two different kinds of physical facility (one giant, power-sited, synchronized campus vs.","q":[],"x":0.3684,"y":-0.1722,"b":2},{"t":"AI Winters and Prehistory","h":"player-aiinfra/ai-winters-and-prehistory.html","w":1,"p":"4","d":16,"o":"The \"AI winters\" were two documented collapses of AI funding and commercial activity — roughly 1966–1980 (government research funding withdrawn after capability promises failed audits) and 1987–1993 (a $1B/year commercia","q":["What ended the last winter — what changed between 1993 and 2012 that made the connectionist line finally deliver? (→ The Deep Learning Revival)","Is there a modern equivalent of the concentrated funder whose single decision could flip the switch — and is it capital markets, a hyperscaler board, or nobody?","If commodity hardware killed both specialized-hardware generations, what would a \"commodity crossover\" against the GPU fleet even look like? (→ finance module, GPU useful life)"],"x":0.501,"y":0.0349,"b":3},{"t":"The Deep Learning Revival","h":"player-aiinfra/the-deep-learning-revival.html","w":1,"p":"4","d":12,"o":"The deep learning revival is the roughly 2006–2016 sequence in which the neural-network tradition — kept alive through its unfashionable years partly by CIFAR's Neural Computation and Adaptive Perception program uniting ","q":["The revival's winning architecture was the CNN — so how did a 2017 architecture (the transformer) displace it as the substrate's workload, and what did that do to compute demand? (→ Transformers and t","If a 6-month compute-doubling regime opened ~2010, what physical inputs eventually bind it — and when? (→ Power as the Binding Constraint, Scaling Laws)","DeepMind's price was contested within ~25% in real time. At today's hundred-billion-dollar lab valuations, has price discovery for pre-revenue AI capability gotten better or worse?"],"x":0.2893,"y":0.4105,"b":3},{"t":"Transformers and the Rise of the Labs","h":"player-aiinfra/transformers-and-the-rise-of-the-labs.html","w":1,"p":"4","d":17,"o":"Between June 2017 and roughly 2022, a single Google paper introducing the transformer — an architecture whose all-attention design made training massively parallelizable — was converted by a handful of labs into the GPT ","q":["What demand shock turned this landscape from research labs into the anchor tenants of a trillion-dollar buildout? (→ The ChatGPT Moment)","The 2019 Microsoft deal put capital, compute, and distribution in one counterparty — how did that structure evolve under stress, and who gained leverage? (later notes on the player landscape)","The capped-profit was the first exotic structure the compute bill forced; what structures did the *next* orders of magnitude force? (financing module: GPU-backed debt, SPV JVs, vendor equity)"],"x":-0.2801,"y":-0.4169,"b":3},{"t":"The ChatGPT Moment","h":"player-aiinfra/the-chatgpt-moment.html","w":1,"p":"4","d":18,"o":"The ChatGPT Moment is the period opened by OpenAI's November 30, 2022 release of ChatGPT — a free conversational fine-tune of an already-trained GPT-3.5-series model — during which AI demand became *legible to markets* t","q":["Meta's February 2024 guide was $30–37B — how did the hyperscalers' capex lines escalate from there, and what depreciation and useful-life assumptions ride on those numbers? (→ The Hyperscalers)","The guidance proved orders existed; whose revenue models justify the orders' *continuation* — and what happened when NVIDIA's guides met subsequent quarters? (→ Training vs Inference Infrastructure fo","EO 14110 metered compute at 10^26 operations; how did export controls extend the metering to chips and countries? (US Export Controls on China)"],"x":0.2751,"y":-0.4202,"b":3},{"t":"NVIDIA and the CUDA Moat","h":"player-aiinfra/nvidia-and-the-cuda-moat.html","w":1,"p":"5","d":35,"o":"NVIDIA is the merchant supplier of AI compute whose ~75% gross margins are defended less by its silicon than by CUDA — a two-decade, continuously rewritten software platform whose switching costs let it price full system","q":["Who are the counterparties economically, and how do their capex budgets and custom-silicon programs respond to paying the 75% tax? (→ The Hyperscalers, The Challengers)","What does NVIDIA investing in its own customers do to the quality of this revenue? (→ Circular Financing)","What is NVIDIA's actual market share, on what basis, and how fast is it changing? (Not in this note's verified set → The Challengers)"],"x":0.5866,"y":0.1152,"b":4},{"t":"The Hyperscalers","h":"player-aiinfra/the-hyperscalers.html","w":1,"p":"5","d":40,"o":"The hyperscalers are the handful of giant cloud and internet firms — for this course, Microsoft, Alphabet, Amazon, Meta, and Oracle — whose balance sheets fund t const COURSE = "AI Infrastructure";
const cv = document.getElementById('sky'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, cxp = 0, cyp = 0, scale = 1;
let hover = -1, selected = -1, filter = 'all', query = '';

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('pe-demo-progress::' + COURSE) || '[]')); } catch(e){}

const adj = NODES.map(function(){ return []; });
EDGES.forEach(function(e){ adj[e[0]].push(e[1]); adj[e[1]].push(e[0]); });

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cxp = W / 2; cyp = H / 2 + 10;
  scale = Math.min(W, H) * 0.44;
  draw();
}
const px = n => cxp + n.x * scale;
const py = n => cyp + n.y * scale;
const radius = n => 1.9 + Math.min(5.2, Math.sqrt(n.d || 0) * 1.15);

function visible(k){
  const n = NODES[k];
  if(query && n.t.toLowerCase().indexOf(query) < 0) return false;
  if(filter === 'unwritten') return !n.w;
  if(filter === 'done') return done.has(n.t);
  return true;
}

function draw(){
  cx.clearRect(0, 0, W, H);
  // Phase bands: the course's own structure, drawn as orbits.
  const bands = [...new Set(NODES.map(n => n.b))].sort((a,b) => a-b);
  bands.forEach(function(b){
    const sample = NODES.find(n => n.b === b);
    if(!sample) return;
    const r = Math.hypot(sample.x, sample.y) * scale;
    cx.beginPath(); cx.arc(cxp, cyp, r, 0, Math.PI*2);
    cx.strokeStyle = 'rgba(44,63,94,.5)'; cx.lineWidth = 1;
    cx.setLineDash(b === Math.max(...bands) ? [3,5] : []); cx.stroke(); cx.setLineDash([]);
  });
  // At rest only the selected node's neighbourhood is wired, or the whole map
  // becomes an unreadable mesh.
  const focus = hover >= 0 ? hover : selected;
  if(focus >= 0){
    cx.strokeStyle = 'rgba(201,162,39,.4)'; cx.lineWidth = 1;
    adj[focus].forEach(function(j){
      cx.beginPath();
      cx.moveTo(px(NODES[focus]), py(NODES[focus]));
      cx.lineTo(px(NODES[j]), py(NODES[j]));
      cx.stroke();
    });
  }
  NODES.forEach(function(n, k){
    const vis = visible(k);
    const r = radius(n);
    const isFocus = k === focus, near = focus >= 0 && adj[focus].indexOf(k) >= 0;
    cx.globalAlpha = vis ? (focus < 0 || isFocus || near ? 1 : 0.28) : 0.07;
    if(done.has(n.t)){
      const g = cx.createRadialGradient(px(n), py(n), 0, px(n), py(n), r*4.5);
      g.addColorStop(0, 'rgba(236,205,107,.5)'); g.addColorStop(1, 'rgba(236,205,107,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(px(n), py(n), r*4.5, 0, Math.PI*2); cx.fill();
    }
    cx.beginPath(); cx.arc(px(n), py(n), r, 0, Math.PI*2);
    if(n.w){ cx.fillStyle = isFocus ? '#fff' : (done.has(n.t) ? '#eccd6b' : '#dfe8fb'); cx.fill(); }
    else { cx.strokeStyle = isFocus ? '#eccd6b' : '#d8a13a'; cx.lineWidth = 1.3; cx.stroke(); }
    if(isFocus || (vis && query)){
      cx.globalAlpha = 1; cx.fillStyle = '#e8ecf4';
      cx.font = '12px Spectral, Georgia, serif'; cx.textAlign = 'center';
      cx.fillText(n.t.slice(0, 34), px(n), py(n) - r - 7);
    }
  });
  cx.globalAlpha = 1;
}

function hit(mx, my){
  let best = -1, bd = 16;
  NODES.forEach(function(n, k){
    if(!visible(k)) return;
    const d = Math.hypot(px(n) - mx, py(n) - my);
    if(d < Math.max(bd, radius(n) + 8) && d < bd){ bd = d; best = k; }
  });
  return best;
}

function showPanel(k){
  const n = NODES[k];
  selected = k;
  document.getElementById('pt').textContent = n.t;
  document.getElementById('pm').textContent =
    (n.p ? 'Phase ' + n.p + ' · ' : '') + (n.w ? '' : 'not written yet · ') + adj[k].length + ' links';
  document.getElementById('po').textContent = n.o || (n.w ? '' : 'Referenced by other lessons, but no note exists yet.');
  const qs = document.getElementById('pq'); qs.innerHTML = '';
  (n.q || []).forEach(function(q){ const li = document.createElement('li'); li.textContent = q; qs.appendChild(li); });
  const links = document.getElementById('pl'); links.innerHTML = '';
  if(n.h){ const a = document.createElement('a'); a.href = n.h.split('/').pop(); a.textContent = 'Open lesson →'; links.appendChild(a); }
  else { const sp = document.createElement('span'); sp.textContent = '✦ Not charted yet'; links.appendChild(sp); }
  document.getElementById('panel').classList.add('show');
  draw();
}

cv.addEventListener('pointermove', function(e){
  const k = hit(e.clientX, e.clientY);
  const tip = document.getElementById('tip');
  if(k !== hover){ hover = k; draw(); }
  if(k >= 0){
    tip.textContent = NODES[k].t;
    tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 13) + 'px';
    tip.style.top = (e.clientY + 15) + 'px';
    tip.classList.add('on');
    cv.style.cursor = 'pointer';
  } else { tip.classList.remove('on'); cv.style.cursor = 'default'; }
});
cv.addEventListener('pointerdown', function(e){
  const k = hit(e.clientX, e.clientY);
  if(k >= 0) showPanel(k);
  else { selected = -1; document.getElementById('panel').classList.remove('show'); draw(); }
});
document.getElementById('pclose').onclick = function(){
  selected = -1; document.getElementById('panel').classList.remove('show'); draw();
};
document.getElementById('search').addEventListener('input', function(e){
  query = e.target.value.trim().toLowerCase(); draw();
});
function setFilter(f, btn){
  filter = f;
  document.querySelectorAll('.filters button').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on'); draw();
}
document.getElementById('fAll').onclick = function(){ setFilter('all', this); };
document.getElementById('fUnwritten').onclick = function(){ setFilter('unwritten', this); };
document.getElementById('fDone').onclick = function(){ setFilter('done', this); };
window.addEventListener('resize', resize);
resize();
</script>
<div id="pe-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0b1020;display:flex;align-items:center;justify-content:center;font-family:Spectral,Georgia,serif">
  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:clamp(22px,6vw,34px);max-width:360px;width:min(88%,360px);text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">

      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:16px;outline:none;font-family:Spectral,serif">

  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>
