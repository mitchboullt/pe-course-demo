<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }
</style>

  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:34px;max-width:360px;width:88%;text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">

      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:15px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:12px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "2", "title": "Phase 2 Test — The Chip Supply Chain", "pass_mark": 20, "questions": [{"n": 1, "prompt": "Define the industry's three business models with a current example of each.", "options": {"A": "Fabless firms own fabs but license their designs out; foundries only design; IDMs only market", "B": "Fabless firms design chips and outsource manufacturing (NVIDIA; AMD since 2009); pure-play foundries manufacture customers' designs and never sell own-brand chips (TSMC, since 1987); IDMs design and manufacture in-house (Intel, Samsung)", "C": "Fabless firms manufacture at mature nodes only; foundries handle the leading edge; IDMs handle packaging", "D": "The three terms are interchangeable descriptions of contract manufacturing"}, "answer": "B", "explanation": "Classify by *current* structure with a date attached: AMD was an IDM until the 2008–09 spin-off and has been fabless since 2009. Only TSMC among the leading-edge trio is pure-play; Samsung and Intel are IDMs whose foundry arms carry the customer-competitor conflict."}, {"n": 2, "prompt": "State TSMC's founding facts.", "options": {"A": "Founded in Taiwan in 1987 by Morris Chang — then 56, after a 25-year career at Texas Instruments — with about $220M of capital; Taiwan's National Development Fund took 48% and Philips just under 28%, Philips also contributing production technology and IP licences", "B": "Founded in 1997 by Jerry Sanders with $2.1 billion from Abu Dhabi's ATIC", "C": "Founded in 1987 as a joint venture between Intel and Samsung to share fab costs", "D": "Founded in 1975 by Gordon Moore as a spin-out of Fairchild's manufacturing arm"}, "answer": "A", "explanation": "TSMC opened in February 1987 with roughly $220M, a 48% stake held by Taiwan's National Development Fund and just under 28% by Philips — a state-anchored venture with a strategic corporate partner contributing technology in kind, not a private-venture story."}, {"n": 3, "prompt": "Why is the pure-play clause — never selling own-brand chips — the structural key to the foundry model?", "options": {"A": "It is a tax structure required under Taiwanese law", "B": "It keeps costs low by eliminating sales and marketing expense", "C": "It is a historical accident with no bearing on how the business works", "D": "It removes the conflict of interest: customers hand over complete chip designs, so a manufacturer that also sold competing chips could not be trusted — renouncing own-brand products is what lets TSMC serve direct rivals simultaneously, and it is what made the fabless industry possible"}, "answer": "D", "explanation": "The \"never own-brand\" commitment is the trust structure, and the trust structure is the business model — it is what allows the same manufacturer to serve NVIDIA and NVIDIA's rivals at once, and it is what made the fabless industry viable."}, {"n": 4, "prompt": "What did the fab-cost ratchet do to industry structure?", "options": {"A": "Fab costs fell from ~$20B (1983) to ~$50M (2024) as tooling standardised, opening the field to new entrants", "B": "Fab costs are dominated by silicon feedstock, so they track wafer prices", "C": "Fab costs rose from ~$50M (1983) to $20–30B for an advanced leading-edge fab (2024), roughly +30% per process node, with 70–80% of a fab's cost being process tools — a ratchet that pushed sub-scale IDMs out (AMD announced the spin-off of its fabs into GlobalFoundries in October 2008) and left only TSMC, Samsung and Intel at the leading edge as of 2025", "D": "Fab costs rose steadily but the number of leading-edge manufacturers held constant, because governments subsidised every entrant"}, "answer": "C", "explanation": "The ratchet is the moat mechanism: compounding at ~30% per node, cost roughly doubles every 2.7 nodes, ejecting the marginal player each turn. TSMC held 69.9% of 2025 foundry revenue ($122.54B; Samsung 7.2%) per TrendForce, reported March 2026."}, {"n": 5, "prompt": "State the wavelength logic behind EUV.", "options": {"A": "EUV uses 193 nm light versus DUV's 13.5 nm — roughly 14x longer — which improves throughput", "B": "EUV prints with 13.5 nm light versus DUV immersion's 193 nm — roughly 14x shorter — achieving about 13 nm resolution and sub-20 nm structures that DUV physically cannot reach", "C": "EUV and DUV use the same wavelength; EUV simply exposes each wafer more times", "D": "EUV uses electron beams rather than light, which is why no lens can focus it"}, "answer": "B", "explanation": "Shorter wavelength permits smaller printed features, and 13.5 nm is what keeps 5nm/3nm-class AI silicon manufacturable. Note that EUV did not replace DUV — advanced immersion DUV systems remain workhorses alongside it."}, {"n": 6, "prompt": "How does an EUV machine make and steer its light?", "options": {"A": "A CO₂ laser double-pulses molten tin droplets about 25 microns wide travelling at 70 m/s, 50,000 per second — a pre-pulse flattens each droplet, a main pulse vaporises it into plasma at nearly 220,000 °C — and because every material including air absorbs EUV, the light is steered by multilayer curved mirrors in a vacuum", "B": "A mercury-vapour lamp emits 13.5 nm light, focused through quartz lenses in ordinary air", "C": "A continuous radioactive source emits EUV, and the machine simply shutters it", "D": "The wafer itself emits EUV when heated, so no external light source is required"}, "answer": "A", "explanation": "Production-grade extreme physics, 50,000 times a second, continuously: tin plasma at nearly 40x the sun's surface temperature, with ZEISS SMT multilayer mirrors because no lens can pass EUV. The difficulty is precisely why only one company commercialised it."}, {"n": 7, "prompt": "What happened in 2012 between ASML and its largest customers?", "options": {"A": "ASML was nationalised by the Dutch government, which funded EUV directly", "B": "ASML acquired ZEISS and TRUMPF to internalise its supply chain", "C": "ASML's three largest customers — Intel, TSMC and Samsung — committed an aggregate €1.38 billion in R&D funding and bought an aggregate 23% minority equity stake for €3.85 billion in cash, effectively anchor-funding their own supplier's EUV development", "D": "ASML sold its EUV rights to Canon and Nikon, which financed the final development stage"}, "answer": "C", "explanation": "Customers anchor-funding their own supplier's R&D for equity — the implied whole-company value was ~€16.7B (€3.85B ÷ 23%), against FY2024 net income alone of €7.6B. It is the template for the circular financing structures the course meets again later."}, {"n": 8, "prompt": "Which figures describe ASML's FY2024?", "options": {"A": "440 EUV systems recognised, with all revenue from a single customer", "B": "44 EUV systems recognised, with no customer exceeding 5% of net sales", "C": "4 EUV systems recognised, at roughly €8.3 billion each", "D": "44 EUV systems recognised (53 in 2023), EUV revenue of about €8.3 billion out of €28.3 billion total net sales, and four customers each above 10% of sales totalling 53.8% — a monopoly facing an oligopsony"}, "answer": "D", "explanation": "Also carry the pricing: ~€160–180M per Low-NA machine and ~$380–400M for High-NA (early 2025). The unit-count drop from 53 (2023) to 44 (2024) is not automatically weaker demand — recognition timing, High-NA mix, and single-customer digestion cycles all move it."}, {"n": 9, "prompt": "A colleague says China's EUV machines were cut off by the 2019 export ban. What is the accurate account?", "options": {"A": "China operated EUV machines until 2019, when the Netherlands banned them and the installed tools were removed", "B": "The Dutch government approved an EUV export licence in 2018 and, under US pressure, declined to renew it in 2019 *before any machine had shipped* — ASML has never shipped an EUV machine to China — and the perimeter later widened to advanced immersion DUV (the NXT:2000i and subsequent systems from June 2023, extended to the 1970i and 1980i effective September 7, 2024)", "C": "EUV has never been restricted; only DUV systems are controlled", "D": "The US licences ASML's exports directly, because ASML is a US company"}, "answer": "B", "explanation": "The lever was pulled at the licence-renewal desk, not the loading dock: nothing was ever clawed back because nothing was ever delivered. Note the direction the perimeter has moved since — inward, over progressively older tools."}, {"n": 10, "prompt": "What physically is HBM?", "options": {"A": "DRAM dies stacked vertically and interconnected by through-silicon vias (TSVs), placed side by side with the GPU on a silicon interposer — the innovation is architecture and packaging, not a new memory cell", "B": "A new type of memory cell, unrelated to DRAM, invented specifically for AI workloads", "C": "SRAM cache moved off the processor die and out onto the circuit board", "D": "Non-volatile flash storage stacked directly on top of the GPU logic die"}, "answer": "A", "explanation": "HBM *is* DRAM — stacked with TSVs and relocated millimetres from the GPU. Keep the three straight: SRAM is cache, DRAM is main memory, HBM is stacked DRAM beside the processor."}, {"n": 11, "prompt": "State the memory wall.", "options": {"A": "Memory bandwidth grew faster than compute, leaving chips bandwidth-rich and math-poor", "B": "Compute and memory bandwidth grew at identical rates, so the \"wall\" is a marketing term", "C": "Over roughly two decades compute grew about twice as fast as the bandwidth to feed it — peak server FLOPS at 3.0x per two years versus DRAM bandwidth at 1.6x (Gholami et al., March 2024), and FLOP/s doubling every ~2.3 years versus bandwidth every ~4.1 years across 47 ML accelerators (Epoch AI) — making memory, not compute, the primary bottleneck, especially in serving", "D": "Capacity, not bandwidth, is the constraint, and the two grow at identical rates"}, "answer": "C", "explanation": "Two datasets, two methodologies, one convergent conclusion: compute grew roughly 2x faster than the bandwidth to feed it. Use Gholami's rates for the long-run server story and Epoch's for accelerator-specific claims, and never mix the two in one calculation."}, {"n": 12, "prompt": "Samsung held about 32.6% of one memory market and 17% of another in 2025. How is that reconciled?", "options": {"A": "One of the two figures must be an error, since a company cannot hold two different shares", "B": "Different denominators: about 32.6% of *total DRAM revenue* (TrendForce, 3Q25) versus 17% of *HBM bit shipments* (Counterpoint, Q2 2025) — different product scope and different metric, both correct", "C": "The 32.6% is a 2026 projection and the 17% is historical", "D": "The 17% counts only Samsung's Chinese production"}, "answer": "B", "explanation": "Classic denominator error to avoid: \"Samsung is #1 in memory\" and \"Samsung is #3 in HBM\" can both be true on the same day. Always ask which product scope, which metric, whose count, as of when."}, {"n": 13, "prompt": "Which statement about HBM's economics and supply is best supported by the notes?", "options": {"A": "HBM is about 5% of accelerator manufacturing cost, per published vendor bills of materials", "B": "SK hynix's October 2025 statement that its entire 2026 capacity was sold out proves the shortage is permanent and structural", "C": "HBM is roughly 35–47% of an AI accelerator's total manufacturing cost (~40% per The Next Platform) — but those are analyst cost models, not company disclosures, since no vendor publishes its bill of materials", "D": "HBM fell from 21% to 8% of total DRAM market value between 2023 and 2024"}, "answer": "C", "explanation": "The robust claim is that HBM is the largest single cost component of an AI accelerator; any point estimate inside 35–47% is triangulated, not audited. Option D reverses the real direction — HBM rose from 8% of DRAM market value in 2023 to a projected 21% in 2024 (TrendForce, July 2024)."}, {"n": 14, "prompt": "What is CoWoS, and why does HBM require it?", "options": {"A": "A lithography technique that prints memory and logic in a single exposure", "B": "A cooling technology sitting between the GPU package and its heat sink", "C": "A true-3D package in which the GPU logic die is stacked directly on top of the HBM dies", "D": "TSMC's 2.5D packaging: a package substrate carries I/O down to the board, a passive silicon interposer above it provides ultra-dense wiring, and the GPU logic die(s) and HBM stacks sit side by side on that interposer — required because HBM's high pad count and short-trace needs exceed what a PCB or standard substrate can route"}, "answer": "D", "explanation": "\"2.5D\" because the dies sit side by side on a flat plane while the HBM stacks themselves are 3D towers. The proximity is electrically forced by HBM's pad count, which is the entire reason this packaging class exists."}, {"n": 15, "prompt": "State the reticle limit and the economic case for chiplets below it.", "options": {"A": "The reticle limit is about 26 × 33 mm (~858 mm²) of single-exposure die area; below it chiplets still win because defect probability rises with die area — chiplet yields can exceed 50% while comparable-area monolithic designs fall below 30% — and because chiplets let analog, RF and I/O stay on older, cheaper nodes", "B": "The reticle limit is about 26 × 33 cm, and below it chiplets are always more expensive than monolithic dies", "C": "There is no physical limit on die size; chiplets are purely a marketing construct", "D": "Chiplets exist only because HBM cannot be fabricated on the same wafer as logic"}, "answer": "A", "explanation": "At the limit chiplets are physics — Blackwell's two dies were the only path to 208B transistors. Below it they are a cost arbitrage: same wafer spend, roughly 1.7x more usable silicon, plus the freedom to buy leading-edge wafers only for the compute core."}, {"n": 16, "prompt": "Reconstruct the 2023 accelerator bottleneck with its dated numbers.", "options": {"A": "TSMC's chairman said in 2023 that fab wafer capacity, not packaging, was the constraint", "B": "In September 2023 TSMC chairman Mark Liu said the shortage was of CoWoS capacity rather than of AI chips, with TSMC able to support only about 80% of customer demand and easing expected in roughly 1.5 years; capacity was ~15,000–16,000 wafers per month in 2023, and NVIDIA had secured almost 60% of it (TrendForce, November 2023)", "C": "The 2023 shortage was caused by a shortage of EUV machines at ASML", "D": "The 2023 shortage cleared within a quarter once volume shifted to Samsung's I-Cube"}, "answer": "B", "explanation": "Liu on the record, September 2023: \"It's not the shortage of AI chips. It's the shortage of our CoWoS capacity.\" Independent analyses (SemiAnalysis 2023, Epoch AI 2024) agreed that packaging and HBM — not leading-edge wafer fabrication — were binding."}, {"n": 17, "prompt": "What happened to CoWoS capacity after 2023, and what is the lesson?", "options": {"A": "Capacity was flat from 2023 to 2026, which is why the shortage persisted", "B": "Capacity doubled once in 2024 and then stopped growing, and the constraint disappeared entirely", "C": "Capacity roughly doubled each year — ~15–16k wafers/month (2023) → 35–40k (2024) → 75–80k planned (2025) → 100–150k projected (2026) — yet demand still exceeded supply, and as packaging eased the binding constraint migrated downstream to HBM and power", "D": "Capacity grew, but competitors (Intel EMIB, Samsung I-Cube) absorbed most of the overflow, which is what cleared the bottleneck"}, "answer": "C", "explanation": "Supply quintupled in two years and still trailed demand, which is the quantitative core of the supercycle case for this layer. But the load-bearing pattern is *migration*: a thesis riding one bottleneck has a built-in expiry date, and Liu stated his (~1.5 years) in advance."}, {"n": 18, "prompt": "Taiwan/TSMC concentration is quoted as 69.9%, ~92%, and ~64%. What explains the spread?", "options": {"A": "All credible sources agree on a single figure of 90%; the others are typos", "B": "The ~64% figure is simply an error and should be discarded", "C": "The figures measure the same thing in different currencies", "D": "They use different denominators: 69.9% is TSMC's share of global *foundry revenue* in FY2025 (TrendForce, March 2026); ~92% is Taiwan's share of the world's *most advanced sub-10nm logic* (Rhodium, December 2022); ~64% is TSMC's share of *advanced-logic wafer capacity* when Samsung's 7nm and Intel's 10nm are counted as comparable (TechInsights, March 2024)"}, "answer": "D", "explanation": "Deploy by question: for AI-supply risk use the revenue and narrow leading-edge bases, since 3nm and 5nm alone were 63% of TSMC's 4Q25 wafer revenue; for total advanced capacity or re-shoring arithmetic, use ~64% and credit Samsung's and Intel's physical wafers."}, {"n": 19, "prompt": "How should the institutional interruption estimates be read?", "options": {"A": "Bloomberg Economics (January 2024) modelled a war at roughly $10 trillion, about 10% of global GDP, with a blockade up to ~5% of global GDP in year one; Rhodium Group (December 2022) put well over $2 trillion of activity at risk in a blockade before international responses or second-order effects, explicitly calling it a floor — both are severity-if scenario analyses, not probability estimates", "B": "Both institutions put the annual probability of a blockade at about 10%", "C": "Rhodium's $2 trillion and Bloomberg's ~5%-of-GDP figures contradict each other, so neither is usable", "D": "They are point forecasts of what will happen, published with confidence intervals"}, "answer": "A", "explanation": "The gap between the two is methodology, not disagreement: Rhodium counts direct first-order exposure and stops, Bloomberg models the full macro shock. Both carry vintages, and TSMC's AI dependence has grown since — so treat them as ageing upward."}, {"n": 20, "prompt": "Why does TSMC's $265 billion US commitment (July 2026) not eliminate the tail risk?", "options": {"A": "It does eliminate it — Arizona now runs TSMC's most advanced node", "B": "It buys trailing-edge redundancy only: Taiwan's N-2 rule (NSTC, December 2025) permits only technology two generations behind the domestic frontier to go abroad, so Arizona runs 4nm today with 3nm targeted for 2H2027 while Taiwan ramps 2nm — and US construction runs 4–5x Taiwan's cost, with gross-margin dilution of 2–3 points initially, widening to 3–4 later", "C": "It fails because the Arizona fab could not match Taiwan's yields", "D": "It is irrelevant because TSMC's only overseas fabs are in Japan and Germany"}, "answer": "B", "explanation": "Cheap insurance, wrong peril: a few billion a year of margin against $2–10T scenarios looks like a bargain until you notice the policy legally excludes the frontier. Keep the three cost figures distinct — construction 4–5x, production +20–50%, margin dilution 2–4 points."}, {"n": 21, "prompt": "How should the silicon-shield debate be characterised?", "options": {"A": "Settled: the silicon shield demonstrably deters invasion", "B": "Settled: Mark Liu proved seizing the fabs is impossible", "C": "Genuinely contested, with three verified positions — the silicon shield (traced to Craig Addison: global dependence makes US intervention likely and thereby deters attack), Mark Liu's futility argument (CNN, July 2022: \"Nobody can control TSMC by force,\" because occupied fabs would be non-operable without real-time links to Europe, Japan and the US), and the Broken Nest proposal (US Army War College *Parameters*, 2021: deter by credibly threatening the fabs' destruction) — all agreeing the fabs are the strategic centre of gravity while disagreeing on the mechanism", "D": "It is a debate about the severity of an interruption rather than about its probability"}, "answer": "C", "explanation": "None of the three is settled, and this course's verified base contains no resolution. Option D inverts the split: the deterrence debate is about *probability*, while the Bloomberg/Rhodium estimates price *severity* — and only severity is priced here."}, {"n": 22, "prompt": "What is the structure of the semiconductor supply chain?", "options": {"A": "Three production stages — design, wafer fabrication, and assembly/test/packaging (ATP) — fed by four upstream input industries: EDA software, core IP, manufacturing equipment, and materials", "B": "Two stages — design and manufacturing — fed by three inputs: software, equipment, and labour", "C": "Four stages — design, lithography, packaging, and distribution — with no upstream input industries", "D": "Three stages — mining, refining, and fabrication — fed by EDA software alone"}, "answer": "A", "explanation": "Design is US-led; advanced fabrication is led by Taiwan and South Korea; ATP is Indo-Pacific (>95% of facilities). Producing one chip takes 1,000+ process steps with work-in-progress crossing borders 70 or more times."}, {"n": 23, "prompt": "What is the EDA paradox, and what are its numbers?", "options": {"A": "EDA is about 1.5% of the market by share and therefore carries little leverage", "B": "The ~70% and 96% figures are the same measurement in two different years and should be averaged", "C": "EDA is dominated by Japanese firms, mirroring the materials segment", "D": "Three firms — Synopsys, Cadence, and Mentor Graphics/Siemens EDA — held roughly 70% of the EDA market as of 2021, US-headquartered firms held 96% in 2019 on a headquarters basis, and US firms are the exclusive providers of full-spectrum leading-edge design software — all on a segment worth only about 1.5% of supply-chain value-add"}, "answer": "D", "explanation": "Two different measurements, two different years and bases — never blended. The qualitative claim is the strongest of the three and the one policy hangs on: value-add share measures where revenue accrues, not where control sits."}, {"n": 24, "prompt": "Which of the following is NOT supported by the course notes?", "options": {"A": "Five firms controlled roughly 95% of the silicon-wafer market by 2020, led by Japan's Shin-Etsu at 29.4%", "B": "Japanese producers held about 91% of the global photoresist market as of late 2025", "C": "The SIA/BCG analysis (April 2021) counted more than 50 points in the chain where a single region holds over 65% of global market share", "D": "At least one major economy — the United States — has achieved a full-stack domestic semiconductor supply chain"}, "answer": "D", "explanation": "No country has a full-stack domestic chain: despite consistent efforts no government has achieved self-sufficiency, and even the US lacks domestic leaders in photolithography equipment and leading-edge pure-play foundry manufacturing. A, B and C are all verified."}, {"n": 25, "prompt": "What did the 2021 chip shortage reveal about the chain?", "options": {"A": "Inventories rose from 5 to 40 days as buyers hoarded, while demand fell 17%", "B": "Median buyer inventory of key semiconductors fell from 40 days of supply (2019) to under 5 days (2021), median demand ran up to 17% above 2019, wafer production capacity was the primary bottleneck, and the shortage cost an estimated $240 billion of US GDP and 7.7 million cars in 2021", "C": "The binding constraint was advanced packaging, and the main victim was the AI accelerator market", "D": "Demand doubled, which is why even a well-buffered chain broke"}, "answer": "B", "explanation": "A demand move of at most 17% produced an eight-fold inventory drawdown and an eleven-figure GDP loss, because the binding link cannot flex faster than a fab construction cycle. Note the counterfactual discipline: 2021 was a *demand* shock hitting mostly mature nodes, not a supply interruption at the leading edge."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
</html>
