<style>
  :root { --bg:#0b1020; --panel:#0d1b2a; --line:#2c3f5e; --ink:#e8ecf4; --mut:#a2b3cd;
          --accent:#c9a227; --accent-hi:#eccd6b; --good:#7fae8c; --bad:#e5687a; --warn:#d8a13a; --void:#070b14; }
  * { box-sizing:border-box; }
  body { margin:0; font:15.5px/1.6 Spectral, Georgia, serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .top { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:rgba(15,20,25,.94); backdrop-filter:blur(6px); z-index:10; }
  .top a.home { color:var(--mut); text-decoration:none; font-size:13px; }
  .top a.home:hover { color:var(--accent); }
  .top .title { font-weight:700; flex:1; font-size:15px; }
  .top .score { font-size:13px; color:var(--mut); }
  .wrap { max-width:820px; margin:0 auto; padding:26px 22px 90px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .intro { color:var(--mut); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:16px 0 26px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  .q.unanswered.flagged { border-color:var(--warn); }
  .qh { font-weight:600; margin-bottom:12px; }
  .qh .n { color:var(--accent); margin-right:8px; }
  .opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
         margin:7px 0; cursor:pointer; transition:background .12s,border-color .12s; }
  .opt:hover { background:#10161e; }
  .opt.sel { border-color:var(--accent); background:rgba(79,156,249,.10); }
  .opt .let { font-weight:700; color:var(--mut); flex:none; width:20px; }
  .opt.sel .let { color:var(--accent); }
  .graded .opt { cursor:default; }
  .graded .opt.correct { border-color:var(--good); background:rgba(63,185,80,.12); }
  .graded .opt.correct .let { color:var(--good); }
  .graded .opt.wrongpick { border-color:var(--bad); background:rgba(248,81,73,.12); }
  .graded .opt.wrongpick .let { color:var(--bad); }
  .expl { display:none; margin-top:12px; padding:11px 14px; border-left:1px solid var(--accent);
          background:var(--void); border-radius:0 4px 4px 0; color:#c9d4e0; font-size:14px; }
  .graded .expl { display:block; }
  .expl.ok { border-left-color:var(--good); }
  .expl.no { border-left-color:var(--bad); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(15,20,25,.97); border-top:1px solid var(--line);
         padding:12px 22px; display:flex; align-items:center; gap:16px; }
  .bar .status { flex:1; color:var(--mut); font-size:13.5px; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:9px; padding:11px 20px; }
  #submit { background:linear-gradient(180deg,var(--accent-hi),var(--accent)); color:#241c04; }
  #submit:disabled { background:#39414d; color:#8b98a8; cursor:not-allowed; }
  #retry { background:var(--panel); color:var(--ink); border:1px solid var(--line); display:none; }
  .result { display:none; text-align:center; padding:22px; border-radius:14px; margin:8px 0 22px; font-size:16px; }
  .result.pass { background:rgba(63,185,80,.12); border:1px solid rgba(63,185,80,.4); }
  .result.fail { background:rgba(210,153,34,.12); border:1px solid rgba(210,153,34,.4); }
  .result .big { font-size:34px; font-weight:800; display:block; margin-bottom:4px; }
  /* --- Observatory retheme --- */
  h1, .top .title, .result .big { font-family:Cinzel, serif; letter-spacing:.01em; }
  .qh .n, .top .score, .top a.home, .opt .let, .bar .status { font-family:"JetBrains Mono", monospace; }
  .opt { font-family:Spectral, serif; }
  button { font-family:"JetBrains Mono", monospace; text-transform:uppercase; letter-spacing:.07em; font-size:12.5px; border-radius:3px; }
  .q, .intro, .result { border-radius:4px; }
  .top { background:rgba(11,16,32,.94); }
  .bar { background:rgba(11,16,32,.97); }
  ::selection { background:rgba(201,162,39,.28); color:#fff; }
  ::-webkit-scrollbar { width:12px; height:12px; }
  ::-webkit-scrollbar-track { background:var(--void); }
  ::-webkit-scrollbar-thumb { background:#1e2c46; border:3px solid var(--void); border-radius:99px; }
  html { scrollbar-color:#1e2c46 var(--void); scrollbar-width:thin; }
  :focus-visible { outline:2px solid var(--accent-hi); outline-offset:2px; }
</style>

<div id="pe-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0b1020;display:flex;align-items:center;justify-content:center;font-family:Spectral,Georgia,serif">
  <div style="position:relative;background:#0d1b2a;border:1px solid #2c3f5e;border-radius:4px;padding:34px;max-width:360px;width:88%;text-align:center;color:#e8ecf4;box-shadow:inset 0 1px 0 rgba(233,236,244,.06)">
    <div style="font-family:Cinzel,serif;font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:8px">The Knowledge Engine</div>
    <div style="color:#a2b3cd;font-size:13.5px;margin-bottom:20px">Enter your access code to continue.</div>
    <input id="pe-gate-input" type="password" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:3px;border:1px solid #2c3f5e;background:#070b14;color:#e8ecf4;font-size:15px;outline:none;font-family:Spectral,serif">
    <div id="pe-gate-err" style="color:#e5687a;font-size:12.5px;height:15px;margin:9px 0 3px"></div>
    <button id="pe-gate-btn" style="width:100%;padding:12px;border:0;border-radius:3px;background-color:#c9a227;background-image:linear-gradient(180deg,#eccd6b,#c9a227);color:#241c04;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;cursor:pointer">Enter</button>
  </div>
</div>
<script>
(function(){
  var HASH="2ab47ce2424d6043168f930c79e3931f57f9e86ad33a8e35c2e9b6d3f1444924";
  var g=document.getElementById('pe-gate');
  if(localStorage.getItem('pe_demo_ok')==='1'){ g.remove(); return; }
  document.documentElement.style.overflow='hidden';
  var inp=document.getElementById('pe-gate-input'), err=document.getElementById('pe-gate-err');
  try{ inp.focus(); }catch(e){}
  async function sha(s){ var b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join(''); }
  async function submit(){
    var v=inp.value; if(!v) return;
    var h; try{ h=await sha(v); }catch(e){ err.textContent='Browser too old'; return; }
    if(h===HASH){ localStorage.setItem('pe_demo_ok','1'); localStorage.setItem('pe_demo_code',v); document.documentElement.style.overflow=''; g.remove(); }
    else { err.textContent='Incorrect code'; inp.value=''; inp.focus(); }
  }
  document.getElementById('pe-gate-btn').onclick=submit;
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
})();
</script>

<script>
const DATA = {"phase": "5", "title": "Phase 5 Test — The Players", "pass_mark": 20, "questions": [{"n": 1, "prompt": "A research note dated March 2026 states: \"NVIDIA's data-center business did $115.2 billion in 2025.\" Audit that sentence.", "options": {"A": "It is correct — $115.2B was NVIDIA's fiscal 2025 Data Center revenue, and NVIDIA reports on a calendar basis", "B": "It understates the figure: Data Center revenue in fiscal 2025 was $193.7 billion", "C": "It is off by a year: $115.2B is fiscal 2025, which ended in late January 2025 and therefore covers roughly calendar 2024 — the fiscal year covering roughly calendar 2025 is FY2026, at $193.7 billion, up 68%", "D": "It is off by a year in the other direction: $115.2B is fiscal 2026, which covers roughly calendar 2026"}, "answer": "C", "explanation": "NVIDIA's fiscal year ends in late January and is numbered a year ahead, so FY2026 ended January 25, 2026 and covers roughly calendar 2025. The mistranslation moves the analyst's \"2025\" figure by $78.5B — the size of the error from one wrong fiscal label."}, {"n": 2, "prompt": "What is the CUDA moat actually made of?", "options": {"A": "A layered platform of accumulated, optimized GPU libraries — over 900 CUDA-X libraries by NVIDIA's GTC 2025 count — launched in 2006 (SDK to developers 2007) and rewritten by NVIDIA for each hardware generation, so leaving means abandoning a maintained ecosystem rather than porting code", "B": "A patent portfolio that legally prevents rivals from executing the same matrix operations", "C": "The Blackwell die itself — no rival can match 208 billion transistors across two reticle-limited dies", "D": "The Mellanox acquisition of 2020, which locked buyers into InfiniBand as the only usable cluster fabric"}, "answer": "A", "explanation": "The moat is switching-cost economics, not silicon: 900+ CUDA-X libraries (GTC 2025 count) that NVIDIA rewrites at its own expense for every hardware generation, so customer code carries forward free. Leaving means taking on that maintenance burden yourself on a less-travelled stack."}, {"n": 3, "prompt": "NVIDIA's Q2 FY2026 10-Q (quarter ended July 27, 2025) shows two direct customers at 23% and 16% of total revenue and two indirect customers estimated at 10%+ each. A colleague concludes: \"so the top four are about 59% of revenue, and we know who they are.\" Give both corrections.", "options": {"A": "The percentages are of Data Center revenue rather than total revenue, and the filing names all four counterparties", "B": "The 23% and 16% are the *indirect* figures, so true direct concentration is higher, and Customers A and B are named in a later footnote", "C": "The figures cannot be summed because they come from different quarters, and the identities appear in the following year's 10-K", "D": "The indirect customers purchase primarily *through* Direct Customers A and B, so their shares sit inside the 23% and 16% and summing double-counts; and the filing anonymizes every party, so the identities are inference beyond the disclosure"}, "answer": "D", "explanation": "The indirect customers \"primarily purchase our products through Direct Customers A and B,\" so the disclosures overlap by construction and 23 + 16 + 10 + 10 is a double-count. What the filing does establish: two counterparties at 39% of revenue, roughly double the prior year's top-of-table concentration (14/11/11/10). What it does not establish: who they are."}, {"n": 4, "prompt": "How should the durability of the CUDA moat be held?", "options": {"A": "As settled in NVIDIA's favour — the December 2024 AMD MI300X benchmark proved the moat cannot be crossed", "B": "As genuinely open: Patel/SemiAnalysis argued in January 2023 that PyTorch 2.0 and OpenAI's Triton erode CUDA lock-in (a mechanism prediction), while the same shop concluded in December 2024, after five months of independent MI300X benchmarking, that \"the CUDA moat has yet to be crossed by AMD\" (a later measurement) — compatible claims, question unresolved", "C": "As settled against NVIDIA — the January 2023 analysis established that the default ML software stack would no longer be CUDA", "D": "As resolved by the FY2026 gross-margin fall to 71.1%, which is direct evidence that competitors extracted price concessions"}, "answer": "B", "explanation": "A mechanism prediction (Jan 2023) and a later empirical measurement (Dec 2024) from the same publisher — compatible, because the moat was never the API surface but the maintained library ecosystem beneath it. Treat \"CUDA is unassailable\" and \"CUDA is already commoditized\" as equally unsupported. (Option D fails separately: FY26's 71.1% carries a $4.5B H20 export charge and a Blackwell system-mix effect, with quarterly margin back at 75.0% by Q4 FY26.)"}, {"n": 5, "prompt": "Which set of hyperscaler capex figures matches the tape, with the correct bases?", "options": {"A": "Microsoft calendar 2025 $115.9B; Alphabet FY2026 $91.4B; Amazon FY2025 $131.8B; Oracle calendar 2026 $55.7B", "B": "Microsoft FY2026 $64.6B; Alphabet 2025 $52.5B; Amazon 2025 $83.0B; Meta 2026 guide $27B", "C": "Microsoft FY2026 $115.9B; Alphabet 2025 $91.4B with a 2026 guide of $125–145B; Amazon 2025 $131.8B with a 2026 plan of ~$175–185B", "D": "Microsoft FY2026 $115.9B on a June fiscal year (cash additions to PP&E, $35.8B in the June 2026 quarter alone); Alphabet calendar 2025 $91.4B with a 2026 guide of $175–185B; Amazon calendar 2025 $131.8B with a 2026 plan of ~$200B; Oracle FY2026 $55.7B on a May fiscal year"}, "answer": "D", "explanation": "Three of the five report on calendar years, Microsoft's fiscal year ends June 30 and Oracle's May 31. Note also the guide-vs-actual hygiene: Microsoft's $115.9B and Oracle's $55.7B are reported actuals; Alphabet's $175–185B and Amazon's ~$200B are Feb 2026 forward guidance, and Meta's $125–145B is itself a raise."}, {"n": 6, "prompt": "Microsoft's commercial RPO is $678 billion and Oracle's is $638 billion. Why are these not the same asset?", "options": {"A": "Microsoft's is broad commercial-cloud demand up 84% alongside $100B+ of *current* Azure revenue growing 43%; Oracle's grew 363% mostly on a handful of large AI contracts, converts only 12% within 12 months, and includes $75B of prepaid or customer-supplied-hardware portions", "B": "Microsoft's RPO is audited under GAAP while Oracle's is a non-GAAP bookings figure with no disclosure standard", "C": "Oracle's is the higher-quality book because it is fully prepaid, whereas Microsoft's depends on renewals", "D": "They are the same asset — both are contracted future revenue, and the only difference is the fiscal-year basis"}, "answer": "A", "explanation": "RPO quality is the differentiator, not the level. Microsoft's sits alongside $100B+ of current Azure revenue; Oracle booked $638B of RPO in a year it recognized $18.1B of IaaS revenue and burned $23.7B of free cash flow, with delivery risk visible in Stargate Abilene at 42% of capacity as of June 2026."}, {"n": 7, "prompt": "Why is Meta called the purest exposure to the capex thesis, and what shows it de-risking that position financially?", "options": {"A": "Because it has the largest capex line of the five; de-risked through its $8B Anthropic investment", "B": "Because it rents more third-party capacity than the others; de-risked through Trainium and TPU contracts", "C": "Because it reports no cloud segment at all — only Family of Apps and Reality Labs, on $200.97B of 2025 revenue — so its $125–145B 2026 guide has no external rent roll to amortize it; de-risked via the $27B Blue Owl joint venture (Blue Owl 80% / Meta 20%) financing the Hyperion campus with $27B of Pimco-issued investment-grade bonds secured on the project, plus $29.9B of net long-term debt issued in Q4 2025", "D": "Because its open-weight Llama models earn licensing revenue the others lack; de-risked by selling capacity to OpenAI"}, "answer": "C", "explanation": "Meta is the anomaly with no cloud segment — no tenant to share the loss if the thesis fails, and the whole upside if it works. Its guidance raise drew the sharpest sell-off (shares down as much as 10% on April 30, 2026), and its CFO flagged that cost-efficient external financing may lead Meta to eventually maintain a positive net debt balance."}, {"n": 8, "prompt": "Oracle's fiscal 2026 (ended May 31, 2026) showed $32.0B of operating cash flow against $55.7B of capex. Compute free cash flow and name how the gap was bridged.", "options": {"A": "+$23.7B, with the surplus returned through buybacks", "B": "−$23.7B, bridged by $43B of debt and $5B of equity raised during the year, with roughly $40B more financing expected in FY2027 against ~$70B of net capex", "C": "−$23.7B, bridged entirely by the $75B of customer prepayments sitting inside its RPO", "D": "−$85B, matching the sequential increase in RPO"}, "answer": "B", "explanation": "$32.0B − $55.7B ≈ −$23.7B. Oracle is the leveraged-challenger profile: spending borrowed money today against a backlog that converts slowly (12% within 12 months). Capex without its funding source is half a statement."}, {"n": 9, "prompt": "Which statement about OpenAI's audited 2025 financials (obtained by Ed Zitron, verified by the Financial Times, reported August 2026) is correct?", "options": {"A": "Revenue of $24B, an operating loss of $14B, and $6.047B paid to Microsoft", "B": "Revenue of $13.07B against a $38.5B operating loss, all of it cash burn", "C": "Revenue of $3.7B, up 3.5x, on $34B of total costs, with no vendor payments disclosed", "D": "Revenue of $13.07B (up from $3.7B in 2024) against $34B of total costs including $19.18B of R&D — a $20.92B operating loss — with $17.2B paid to Microsoft alone, roughly 132% of revenue; the headline $38.5B net loss includes a $41.55B *non-cash* fair-value charge on convertibles and warrants from the for-profit conversion, so the operating loss is the economically meaningful figure"}, "answer": "D", "explanation": "The one year of GAAP truth on any lab. The 132% ratio — more than all revenue paid to a single compute vendor — is the course thesis in one number. And the $38.5B headline must be stripped of the $41.55B non-cash conversion charge; projected *cash* burn for 2026 was $14B (The Information, Nov 2025)."}, {"n": 10, "prompt": "A colleague writes: \"OpenAI ended 2025 at a ~$24 billion revenue run rate.\" What two corrections do you make?", "options": {"A": "The run rate is right but must be halved, because it is quoted gross of Microsoft's revenue share", "B": "The figure is $47B rather than $24B, and it comes from OpenAI's audited accounts", "C": "Dating — the $2B/month (~$24B annualized) figure is OpenAI's self-report as of **March 31, 2026**, not end-2025, and audited FY2025 revenue was $13.07B; and basis — it is an unaudited company self-report from a funding announcement, not a GAAP figure", "D": "There is no error — annualizing a single month is the standard GAAP presentation for hypergrowth companies"}, "answer": "C", "explanation": "Annualizing one month of a hypergrowth company forward and then backdating it onto the prior fiscal year is the single most common error in AI market sizing. Both numbers are true; they measure different periods on different bases, fifteen months apart."}, {"n": 11, "prompt": "Rank these three valuations by evidentiary strength and say what each actually is: Anthropic $965B, xAI $250B, and OpenAI's August 2026 $852B print.", "options": {"A": "Strongest is Anthropic's $965B — a primary-round mark with $65B of new money at that price (Series H, May 28, 2026), though $15B of it was previously committed hyperscaler capital; middle is OpenAI's August 2026 $852B — a reaffirmation of the March 2026 round mark, set by OpenAI using roughly $7B of its own cash to buy employee shares, with no outside investor pricing it; weakest is xAI's $250B — a value from documents viewed by CNBC in a related-party all-stock SpaceX merger in which no cash changed hands", "B": "xAI's $250B is strongest because a completed merger is a closed transaction; OpenAI's $852B is weakest because it rests on a confidential filing", "C": "All three are liquid market prices established by secondary trading", "D": "OpenAI's $852B is strongest, because the June 2026 confidential IPO filing converts it into a public-market price"}, "answer": "A", "explanation": "All three are marks, none a liquid trade. The August 2026 OpenAI print is the softest of the two big ones because the company set it with its own cash rather than letting an outside tender price it — months after confidentially filing for an IPO in June 2026, which would produce the sector's first true trade."}, {"n": 12, "prompt": "How does the course hold the question of whether frontier-lab economics are sustainable?", "options": {"A": "As settled for the bears: OpenAI's audited $20.92B operating loss ends the argument", "B": "As a live dispute to be held both ways, dated — Cahn/Sequoia (June 2024, \"AI's $600B question\") and Covello/Goldman Sachs (May 2026, \"FOMO has proven a stronger incentive than poor stock performance\") aggregate *sector* capex against *current* revenue, while OpenAI (March 2026) and Anthropic's reported projections (up to $70B of revenue and $17B of positive cash flow in 2028) extrapolate *firm-level* growth rates — with both sides citing numbers that are simultaneously true", "C": "As settled for the bulls: Anthropic's projected 2028 positive cash flow resolves it", "D": "As outside the course's scope, since none of the three labs files with the SEC"}, "answer": "B", "explanation": "Different objects and different extrapolations, not a factual contradiction. By mid-2026 the dispute had moved inside the customer base — Altman said at a June 2026 enterprise event that AI spending had gone \"from an issue that never came up… to all of a sudden, a huge issue\" for some companies, a remark seized on by both camps."}, {"n": 13, "prompt": "At December 31, 2025 CoreWeave reported $5.1B, $60.7B, and $66.8B. Identify each, and state how fast the middle one converts.", "options": {"A": "$5.1B is 2025 revenue (earned, recognized, audited); $60.7B is remaining performance obligations — contracted but unrecognized, up 302% from $15.1B a year earlier; $66.8B is revenue backlog, meaning RPO *plus other committed amounts*. Per the 10-K, 43% of the RPO is expected to convert in the first 24 months (through December 2027), 38% in months 25–48, and the remainder through month 84", "B": "$5.1B is revenue, $60.7B is total debt, and $66.8B is the gross value of the GPU fleet; all of the RPO converts within 24 months", "C": "$5.1B is RPO, $60.7B is backlog, and $66.8B is contracted power value; no conversion schedule is disclosed", "D": "All three are bookings measures computed on different accounting bases, and the 10-K expects 90% conversion by December 2027"}, "answer": "A", "explanation": "Three different claims on the future: earned, contracted-unrecognized, and the broader bookings figure. \"CoreWeave has $66.8B of revenue coming\" packs three confusions into one sentence — committed is not earned, and the two headline bookings numbers are not the same number."}, {"n": 14, "prompt": "Which statement about CoreWeave's debt architecture and its 2025 cash position is correct?", "options": {"A": "The $21.6B of total indebtedness is entirely corporate-level unsecured paper issued by the parent", "B": "The DDTL facilities are sized on remaining performance obligations and secured by a floating charge over the parent's equity", "C": "The debt is unsecured but covenanted to RPO conversion, and 2025 operating cash flow of $4.4B comfortably covered $3.1B of debt service", "D": "The DDTL facilities are sized as a percentage of the depreciable cost of the GPU servers being financed, secured by first-priority pledges of the subsidiary borrowers' equity and substantially all subsidiary assets inside wholly owned SPVs with an unconditional parent guarantee, and some route customer deposits into restricted accounts governed by a cash waterfall (operating expenses, fees, scheduled debt service, then release); 2025 cash dedicated to debt service was $4.4B ($3.4B principal + $1.0B interest) against $3.1B of net operating cash flow — roughly 0.7x coverage"}, "answer": "D", "explanation": "Read it as project finance wearing a tech costume: an ABL borrowing base on depreciating collateral, ring-fenced in SPVs, with the parent living on the residual of a waterfall. Coverage below 1.0x means the model rolls forward on refinancing — and the 10-K's own risk factors concede lenders may institute foreclosure proceedings against their collateral on default."}, {"n": 15, "prompt": "\"NVIDIA is CoreWeave's anchor customer.\" Correct the statement.", "options": {"A": "It is correct as stated — the $6.3B order form makes NVIDIA CoreWeave's largest revenue source", "B": "Wrong: the anchor *customers* are Microsoft (~67% of 2025 revenue), OpenAI, and Meta. NVIDIA is the sole GPU supplier (required by CoreWeave's customer contracts), an MSA counterparty since April 10, 2023, a pre-IPO shareholder that placed a targeted $250M order at $40 on pricing day (March 27, 2025), a contingent buyer of residual unsold capacity through April 13, 2032 under a September 9, 2025 order form with an initial value of $6.3B, and a $2B buyer of Class A stock at $87.20 in January 2026", "C": "Wrong: CoreWeave has no customer concentration at all, since take-or-pay committed contracts were over 98% of 2025 revenue", "D": "Wrong: OpenAI is the anchor customer — it took $350M of CoreWeave stock — and NVIDIA holds no equity position"}, "answer": "B", "explanation": "Sorting the hats is half the analysis of this sector. NVIDIA is supplier, shareholder, IPO anchor, and contingent buyer; the customers are Microsoft, OpenAI, and Meta — and OpenAI is itself both customer and shareholder, having taken $350M of CoreWeave stock in the March 2025 deal. The $6.3B backstop covers *residual unsold capacity*, so it triggers precisely when demand has fallen short."}, {"n": 16, "prompt": "One source quotes data-center rent at \"$10–25 per square foot per year\" and another at \"$100–200+ per kW per month.\" How should an analyst read the apparent conflict?", "options": {"A": "As a genuine source conflict to be logged, since rent can only be quoted on one basis", "B": "As a geographic artifact — the $/SF figures are European and the $/kW figures American", "C": "As no conflict at all: they price different products on different units. $10–25/SF/yr triple-net is **powered shell** (structure, utility power, and fiber access only — Digital Realty's Powered Base Building), while $100–200+/kW/month is finished **wholesale turn-key** space (a powered, cooled data hall — DLR's Turn-Key Flex). A rent figure quoted without its product is meaningless", "D": "As evidence that shells cost more than finished halls once both are converted to common units"}, "answer": "C", "explanation": "Two products, two units, no conflict — the distinction is the finish spectrum itself, and it maps directly onto the landlord's operating-risk gradient. A $/SF quote for a turn-key hall, or a $/kW quote for a shell, should trigger immediate source-checking."}, {"n": 17, "prompt": "Contrast Digital Realty and Equinix as credit books, using their FY2025 figures.", "options": {"A": "Digital Realty is the larger business by revenue ($9.217B vs $6.11B) and the more diversified, because it operates 310 buildings", "B": "Their concentration profiles are effectively identical; the only real difference is geographic footprint", "C": "Equinix is the wholesale archetype with ~51% top-20 concentration, and Digital Realty the retail one with a ~3% largest customer", "D": "Digital Realty is the wholesale archetype — 310 data centers, ~57.6M rentable SF, ~84.7% leased, $6.11B of 2025 revenue (+10.0%), with its top 20 customers at ~51% of annualized recurring revenue, top three at ~26%, and 20 single-tenant buildings; Equinix is the retail archetype — $9.217B of revenue (+5%), 280 data centers across 77 markets in 36 countries, recurring revenues above 90% of total, largest customer ~3% and top 50 ~36%. Wholesale concentrates tenant credit risk; retail colocation diversifies it"}, "answer": "D", "explanation": "Same sector label, opposite underwriting: a wholesale landlord is a corporate-credit fund wearing a REIT wrapper. Note the xScale tell too — even Equinix develops its hyperscale product (23 of 280 facilities at end-2025) through JV arrangements rather than on balance sheet."}, {"n": 18, "prompt": "In the Crusoe–Abilene structure, who signs the lease as the landlord's tenant, and why is the deal built that way?", "options": {"A": "Crusoe *develops* the 1.2 GW Stargate campus; *ownership* sits in a $15B joint venture with Blue Owl Capital and Primary Digital Infrastructure; the campus is *leased to Oracle* on a reported 15-year lease (FT-reported, not filed); and Oracle in turn serves OpenAI. Interposing the investment-grade intermediary makes the lease financeable at infrastructure cost of capital — and means the landlord's credit analysis deliberately stops one link short of the actual demand question", "B": "Blue Owl Capital is both owner and tenant, with Crusoe operating the campus under a management agreement", "C": "Crusoe leases from Oracle and subleases to OpenAI, keeping the credit exposure with the developer", "D": "OpenAI signs directly, because the demand source must carry the paper for it to be financeable"}, "answer": "A", "explanation": "The load-bearing question in every AI-era mega-campus is where the lease attaches. The lease underwrites Oracle's credit while Oracle underwrites OpenAI's demand — either sound risk allocation, or (on the bear reading) a lab's demand risk laundered into net-lease paper through a chain of stronger balance sheets. The pre-leasing evidence (DLR's 769 MW pipeline 64% pre-leased at end-2025; JV projects 100%; 96% of Northern Virginia's 2026 supply committed) is what separates this boom from build-and-hope — but it relocates risk rather than removing it."}, {"n": 19, "prompt": "A colleague writes: \"NVIDIA's share collapsed from 98% in 2023 to 87% in 2024.\" Give the full correction.", "options": {"A": "The figures are right but reversed — 87% was 2023 and 98% was 2024", "B": "The two figures use different denominators and carry different epistemic status. TechInsights' 98% (2023) covers **data-center GPUs only** — units and revenue — and by construction excludes captive accelerators such as TPUs and Trainium; Silicon Analysts' ~87% (published February 21, 2026) is an *estimate* of **AI-accelerator revenue** share at its 2024 peak, a broader denominator that includes custom silicon. The apparent decline is mostly a denominator change, so the two must never be chained", "C": "Both figures are wrong; the only verified share number in the course is the projected ~75% for 2026", "D": "The correction is that share cannot fall while revenue grows, so one of the two figures must be an error"}, "answer": "B", "explanation": "Chaining the two into an \"11-point decline\" manufactures an insight out of a denominator change. And note the twist the Silicon Analysts estimate itself carries: share can fall toward ~75% by 2026 (floor \"likely 65–70%\") while NVIDIA's absolute revenue keeps growing, because the market expands faster than any competitor captures it."}, {"n": 20, "prompt": "What did AMD and OpenAI actually exchange in October 2025?", "options": {"A": "OpenAI invested cash in AMD equity in return for priority allocation of MI450 GPUs", "B": "AMD granted OpenAI employee-style stock options exercisable at market price upon delivery of 6 GW", "C": "AMD issued OpenAI a warrant for up to 160 million AMD shares at a **$0.01 strike** — economically a share grant — alongside a definitive 6 GW multi-year, multi-generation agreement whose first 1 GW of Instinct MI450-series GPUs deploys from 2H2026. Vesting is tranched: the first tranche on delivery of the initial 1 GW, full vesting contingent on 6 GW of cumulative Instinct purchases, plus escalating share-price targets reaching $600 for the final tranche; ~9% of AMD fully exercised, expiring October 5, 2030. The vendor paid its customer in contingent equity", "D": "AMD acquired a ~9% stake in OpenAI in exchange for guaranteeing 6 GW of supply"}, "answer": "C", "explanation": "Direction of value flow is the tell: the vendor paid the customer, not the reverse. \"OpenAI got ~$96B of free AMD stock\" is wrong twice — not free (gated on 6 GW of cumulative purchases) and not $96B (that value exists only at the $600 target, which implies an AMD market cap near $1.07 trillion). Contingent equity compensation whose worst case for existing holders is the case in which they are also richest."}, {"n": 21, "prompt": "Which statement about the hyperscalers' captive silicon and Broadcom's role is correct?", "options": {"A": "None of TPU, Trainium, MTIA, or Maia is sold as a chip — MTIA and Maia serve internal workloads while TPU and Trainium are rented as cloud capacity — so captive volume can grow enormously without appearing in any \"GPU market\" share statistic; and Broadcom fields no merchant accelerator of its own, instead co-developing customers' custom accelerators (OpenAI designs, Broadcom co-develops and deploys 10 GW of racks scaled entirely with Ethernet) and selling the networking that clusters them", "B": "All four hyperscaler chips are sold on the merchant market, which is why NVIDIA's GPU share fell below 80% in 2023", "C": "Broadcom sells a branded merchant accelerator competing directly with Blackwell, backed by a $73B order book for its own chips", "D": "MTIA and Maia are rented as cloud capacity while TPU and Trainium are strictly internal, and Broadcom supplies NVLink to all four programs"}, "answer": "A", "explanation": "Captive-versus-merchant is the load-bearing distinction: you cannot buy a TPU, a Trainium, an MTIA, or a Maia as a chip, so none appears in any GPU-market share statistic. Broadcom monetizes the *decision to challenge* whoever makes it — AI semiconductor revenue up 74% YoY to ~$6.5B in FQ4 2025, guided to $8.2B, on a ~$73B AI backlog blended across XPUs and networking. (Separately, the verified reason AMD's head-on attack kept failing was systems-level: scale-up world size of 8 GPUs on MI355X versus 72 on NVIDIA's GB200 NVL72.)"}, {"n": 22, "prompt": "How does a regulated utility actually profit from data-center demand?", "options": {"A": "By selling more electricity at a markup, which is why load growth raises its margin per MWh", "B": "By capturing capacity-market scarcity prices on its existing fleet, as PJM's 2026/27 auction showed", "C": "By collecting interconnection fees from hyperscalers, which is what lifted Dominion's plan to $50.1B", "D": "By earning a regulator-set allowed return on its **rate base** — its invested capital — so demand growth monetizes as approved capex: Dominion raised its 2025–2029 capital plan to $50.1B from $43.2B (Feb 2025), citing Virginia data-center contracted capacity rising ~19 GW, or 88%, between July and December 2024, and AEP raised its plan 33% to $72B (Oct 2025) on 28 GW of customers under electric service agreements or letters of agreement"}, "answer": "D", "explanation": "A regulated utility does not profit on the electron; it profits by deploying capital into a rate base on which a regulator allows a return. That is why utilities court gigawatt loads their grids can barely serve. The allocation nuance: AEP expects to hold residential increases to ~3.5%/yr by assigning more incremental cost to commercial and industrial customers — a company expectation contingent on rate-case outcomes, not a guarantee."}, {"n": 23, "prompt": "PJM's capacity auction for the 2026/27 delivery year (run July 2025) cleared at $329.17/MW-day. Which reading is correct?", "options": {"A": "It is the per-MWh price data centers pay for electricity consumed in PJM, up 22% year over year", "B": "It is a regulated tariff set by state commissions to allocate data-center costs to commercial and industrial customers", "C": "It is an *availability* payment in $/MW-day for the 2026/27 delivery year — energy actually delivered is priced separately per MWh — and it cleared **at** the FERC-approved cap, up 22% from $269.92, so the uncapped price would have been higher. PJM attributed the more than 5,400 MW of year-over-year forecast peak-load growth largely to data centers, and the $16.1B total auction cost flowed to merchants including Talen, Constellation, NRG, Vistra, and PSEG, on existing fleet, capex-free", "D": "It is the annualized revenue requirement PJM assigns to each new interconnection, permanently capped at that level"}, "answer": "C", "explanation": "Capacity ($/MW-day, availability) is not energy ($/MWh, delivered) — the commercial cousin of the GW-versus-TWh error. Clearing *at* the cap means the constraint was administrative, not economic, and capacity revenue resets annually, which is why Talen's move toward a 2042 contract is a duration trade."}, {"n": 24, "prompt": "GE Vernova reported 100 GW \"under contract\" in Q1 2026. What must an analyst know before treating that as booked demand?", "options": {"A": "Nothing — GW under contract is a firm order book by definition, and the whole 100 GW converts by 2029", "B": "That the 100 GW splits into **44 GW of firm backlog** and **56 GW of slot reservation agreements** — paid options on future manufacturing slots, not firm orders — with roughly 10 GW of open 2029–2030 capacity remaining, and that no verified conversion or cancellation rate exists, so a headline summing the two overstates the firm book", "C": "That the figure is denominated in euros and must be converted before comparison with Siemens Energy's €136B", "D": "That the 100 GW is a company-wide figure spanning turbines, transformers, and grid-scale storage, and so cannot be attributed to data centers"}, "answer": "B", "explanation": "GE Vernova's two-tier disclosure is the announced-versus-contracted ladder relocated to a factory. A backlog is a promise queue: Siemens Energy's 69 GW gas-services backlog shipped 6 GW in a quarter, and the ~80 GW figure (Dec 2025) stretches into 2029 with slots expected sold out through 2030 by end-2026. Never headline a sum across bases — GEV's GW, Siemens's €136B company-wide, and its €51B Grid Technologies book measure different things on different dates."}, {"n": 25, "prompt": "\"FERC killed behind-the-meter co-location.\" How should the Talen–AWS record actually be stated?", "options": {"A": "Correct — FERC's November 2024 order established a generic policy prohibiting co-located load", "B": "Correct in effect — the parties abandoned the site and Talen sold the Cumulus campus back", "C": "Wrong, because FERC approved the expansion 2-1 and rejected the $140M/yr cost-shift claim as a finding of fact", "D": "Wrong on both the holding and the outcome. FERC rejected one *expansion* — the amended interconnection services agreement raising co-located load from 300 MW to 480 MW — by 2-1, on the basis that PJM failed to show the non-conforming provisions were needed, and the up-to-$140M/yr cost-shift figure was AEP and Exelon's advocacy claim, not a FERC finding. The deal returned in June 2025 as a *front-of-the-meter* PPA of up to 1,920 MW through 2042, estimated at ~$18B — four times the blocked load — while the underlying fair-share doctrine remains unsettled, with no verified generic FERC co-location policy in the record"}, "answer": "D", "explanation": "The regulatory wall re-papered the deal rather than killing it: conceding the fair-share objection (the load now pays transmission) unlocked four times the blocked scale. Cite the record precisely — a 2-1 burden-of-proof rejection, an advocacy figure rather than a finding, and a doctrine the course explicitly logs as an unresolved source conflict."}]};
const LS = 'pe-test::'+DATA.phase;
const el = id => document.getElementById(id);
const LETTERS = ['A','B','C','D'];
let picks = {};   // n -> letter
let graded = false;

el('ttitle').textContent = DATA.title;
el('h1').textContent = DATA.title;
el('intro').innerHTML = DATA.questions.length+' multiple-choice questions. Choose one answer per question, then press '+
  '<b>Submit test</b>. You need <b>'+DATA.pass_mark+'/'+DATA.questions.length+'</b> ('+
  Math.round(DATA.pass_mark/DATA.questions.length*100)+'%) to pass. Answers and explanations reveal on submit.';

const qwrap = el('questions');
DATA.questions.forEach(q=>{
  const card = document.createElement('div');
  card.className='q unanswered'; card.id='q'+q.n;
  // Shuffle options so the correct choice isn't positionally predictable
  // (authored keys cluster on one letter). Remap to fresh display letters and
  // record the correct display letter on the question.
  let entries = LETTERS.filter(L=>q.options[L]).map(L=>({orig:L, text:q.options[L]}));
  for(let i=entries.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=entries[i]; entries[i]=entries[j]; entries[j]=t; }
  let opts = '';
  entries.forEach((e,idx)=>{
    const D = LETTERS[idx];
    if(e.orig===q.answer) q._correct = D;
    opts += '<div class="opt" data-n="'+q.n+'" data-l="'+D+'"><span class="let">'+D+'</span><span>'+e.text+'</span></div>';
  });
  card.innerHTML = '<div class="qh"><span class="n">Q'+q.n+'</span>'+q.prompt+'</div>'+opts+
    '<div class="expl" id="expl'+q.n+'"></div>';
  qwrap.appendChild(card);
});

qwrap.addEventListener('click', e=>{
  if(graded) return;
  const opt = e.target.closest('.opt'); if(!opt) return;
  const n = opt.dataset.n, L = opt.dataset.l;
  picks[n] = L;
  const card = el('q'+n);
  card.classList.remove('unanswered');
  card.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.dataset.l===L));
  updateStatus();
});

function updateStatus(){
  const done = Object.keys(picks).length, total = DATA.questions.length;
  el('status').textContent = graded ? '' : done+' of '+total+' answered'+(done<total?'':' — ready to submit');
}
updateStatus();

el('submit').onclick = ()=>{
  const total = DATA.questions.length, done = Object.keys(picks).length;
  if(done<total){
    const miss = DATA.questions.filter(q=>!picks[q.n]);
    if(!confirm(done+' of '+total+' answered. '+(total-done)+' left blank will be marked wrong. Submit anyway?')){
      miss.forEach(q=>{ const c=el('q'+q.n); c.classList.add('flagged'); });
      if(miss[0]) el('q'+miss[0].n).scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
  }
  grade();
};

function grade(){
  graded = true;
  let correct = 0;
  DATA.questions.forEach(q=>{
    const card = el('q'+q.n); card.classList.add('graded');
    const pick = picks[q.n];
    const ans = q._correct;   // display letter of the correct option (post-shuffle)
    if(pick===ans) correct++;
    card.querySelectorAll('.opt').forEach(o=>{
      const L=o.dataset.l;
      if(L===ans) o.classList.add('correct');
      if(L===pick && pick!==ans) o.classList.add('wrongpick');
    });
    const ex = el('expl'+q.n);
    const got = pick===ans;
    ex.className = 'expl '+(got?'ok':'no');
    ex.innerHTML = '<b>'+(got?'Correct':(pick?'Not quite':'No answer'))+' — answer '+ans+'.</b> '+(q.explanation||'');
  });
  const total = DATA.questions.length, pct = Math.round(correct/total*100);
  const pass = correct>=DATA.pass_mark;
  const r = el('result');
  r.className = 'result '+(pass?'pass':'fail'); r.style.display='block';
  r.innerHTML = '<span class="big">'+correct+' / '+total+'  ·  '+pct+'%</span>'+
    (pass ? 'Passed — you cleared this phase. Review any misses, then continue to the next phase.'
          : 'Below the '+DATA.pass_mark+'/'+total+' pass mark. Review the explanations and the linked notes, then retake cold.');
  el('tscore').textContent = correct+'/'+total+' ('+pct+'%)';
  el('status').textContent = 'Scored '+correct+'/'+total+'. Scroll to review explanations.';
  el('submit').disabled = true; el('submit').style.display='none';
  el('retry').style.display='inline-block';
  try {
    const prev = JSON.parse(localStorage.getItem(LS)||'{}');
    localStorage.setItem(LS, JSON.stringify({best: Math.max(correct, prev.best||0), last: correct, total: total}));
  } catch(e){}
  window.scrollTo({top:0, behavior:'smooth'});
}

el('retry').onclick = ()=>{
  graded=false; picks={};
  el('result').style.display='none';
  el('tscore').textContent='';
  el('submit').disabled=false; el('submit').style.display='inline-block';
  el('retry').style.display='none';
  document.querySelectorAll('.q').forEach(c=>{ c.className='q unanswered'; });
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel','correct','wrongpick'));
  updateStatus();
  window.scrollTo({top:0, behavior:'smooth'});
};

try {
  const s = JSON.parse(localStorage.getItem(LS)||'{}');
  if(s.best!=null) el('tscore').textContent = 'Best: '+s.best+'/'+s.total;
} catch(e){}
</script>
</body>
</html>
